<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetheris Quant v0.6 Testnet</title><style>body{margin:0;background:#05080e;color:#edf4ff;font-family:Segoe UI,Arial}main{max-width:1000px;margin:auto;padding:24px}.card{background:#0c1420;border:1px solid #1c2a3c;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.green{color:#4ee6a5}.red{color:#ff6d7a}.yellow{color:#ffd166}input,select,button{width:100%;box-sizing:border-box;background:#08101a;color:#edf4ff;border:1px solid #26374e;border-radius:9px;padding:10px;margin:5px 0}button{cursor:pointer;font-weight:700}.muted{color:#91a6bf;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;background:#08101a;padding:12px;border-radius:10px}</style></head><body><main><h1>AETHERIS QUANT <span class="green">v0.6</span></h1><div class="muted">Binance Futures Testnet Execution Console — no live-money execution</div><div class="card"><h3>Connection</h3><div id="status">Loading…</div><button onclick="status()">Refresh status</button></div><div class="card"><h3>Order preview</h3><div class="grid"><input id="symbol" value="BTCUSDT" placeholder="Symbol"><select id="side"><option>BUY</option><option>SELL</option></select><input id="qty" type="number" step="any" value="0.001" placeholder="Quantity"><input id="lev" type="number" min="1" max="3" value="1" placeholder="Leverage"><input id="sl" type="number" step="any" placeholder="Stop loss (optional)"><input id="tp" type="number" step="any" placeholder="Take profit (optional)"></div><button onclick="preview()">Preview only</button><pre id="preview">No preview yet.</pre></div><div class="card"><h3>Testnet execution</h3><p class="yellow">Execution is blocked unless ENABLE_TESTNET_EXECUTION=true in your local .env.</p><button onclick="execute()">Send TESTNET order</button><button onclick="cancelAll()">Emergency cancel all for symbol</button><pre id="result">No execution attempted.</pre></div></main><script>const $=x=>document.getElementById(x);function req(){return{symbol:$('symbol').value.trim().toUpperCase(),side:$('side').value,quantity:Number($('qty').value),leverage:Number($('lev').value),stop_loss:$('sl').value?Number($('sl').value):null,take_profit:$('tp').value?Number($('tp').value):null}}async function status(){try{const x=await(await fetch('/api/testnet/status')).json();const a=x.account||{};$('status').innerHTML=`Reachable: <b class="${x.reachable?'green':'red'}">${x.reachable?'YES':'NO'}</b><br>Credentials: <b>${x.configured?'CONFIGURED':'MISSING'}</b><br>Authenticated: <b class="${x.authenticated?'green':'yellow'}">${x.authenticated?'YES':'NO'}</b><br>Execution: <b class="${x.execution_enabled?'yellow':'green'}">${x.execution_enabled?'ENABLED':'LOCKED'}</b><br>Wallet: ${a.totalWalletBalance??'—'}<br>Available: ${a.availableBalance??'—'}${x.auth_error?`<br><span class="red">${x.auth_error}</span>`:''}`}catch(e){$('status').textContent=e}}async function preview(){const r=await fetch('/api/testnet/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req())});$('preview').textContent=JSON.stringify(await r.json(),null,2)}async function execute(){if(!confirm('Send this order to Binance FUTURES TESTNET?'))return;const r=await fetch('/api/testnet/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req())});$('result').textContent=JSON.stringify(await r.json(),null,2);status()}async function cancelAll(){if(!confirm('Cancel all TESTNET orders for this symbol?'))return;const r=await fetch('/api/testnet/cancel-all/'+encodeURIComponent(req().symbol),{method:'DELETE'});$('result').textContent=JSON.stringify(await r.json(),null,2)}status()</script></body></html>
