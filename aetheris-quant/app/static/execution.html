<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetheris Quant v0.8 · Execution Brain</title><style>
:root{color-scheme:dark;--bg:#05080e;--p:#0c1420;--l:#1d2c40;--t:#edf4ff;--m:#91a6bf;--g:#4ee6a5;--r:#ff6d7a;--y:#ffd166;--b:#69a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Segoe UI,Arial}header{padding:18px 24px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:20px;font-weight:900;letter-spacing:.08em}.blue{color:var(--b)}.muted{color:var(--m)}main{padding:16px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px}.status{grid-column:span 12}.account{grid-column:span 4}.positions{grid-column:span 8}.orders{grid-column:span 6}.events{grid-column:span 6}.title{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--m);margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:11px;background:#08101a;border:1px solid #172638;border-radius:11px;color:var(--m);font-size:12px}.metric b{display:block;color:var(--t);font-size:16px;margin-top:5px}.green{color:var(--g)!important}.red{color:var(--r)!important}.yellow{color:var(--y)!important}button{background:#0a111b;color:var(--t);border:1px solid #26374e;border-radius:9px;padding:9px 13px;cursor:pointer;margin-right:6px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #182535;text-align:left}.scroll{max-height:420px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid #182535;font-size:12px}.event small{color:var(--m)}@media(max-width:1000px){.account,.positions,.orders,.events{grid-column:span 12}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="brand">AETHERIS QUANT <span class="blue">v0.8</span></div><div class="muted">Realtime Execution Brain · BINANCE FUTURES TESTNET</div></div><div><button onclick="startBrain()">Start stream</button><button onclick="reconcile()">Reconcile</button><button onclick="stopBrain()">Stop stream</button><button onclick="location.href='/'">Dashboard</button></div></header>
<main>
<div class="card status"><div class="title">Execution stream</div><div class="grid"><div class="metric">Brain<b id="running">—</b></div><div class="metric">WebSocket<b id="connected">—</b></div><div class="metric">Order updates<b id="ordersCount">0</b></div><div class="metric">Reconnects<b id="reconnects">0</b></div></div><div id="err" class="muted" style="margin-top:9px"></div></div>
<div class="card account"><div class="title">Testnet account</div><div id="account" class="muted">Loading…</div></div>
<div class="card positions"><div class="title">Realtime positions</div><div class="scroll"><table><thead><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Mark</th><th>uPnL</th><th>Lev</th></tr></thead><tbody id="positions"></tbody></table></div></div>
<div class="card orders"><div class="title">Open regular orders</div><div class="scroll"><table><thead><tr><th>Symbol</th><th>Side</th><th>Type</th><th>Status</th><th>Qty</th></tr></thead><tbody id="openOrders"></tbody></table></div></div>
<div class="card events"><div class="title">Realtime execution events</div><div id="events" class="scroll"></div></div>
</main>
<script>
const $=x=>document.getElementById(x);const fmt=x=>x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:8});
async function req(url,opt){const r=await fetch(url,opt);const x=await r.json();if(!r.ok)throw new Error(x.detail||JSON.stringify(x));return x}
function render(s){$('running').textContent=s.running?'RUNNING':'STOPPED';$('running').className=s.running?'green':'yellow';$('connected').textContent=s.connected?'CONNECTED':'DISCONNECTED';$('connected').className=s.connected?'green':'red';$('ordersCount').textContent=s.order_updates||0;$('reconnects').textContent=s.reconnects||0;$('err').textContent=s.last_error?`Last error: ${s.last_error}`:`Last event: ${s.last_event||'—'} · Last reconcile: ${s.last_reconcile||'—'}`;const a=s.account||{};$('account').innerHTML=`Wallet: <b>$${fmt(a.wallet_balance)}</b><br>Available: <b>$${fmt(a.available_balance)}</b><br>Unrealized P/L: <b>$${fmt(a.unrealized_pnl)}</b><br><br>Account updates: <b>${s.account_updates||0}</b>`;$('positions').innerHTML=(s.positions||[]).map(p=>`<tr><td><b>${p.symbol}</b></td><td>${p.positionAmt}</td><td>${p.entryPrice}</td><td>${p.markPrice||'—'}</td><td>${p.unRealizedProfit||'—'}</td><td>${p.leverage||'—'}x</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No open testnet positions.</td></tr>';$('openOrders').innerHTML=(s.open_orders||[]).map(o=>`<tr><td><b>${o.symbol}</b></td><td>${o.side}</td><td>${o.type}</td><td>${o.status}</td><td>${o.origQty}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No regular open orders.</td></tr>';$('events').innerHTML=(s.events||[]).slice().reverse().map(e=>`<div class="event"><b>${e.type}</b> ${e.symbol||''} ${e.status||''}<br><small>${e.time}${e.error?' · '+e.error:''}</small></div>`).join('')||'<div class="muted">Waiting for events…</div>'}
async function load(){try{render(await req('/api/execution/status'))}catch(e){$('err').textContent=e}}
async function reconcile(){try{render(await req('/api/execution/reconcile',{method:'POST'}))}catch(e){alert(e)}}
async function startBrain(){try{const x=await req('/api/execution/start',{method:'POST'});render(x.state)}catch(e){alert(e)}}
async function stopBrain(){try{render(await req('/api/execution/stop',{method:'POST'}))}catch(e){alert(e)}}
load();setInterval(load,2000);
</script></body></html>
