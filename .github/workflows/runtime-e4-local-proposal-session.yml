name: E4 Explicit Local Ollama Proposal Session - No Cloud Fallback
on:
  push:
    branches: [feat/e4-explicit-local-model-proposal-session-20261027]
  pull_request:
    branches: [test/e4-free-model-route-admission-20261027]
    paths:
      - 'tools/enterprise/e3_factory/e4_local_proposal_session.py'
      - 'tools/enterprise/e3_factory/test_e4_local_proposal_session.py'
      - '.github/workflows/runtime-e4-local-proposal-session.yml'
      - 'docs/runtime/e4-local-proposal-session-20261027.md'
permissions:
  contents: read
jobs:
  local-only-consent-and-budget-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact head and real local adviser integration guards (provider mocked)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_local_proposal_session.py -v
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_free_route_admission.py -v
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e36_free_model_router.py -v
          python -m py_compile tools/enterprise/e3_factory/e4_local_proposal_session.py
