name: Runtime S0-D Signed Principal JDBC Write and Revocation Race
on:
  pull_request:
    branches:
      - security/s0-disposable-versioned-migration-rehearsal-20261029
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimeVerifiedTaskPlanningProbe.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeVerifiedTaskPlanningProbeTest.java'
      - '.github/workflows/runtime-s0-jdbc-planning-race.yml'
      - 'docs/security/RUNTIME_S0_SIGNED_JDBC_PLANNING_RACE_20261029.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-s0-d-jdbc-race-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-owner-jdbc-revocation-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: writeprobe_disposable
          POSTGRES_USER: writeprobe_ci
          POSTGRES_PASSWORD: disposable_ci_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U writeprobe_ci -d writeprobe_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AETHERIS_WRITE_JDBC_MUST_RUN: 'yes'
      AETHERIS_WRITE_DISPOSABLE_ONLY: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: writeprobe_disposable
      PGUSER: writeprobe_ci
      PGPASSWORD: disposable_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact head source and unchanged deny gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('orchestrator-service/src/main/java/io/aetheris/orchestrator')
          plan=(root/'security/RuntimeVerifiedTaskPlanningProbe.java').read_text()
          for token in ('VerifiedPrincipal principal', 'principal.identityUid()',
                        'principal.hasScope("orchestrator:write")',
                        'FOR SHARE OF tenant, project, tm, pm',
                        "SET state = 'PLANNING'", "state = 'QUEUED'",
                        "owner_verified_at IS NOT NULL",
                        'Connection.TRANSACTION_READ_COMMITTED',
                        'version = version + 1'):
              assert token in plan, token
          for forbidden in ('@Component','@Bean','request.getHeader(',
                            'System.getenv(', 'SECURITY DEFINER', 'commit()', 'rollback()'):
              assert forbidden not in plan, forbidden
          assert 'private VerifiedPrincipal(' in (root/'security/RuntimePinnedPrincipalVerifier.java').read_text()
          http=(root/'api/OwnerlessTaskMissionHttpFilter.java').read_text()
          assert '@Component' in http and 'SC_NOT_FOUND' in http
          event=(root/'task/TaskEventStreamService.java').read_text()
          assert 'globalEmitters' not in event and 'subscribeAll(' not in event
          assert 'spring.jpa.hibernate.ddl-auto=update' in Path('orchestrator-service/src/main/resources/application.properties').read_text()
          assert not (root/'api/RuntimeVerifiedTaskPlanningController.java').exists()
          print('AETHERIS_S0_D_SIGNED_OWNER_WRITE_PROBE_NOT_HTTP_EXPOSED_PASS')
          PY
      - name: Prepare exclusively disposable PostgreSQL16 from review candidates
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = true
          test "${AETHERIS_WRITE_JDBC_MUST_RUN}" = yes
          test "${AETHERIS_WRITE_DISPOSABLE_ONLY}" = yes
          test "${PGHOST}" = 127.0.0.1
          test "${PGDATABASE}" = writeprobe_disposable
          test "${PGUSER}" = writeprobe_ci
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -1 -v ON_ERROR_STOP=1             -f tests/security/migration-candidates/fixtures/jpa_shaped_tasks_baseline.sql             -f tests/security/migration-candidates/V1__review_tenant_project_registry.sql             -f tests/security/migration-candidates/V2__review_additive_task_owner_binding.sql
          test "$(psql -X -A -t -c "SELECT COUNT(*) FROM registry_tenants")" = 0
          test "$(psql -X -A -t -c "SELECT COUNT(*) FROM aetheris_tasks")" = 0
          echo AETHERIS_S0_D_PG16_DISPOSABLE_SCHEMA_NOT_DEPLOYED_PASS
      - name: Actual sealed RS256 JWT, JDBC CAS and two-connection revoke-race Java tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml             -Dtest=RuntimeVerifiedTaskPlanningProbeTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskMissionHttpFilterTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          grep -Fq 'Stage45 NO_GO' docs/security/RUNTIME_S0_SIGNED_JDBC_PLANNING_RACE_20261029.md
          echo AETHERIS_S0_D_ACTUAL_RS256_PG16_TWO_CONNECTION_REVOCATION_TESTS_PASS
      - name: No production schema, external task HTTP or release advancement
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -A -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name IN ('flyway_schema_history','identity_accounts','users')")" = 0
          test "$(psql -X -A -t -c "SELECT COUNT(*) FROM aetheris_tasks WHERE owner_identity_uid IS NULL")" -ge 1
          echo AETHERIS_S0_D_REVIEW_ONLY_STAGE45_NO_GO_PASS
