name: Runtime Signed Principal Verification

on:
  pull_request:
    branches:
      - security/runtime-jwt-issuer-audience-20261013
      - security/runtime-jwt-principal-verifier-20261013
      - security/owner-bound-task-data-20261013
      - main
    paths:
      - 'orchestrator-service/pom.xml'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/**'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/**'
      - 'docs/security/runtime-identity-verifier.md'
      - '.github/workflows/runtime-signed-principal.yml'

permissions:
  contents: read

jobs:
  signed-owner-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact draft revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test signed principal verifier and preserved server-side quarantine
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=VerifiedOwnerTaskReadTest,RuntimeAccessTokenVerifierTest,OwnerBoundResourcePolicyTest,OwnerSensitiveApiQuarantineFilterTest,OwnerSensitiveApiQuarantineHttpTest test
  full-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact draft revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run full orchestrator regression
        run: ./mvnw -f orchestrator-service/pom.xml -B test
