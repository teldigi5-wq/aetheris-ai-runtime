name: Runtime Stage 45.5.14 Signed Key Custody and Broker Challenge Lab

on:
  pull_request:
    branches:
      - security/stage45-fixed-broker-recovery-20261014
      - main
    paths:
      - 'tests/sandbox/stage45_key_custody.go'
      - 'tests/sandbox/stage45_key_custody_test.go'
      - 'tests/sandbox/stage45_kill_broker_protocol.go'
      - 'tests/sandbox/stage45_kill_broker_protocol_test.go'
      - 'tests/sandbox/stage45_fixed_kill_broker.go'
      - 'tests/sandbox/stage45_unprivileged_watch_verifier.go'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticSeparatedKillBrokerIT.java'
      - 'docs/security/stage45-key-custody.md'
      - '.github/workflows/runtime-stage45-key-custody.yml'

permissions:
  contents: read

jobs:
  pinned-signing-keys-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify ephemeral key inode custody and challenge protocol
        run: |
          go test -v tests/sandbox/stage45_fixed_kill_broker.go \
            tests/sandbox/stage45_broker_recovery.go \
            tests/sandbox/stage45_kill_broker_protocol.go \
            tests/sandbox/stage45_key_custody.go \
            tests/sandbox/stage45_key_custody_test.go \
            tests/sandbox/stage45_kill_broker_protocol_test.go \
            tests/sandbox/stage45_broker_recovery_test.go
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Existing JPA STOP and signed issuer policy
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntheticSupervisorPulseLabJpaTest,SyntheticHostStopFenceLabJpaTest test

  restricted-uid-challenge-postgresql-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stage45-synthetic-key-ci-only
          POSTGRES_DB: aetheris_key_custody_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_key_custody_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_BROKER_CI: 'true'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify restricted verifier identity and disposable Docker
        run: |
          go version
          id nobody
          docker info --format '{{.ServerVersion}}'
          sudo -n true
      - name: Build separate key-pinned challenge verifier and fixed broker
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-unprivileged-verifier" \
            tests/sandbox/stage45_unprivileged_watch_verifier.go \
            tests/sandbox/stage45_kill_broker_protocol.go \
            tests/sandbox/stage45_host_watch_state.go \
            tests/sandbox/stage45_key_custody.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-kill-broker" \
            tests/sandbox/stage45_fixed_kill_broker.go \
            tests/sandbox/stage45_broker_recovery.go \
            tests/sandbox/stage45_kill_broker_protocol.go \
            tests/sandbox/stage45_key_custody.go
          chmod 755 "$RUNNER_TEMP/stage45-unprivileged-verifier" "$RUNNER_TEMP/stage45-kill-broker"
      - name: Pull digest-pinned synthetic image outside networkless workload
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Verify signed broker challenge, key fingerprint, STOP and deadman on disposable PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_key_custody_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: stage45-synthetic-key-ci-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Daetheris.stage45.verifier.bin="$RUNNER_TEMP/stage45-unprivileged-verifier" \
            -Daetheris.stage45.broker.bin="$RUNNER_TEMP/stage45-kill-broker" \
            -Dtest=SyntheticSeparatedKillBrokerIT,SyntheticSupervisorPulseLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator regression suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
