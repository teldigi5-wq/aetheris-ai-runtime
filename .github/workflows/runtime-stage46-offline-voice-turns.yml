name: Runtime Stage 46.7 Synthetic Offline Voice Turn Lifecycle

on:
  pull_request:
    branches:
      - feature/stage46-offline-speech-artifact-review-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraOfflineVoiceTurnCoordinator.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraOfflineVoiceTurnCoordinatorTest.java'
      - 'docs/runtime/stage46-offline-voice-turn-lifecycle.md'
      - '.github/workflows/runtime-stage46-offline-voice-turns.yml'

permissions:
  contents: read

jobs:
  bounded-synthetic-turn-and-stop-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Voice boundaries, ticket replay, STOP, erasure and prior speech regressions
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  no-device-integration-or-executable-transcripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify no direct device, network, shell or Spring entry point introduced
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraOfflineVoiceTurnCoordinator.java')
          source=path.read_text(encoding='utf-8')
          forbidden=('javax.sound.', 'TargetDataLine', 'SourceDataLine', 'java.net.',
                     'ProcessBuilder', 'Runtime.getRuntime()', '@Component', '@Service',
                     '@RestController', 'Desktop.getDesktop()', 'Files.write(')
          assert not any(fragment in source for fragment in forbidden), 'PROHIBITED_DEVICE_OR_COMMAND_ENTRY_POINT'
          assert '"ci-synthetic-stt"' in source and '"ci-synthetic-tts"' in source
          assert 'Arrays.fill(privateCopy, (byte) 0)' in source
          assert 'Arrays.fill(utterance, (byte) 0)' in source
          print('STAGE46_7_SYNTHETIC_ONLY_ENTRY_POINT_CHECK_PASS')
          PY

  immutable-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run Stage 45 release-policy regression
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-7-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-7-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as file:
              report=json.load(file)
          assert report['decision']=='NO_GO' and len(report['release_blockers'])==13
          assert report['production_pilot_authorized'] is False
          assert report['desktop_actions_authorized'] is False
          assert report['agent_command_execution_authorized'] is False
          print('STAGE46_7_PRODUCTION_AND_PHYSICAL_VOICE_NO_GO')
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test
