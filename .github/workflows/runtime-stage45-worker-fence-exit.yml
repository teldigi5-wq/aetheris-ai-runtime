name: Runtime Stage 45.5.5 Worker Fence and Signed Exit Lab

on:
  pull_request:
    branches:
      - security/stage45-synthetic-oci-worker-lifecycle-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/WorkerSideFenceVerifierLab.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticOciExitReceiptLab.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxJobReservationEntity.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/WorkerSideFenceVerifierLabJpaTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticOciExitReceiptLabTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticOciWorkerLifecycleIT.java'
      - 'docs/security/stage45-worker-fence-exit-evidence.md'
      - '.github/workflows/runtime-stage45-worker-fence-exit.yml'

permissions:
  contents: read

jobs:
  independent-worker-policy-h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify JPA worker-side fence, authorization and signed exit receipts
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=WorkerSideFenceVerifierLabJpaTest,SyntheticOciExitReceiptLabTest,SyntheticOciSleepProfilePlanTest test

  signed-real-oci-postgresql-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-worker-fence-ci-only
          POSTGRES_DB: aetheris_worker_fence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_worker_fence_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_OCI_LIFECYCLE_CI: 'true'
    steps:
      - name: Checkout pinned PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Docker runtime version
        run: docker info --format '{{.ServerVersion}}'
      - name: Pull immutable OCI fixture before isolation
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Test real OCI stop with re-checked worker fence and signed exit observation
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_worker_fence_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-worker-fence-ci-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dtest=SyntheticOciWorkerLifecycleIT,WorkerSideFenceVerifierLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete orchestrator test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
