name: Runtime Stage 46.11 Synthetic Host Containment Lab

on:
  pull_request:
    branches:
      - feature/stage46-synthetic-voice-process-isolation-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticHostLimits.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticProcessSpeechBoundary.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraSyntheticHostLimitsTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraSyntheticWindowsPortabilityTest.java'
      - 'docs/runtime/stage46-synthetic-host-containment-lab.md'
      - '.github/workflows/runtime-stage46-host-containment-lab.yml'

permissions:
  contents: read

jobs:
  linux-kernel-resource-limit-and-adversarial-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify installed prlimit and readable Linux kernel resource limits
        run: |
          test -x /usr/bin/prlimit
          test -r /proc/self/limits
          test ! -L /usr/bin/prlimit
      - name: Test real Linux child limits, timeout and prior voice controls
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  windows-synthetic-portability-not-containment-certification:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test Windows child spawn, synthetic timeout kill and Linux-policy denial
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -Dtest=SyntraSyntheticWindowsPortabilityTest test

  fixed-no-go-release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Stage 45 immutable NO_GO regression
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-11-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-11-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as file: report=json.load(file)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_11_LINUX_LAB_AND_WINDOWS_PRODUCTION_NO_GO")
          PY

  complete-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  static-synthetic-only-and-resource-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check no new microphone, model or desktop execution adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/voice")
          host=(p/"SyntraSyntheticHostLimits.java").read_text()
          parent=(p/"SyntraSyntheticProcessSpeechBoundary.java").read_text()
          assert 'Profile.PORTABLE_SYNTHETIC_ONLY' in parent
          assert 'Profile.LINUX_RLIMIT_LAB' in parent
          assert 'command.environment().clear()' in parent
          assert 'child.destroyForcibly()' in parent
          assert all(s in host for s in ("--cpu=5", "--as=4294967296", "--nofile=128", 'linuxLabAvailable()'))
          forbidden=("@Component","@RestController","@Service","javax.sound.",
                     "TargetDataLine","SourceDataLine","Desktop.getDesktop()",
                     "SyntraLoopbackModelClient","OwnerPermit","VoiceSessionService")
          assert not any(s in host or s in parent for s in forbidden)
          print("STAGE46_11_TEST_ONLY_RLIMIT_NO_DEVICE_ENTRY")
          PY
