name: Enterprise E3.8B Real Hermes3 3B CPU Browser Repair Evaluation

on:
  pull_request:
    branches:
      - feature/enterprise-e38-model-expansion-budget-gates-20261020
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - 'docs/runtime/enterprise-e38b-hermes-real-inference.md'
      - '.github/workflows/runtime-enterprise-e38b-hermes-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-boundary-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e38b_hermes_inference.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34b_real_inference.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34_model_adviser.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_heuristic_repair.py' -v

  real-model-three-frozen-source-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AETHERIS_E38B_REAL_MODEL_CI_OPT_IN: 'yes'
      MODEL_IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build original CSS 3D website inside inherited network-disabled worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Verify original generated source checksums
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Install independent Chromium on disposable CI test host
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Start pinned Ollama CPU model service with no source mounts
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MODEL_IMAGE"
          docker run -d --name e38b-cpu-model --cpus 2 \
            --memory 5g --memory-swap 5g --pids-limit 128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$MODEL_IMAGE"
          docker inspect e38b-cpu-model > "$RUNNER_TEMP/e38b-model-inspection.json"
          python3 - "$RUNNER_TEMP/e38b-model-inspection.json" <<'PY'
          import json,sys
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text())[0]
          config=obj['HostConfig']
          assert config['NanoCpus']==2000000000
          assert config['Memory']==5368709120 and config['MemorySwap']==5368709120
          assert config['PidsLimit']==128 and config['ReadonlyRootfs'] is True
          assert 'ALL' in config['CapDrop']
          assert 'no-new-privileges' in config['SecurityOpt']
          assert config['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          assert not any(x['Destination']=='/workspace' for x in obj['Mounts'])
          print('E38B_REAL_MODEL_DOCKER_LIMITS_AND_LOOPBACK_BIND_VERIFIED')
          PY
      - name: Pull actual Hermes 3B public weights into ephemeral Ollama volume
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 420s \
            docker exec e38b-cpu-model ollama pull hermes3:3b
          docker exec e38b-cpu-model ollama list
          docker image inspect "$MODEL_IMAGE" --format '{{json .RepoDigests}}' > target/e3-factory/e38b-model-image-digests.json
      - name: Three genuine Hermes3B inferences with independent browser failure, validation and scoring
        shell: bash
        run: |
          set -euo pipefail
          for case_id in scroll-24 mobile-940 reduced-boolean; do
            case "$case_id" in
              scroll-*) category=scroll;;
              mobile-*) category=mobile;;
              reduced-*) category=reduced;;
              *) exit 2;;
            esac
            echo "E38B_INDEPENDENT_SEEDED_CASE=$case_id"
            python tools/enterprise/e3_factory/e33_evaluator.py seed "$case_id"
            set +e
            node tools/enterprise/e3_factory/fault_contract.mjs "$category"
            before_rc=$?
            set -e
            if [[ "$before_rc" -eq 0 ]]; then
              echo "E38B_REAL_CHROMIUM_EXPECTED_FAULT_MISSING:$case_id"
              exit 1
            fi
            python tools/enterprise/e3_factory/e33_evaluator.py before "$case_id"
            timeout --signal=TERM --kill-after=5s 150s \
              python tools/enterprise/e3_factory/e38b_hermes_inference.py --case "$case_id"
            kind="$(python3 - "$case_id" <<'PY'
          import json,sys
          from pathlib import Path
          doc=json.loads((Path('target/e3-factory/e38b')/sys.argv[1]/'inference.json').read_text())
          assert doc['modelCalls']==1 and doc['realGeneratedTokens']>=1
          assert doc['ownerApproved'] is False and doc['textWasExecuted'] is False
          assert doc['modelIdentityCryptographicallyAttested'] is False
          print(doc['responseClass'])
          PY
            )"
            policy=MODEL_ABSTAIN_OR_INVALID
            if [[ "$kind" == "TEXT_REPLACEMENT_PROPOSED" ]]; then
              policy=POLICY_REJECTED
              if bash tools/enterprise/e3_factory/run_locked_worker.sh e34-prepare "$category" &&
                 bash tools/enterprise/e3_factory/run_locked_worker.sh e33-apply "$category"; then
                policy=POLICY_ACCEPTED
              fi
            fi
            if [[ "$policy" == "POLICY_ACCEPTED" ]]; then
              set +e
              node tools/enterprise/e3_factory/fault_contract.mjs "$category"
              after_rc=$?
              set -e
              echo "E38B_AFTER_BROWSER_EXIT=$after_rc CASE=$case_id"
            fi
            python tools/enterprise/e3_factory/e38b_evaluator.py score "$case_id" "$policy"
            python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
          done
      - name: Capture real model-container resource snapshot and inspect limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/e3-factory/e38b
          docker stats --no-stream --format '{{json .}}' e38b-cpu-model > target/e3-factory/e38b/model-resource-snapshot.jsonl
          docker inspect e38b-cpu-model > "$RUNNER_TEMP/e38b-model-final-inspection.json"
          python3 - "$RUNNER_TEMP/e38b-model-final-inspection.json" <<'PY'
          import json,sys
          from pathlib import Path
          doc=json.loads(Path(sys.argv[1]).read_text())[0]
          c=doc["HostConfig"]
          assert c["NanoCpus"]==2000000000 and c["Memory"]==5368709120
          assert c["MemorySwap"]==5368709120 and c["PidsLimit"]==128
          assert c["ReadonlyRootfs"] is True and "ALL" in c["CapDrop"]
          assert c["PortBindings"]["11434/tcp"][0]["HostIp"]=="127.0.0.1"
          evidence={"evidenceClass":"E38B_ACTUAL_DOCKER_INSPECT_CPU_CONTAINER",
                    "cpus":2,"memoryLimitBytes":c["Memory"],"pidsLimit":c["PidsLimit"],
                    "readOnlyRoot":True,"capsDropped":True,
                    "listenBind":"127.0.0.1:11434",
                    "snapshotNotPeakMemory":True,"userPcUsed":False}
          Path("target/e3-factory/e38b/model-resource-policy.json").write_text(json.dumps(evidence,indent=2)+"\\n")
          print("E38B_HERMES_DOCKER_RESOURCE_POLICY_VERIFIED")
          PY
      - name: Run original entire Chromium suite on safely restored disposable website
        run: node tools/enterprise/e3_factory/browser_qa.mjs
      - name: Score every real inference without hiding rejected or incorrect responses
        run: |
          python tools/enterprise/e3_factory/e38b_evaluator.py summary
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('target/e3-factory')
          report=json.loads((folder/'e38b/evaluation-summary.json').read_text())
          browser=json.loads((folder/'browser-evidence/qa-report.json').read_text())
          assert report['attempts']==3 and report['realModelResponses']==3
          assert report['mockModelCallsCounted']==0
          assert report['userPcUsed'] is False and report['productionPublished'] is False
          assert report['ownerApprovalGranted'] is False and browser['passed'] is True
          assert browser['errors']==[]
          print('E38B_GENUINE_MODEL_QUERIES_AND_NONEXECUTING_POLICY_CONFIRMED')
          print('E38B_MODEL_ACCEPTED_REPAIRS',
                report['independentBrowserVerifiedModelRepairs'],'OF',report['attempts'])
          PY
      - name: Cleanup real local-model service and ephemeral weights
        if: always()
        run: docker rm -fv e38b-cpu-model || true
      - name: Upload genuine model JSON, actual browser evidence and policy decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e38b-hermes-3b-three-case-real-inference-evidence
          path: |
            target/e3-factory/e38b/
            target/e3-factory/e33/
            target/e3-factory/e32/
            target/e3-factory/browser-evidence/
            target/e3-factory/e38b-model-image-digests.json
          retention-days: 14
          if-no-files-found: warn

  full-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  explicit-zero-owner-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: No model-controlled command, production action or Stage45 release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('tools/enterprise/e3_factory/e38b_hermes_inference.py').read_text()
          scorer=Path('tools/enterprise/e3_factory/e38b_evaluator.py').read_text()
          for forbidden in ('subprocess','os.system','Popen(', 'urllib.request',
                            'requests.post', 'import socket','exec('):
              assert forbidden not in script, forbidden
          for required in ('AETHERIS_E38B_REAL_MODEL_CI_OPT_IN',
                           'ownerApproved": False','textWasExecuted": False',
                           'modelIdentityCryptographicallyAttested": False'):
              assert required in (script+scorer),required
          transport=Path('tools/enterprise/e3_factory/e34b_real_inference.py').read_text()
          assert 'HTTPConnection("127.0.0.1", 11434, timeout=95)' in transport
          assert 'E38B_REJECTED_MODEL_ADVICE_MUTATED_SOURCE' in scorer
          assert 'fixtureResetPerformedByCIForNextCase' in scorer
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E38B_HERMES_LOCAL_MODEL_ONLY_DISPOSABLE_CI_NO_OWNER_OR_DEPLOYMENT_AUTHORITY')
          PY
