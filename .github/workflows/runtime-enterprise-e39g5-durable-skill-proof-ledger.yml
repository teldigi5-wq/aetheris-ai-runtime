name: Enterprise E3.9G-5 Durable Deny-Only Skill Proof Replay Ledger

on:
  pull_request:
    branches:
      - feature/enterprise-e39g4-signed-candidate-skill-preflight-20261020
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/skills/**'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/skills/**'
      - 'tools/enterprise/**'
      - 'skills/**'
      - '.github/workflows/runtime-enterprise-e39g5-durable-skill-proof-ledger.yml'
      - 'docs/runtime/enterprise-e39g5-durable-skill-proof-ledger.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-database-ledger-adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: E3.9G-5 H2 JPA transaction and signature regressions
        run: ./mvnw -B -ntp -f orchestrator-service/pom.xml '-Dtest=DurableSkillProofInspectionLedgerTest,CandidateSkillProofPreflightTest,GovernedSkillAdviceServiceTest' test

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  pinned-skills-and-model-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m unittest discover -s tools/enterprise -p 'test_e39g3_java_skill_manifest.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39f_forensics.py' -v

  original-real-chromium-and-locked-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original website in existing network-none worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Real Chromium generated-site regression
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
          node tools/enterprise/e3_factory/browser_qa.mjs

  no-production-authorization-or-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Ensure DB primary-key INSERT and no new HTTP, owner or model authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/skills")
          service=(root/"DurableSkillProofInspectionLedger.java").read_text()
          entity=(root/"SkillProofNonceEntity.java").read_text()
          assert "@Transactional" in service and "entityManager.persist(nonce);" in service
          assert "entityManager.flush();" in service and "inspect(proof, exactTaskSummary)" in service
          assert "@Id" in entity and 'name = "nonce_hex"' in entity
          assert "E39G5_UNEXPECTED_PROOF_AUTHORITY_OR_SCOPE" in service
          assert "boolean humanOwnerAuthenticated" in service
          assert "boolean durableActionReplayCertified" in service
          assert "boolean stage45Released" in service
          assert "JpaRepository.save(" not in service
          for code in (service,entity):
              for unsafe in ("@RestController","@PostMapping","Runtime.getRuntime()",
                             "ProcessBuilder(", "HttpClient.newHttpClient()","KeyPairGenerator",
                             "ModelClient", "ChatClient"):
                  assert unsafe not in code,unsafe
          print("E39G5_REAL_DB_NONCE_INSPECTION_ONLY_NOT_OWNER_AUTH_OR_APPROVAL")
          PY
