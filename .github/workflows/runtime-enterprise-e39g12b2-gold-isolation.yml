name: Enterprise E3.9G-12B2 Evaluator Gold Isolation and Typed Repair Gates

on:
  pull_request:
    branches:
      - feature/enterprise-e39g12b-two-site-browser-fault-cert-20261021
    paths:
      - 'tools/enterprise/e3_factory/e39g12b2_*'
      - 'tools/enterprise/e3_factory/test_e39g12b2_*'
      - '.github/workflows/runtime-enterprise-e39g12b2-gold-isolation.yml'
      - 'docs/runtime/enterprise-e39g12b2-trust-boundary.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-boundary-policy-windows-and-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing 14 skills, 26 roles and source pin policy
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
      - name: Adversarial exact-scope policy, source-gold exclusions and no tools
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b2_isolation_policy.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b_two_site_corpus.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12a_coder_model.py' -v

  evaluate-existing-two-site-browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing network-none corpus seeder
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
      - name: Unchanged independent Chromium evaluation
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
          node tools/enterprise/e3_factory/e39g12b_two_site_browser.mjs
      - name: Verify exact independent old study and transit contract conclusions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("target/e3-factory/e39g12b/two-site-browser-summary.json")
          d=json.loads(p.read_text())
          assert (d["sites"],d["distinctFaultCategories"],d["realChromiumObservations"])==(2,4,8)
          assert d["brokenVariantsThatFailedExpectedChecks"]==4
          assert d["referenceVariantsThatPassedExpectedChecks"]==4
          assert d["modelCalls"]==d["modelRepairsCredited"]==0
          assert d["independentExternalCuration"] is False
          print("E39G12B2_INDEPENDENT_EVALUATOR_CONTROLS_UNCHANGED")
          PY

  create-broken-only-model-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seed evaluator truth inside network-none no-capabilities sandbox
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
      - name: Create exact three-file model-visible ZIP from evaluator source
        run: |
          python tools/enterprise/e3_factory/e39g12b2_proposer_bundle.py pack
          python tools/enterprise/e3_factory/e39g12b2_typed_policy.py selftest
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path("target/e3-factory/e39g12b")
          r=json.loads((p/"proposer-export-receipt.json").read_text())
          f=p/"e39g12b2-proposer-broken-only.zip"
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r["sha256"]
          with zipfile.ZipFile(f) as z:
              assert sorted(z.namelist())==[
                "proposer-manifest.json","sites/cityline/index.html","sites/studynest/index.html"]
              assert not any("reference" in x or "gold" in x for x in z.namelist())
          print("E39G12B2_PROPOSER_ZIP_HAS_EXACT_THREE_FILES_ONLY")
          PY
      - name: Upload ONLY broken site bundle, exclude repo and evaluator references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39g12b2-broken-source-only-for-no-checkout-consumer
          path: target/e3-factory/e39g12b/e39g12b2-proposer-broken-only.zip
          if-no-files-found: error
          retention-days: 14

  no-checkout-model-input-consumer:
    needs: create-broken-only-model-input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # DO NOT ADD actions/checkout HERE. This job demonstrates the next
      # model caller can receive ONLY the explicitly exported artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e39g12b2-broken-source-only-for-no-checkout-consumer
          path: received/
      - name: Prove no repository, evaluator source or golden copies are available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          workspace=Path(".")
          assert not (workspace/".git").exists(), "E39G12B2_REPO_CHECKOUT_EXPOSED_TO_MODEL"
          assert not (workspace/"tools").exists(), "E39G12B2_EVALUATOR_CODE_EXPOSED"
          assert not (workspace/"docs").exists(), "E39G12B2_EVALUATOR_DOCS_EXPOSED"
          assert not (workspace/"skills").exists(), "E39G12B2_SKILLS_CONTENT_EXPOSED"
          archives=list(workspace.rglob("*.zip"))
          assert len(archives)==1, "E39G12B2_UNEXPECTED_MODEL_INPUT_ARTIFACTS"
          with ZipFile(archives[0]) as z:
              want=["proposer-manifest.json",
                    "sites/cityline/index.html","sites/studynest/index.html"]
              assert sorted(z.namelist())==want
              d=json.loads(z.read("proposer-manifest.json"))
              assert d["evidenceClass"]=="E39G12B2_MODEL_FACING_ONLY_BROKEN_PUBLIC_SYNTHETIC"
              assert d["referenceVariantsIncluded"] is False
              assert d["goldenReplacementIncluded"] is False
              assert d["ownerApprovalGranted"] is False
              assert d["productionPublished"] is False
              assert d["modelCalls"]==0 and d["modelPatchApplied"] is False
              for site in ("cityline","studynest"):
                  name="sites/"+site+"/index.html"
                  assert hashlib.sha256(z.read(name)).hexdigest()==d["sites"][site]["sha256"]
                  assert len(z.read(name))>1200
          assert not list(workspace.rglob("*reference*"))
          print("E39G12B2_DISTINCT_CI_JOB_NO_GOLD_NO_CHECKOUT_ONLY_TWO_BROKEN_SITES")
          PY

  full-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  no-model-auth-or-deployment-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Document strictly bounded new research trust boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repo=Path("tools/enterprise/e3_factory")
          proposer=(repo/"e39g12b2_proposer_bundle.py").read_text()
          gate=(repo/"e39g12b2_typed_policy.py").read_text()
          workflow=Path(".github/workflows/runtime-enterprise-e39g12b2-gold-isolation.yml").read_text()
          assert 'BUNDLE_NAME="e39g12b2-proposer-broken-only.zip"' in proposer
          assert '"blindHeldOut":False' in proposer
          assert '"goldenReplacementIncluded":False' in proposer
          assert "def validate(proposal:Mapping,broken:bytes)->bytes:" in gate
          assert "check_expression(kind,new)" in gate
          assert "no-checkout-model-input-consumer:" in workflow
          assert "create-broken-only-model-input:" in workflow
          assert "E39G12B2_DISTINCT_CI_JOB_NO_GOLD_NO_CHECKOUT" in workflow
          assert "modelCalls:0" in workflow
          for denied in ("import subprocess","os.system(","Popen(","local_json(","requests.post","import docker"):
              assert denied not in proposer and denied not in gate,denied
          print("E39G12B2_NO_MODEL_CALLS_NO_GOLD_IN_MODEL_BUNDLE_NO_GRANTS")
          PY
