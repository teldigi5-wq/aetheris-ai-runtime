name: Runtime Owner Sensitive API Quarantine

on:
  pull_request:
    branches: [main]
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/OwnerSensitiveApiQuarantineFilter.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/OwnerSensitiveApiQuarantineFilterTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/OwnerSensitiveApiQuarantineHttpTest.java'
      - '.github/workflows/runtime-owner-sensitive-api-quarantine.yml'
      - 'docs/security/owner-task-isolation.md'

permissions:
  contents: read

jobs:
  server-side-owner-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact draft revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run servlet filter, adversarial headers and Spring HTTP integration tests
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=OwnerSensitiveApiQuarantineFilterTest,OwnerSensitiveApiQuarantineHttpTest test
