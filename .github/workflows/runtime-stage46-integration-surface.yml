name: Runtime Stage 46.21 Integration Surface and Minimal Candidate NO_GO

on:
  pull_request:
    branches:
      - feature/stage46-integration-readiness-dry-run-20261016
      - main
    paths:
      - 'tools/security/stage46_integration_surface_gate.py'
      - 'tools/security/test_stage46_integration_surface_gate.py'
      - 'docs/runtime/stage46-minimal-integration-scope.json'
      - 'docs/runtime/stage46-integration-surface-review.md'
      - '.github/workflows/runtime-stage46-integration-surface.yml'

permissions:
  contents: read

jobs:
  real-production-classpath-synthetic-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact draft HEAD without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Inspect compiled synthetic classes and all production Java/installer callers
        run: |
          python3 tools/security/stage46_integration_surface_gate.py \
            --output "$RUNNER_TEMP/stage46-21-inventory-evidence.json"
          python3 - "$RUNNER_TEMP/stage46-21-inventory-evidence.json" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["integration_review_valid"] is True
          assert report["compiled_synthetic_java_count"] == 9
          assert report["java_main_entrypoint_count"] == 2
          assert report["compiled_on_main_classpath"] is True
          assert report["excluded_from_production_artifact"] is False
          assert not report["unapproved_production_java_callers"]
          assert not report["unexpected_main_class_registration"]
          assert not report["unapproved_production_packaging_wiring"]
          assert report["production_authorized"] is False and report["decision"] == "NO_GO"
          print("STAGE46_21_NINE_COMPILED_SYNTHETIC_CLASSES_NOT_A_SIGNED_RELEASE")
          PY
      - name: Adversarial tests of compiled/activated boundary and untrusted spec
        run: python3 -m unittest discover -s tools/security -p test_stage46_integration_surface_gate.py -v

  protected-main-no-merge-conflict-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch main branch only for read-only tree merge simulation
        run: git -c protocol.version=2 fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Re-run Stage 46.20 merge-tree dry-run without merge or push
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/security/stage46_integration_merge_review.py \
            --expected-head "$EXACT_HEAD" \
            --output "$RUNNER_TEMP/stage46-21-main-tree-review.json"
      - name: Verify merge evidence does not turn into production authorization
        run: python3 -m unittest discover -s tools/security -p test_stage46_integration_merge_review.py -v

  windows-original-containment-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile fixed synthetic Java subprocess fixture
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_21_JAVA_FIXTURE_COMPILE_FAILED' }
      - name: Repeat Windows reduced token, Job Object and AppContainer tests
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_21_REDUCED_TOKEN_REGRESSION' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_21_JOB_OBJECT_REGRESSION' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_21_APP_CONTAINER_REGRESSION' }

  full-and-targeted-java-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Targeted synthetic voice, STOP and owner-bound process isolation
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Entire Java orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Entire workstation agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  immutable-thirteen-blockers-and-no-wiring-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify actual Stage 45 immutable NO_GO blocker policy
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-21-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-21-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["decision"] == "NO_GO" and len(data["release_blockers"]) == 13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert data[key] is False, key
          print("STAGE46_21_ALL_THIRTEEN_BLOCKERS_AND_RELEASE_NO_GO")
          PY
      - name: Require genuine static gate, minimal candidate and no side effects
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("docs/runtime/stage46-minimal-integration-scope.json").read_text())
          gate=Path("tools/security/stage46_integration_surface_gate.py").read_text()
          assert s["candidate_policy"] == "MINIMAL_CONSOLIDATION_SPECIFICATION_ONLY_NO_MERGE"
          assert s["controls"]["all_thirteen_stage45_blockers_active"] is True
          assert s["controls"]["production_authorized"] is False
          for name in ("SPRING_ENTRY","DANGEROUS_IMPORT","unapproved_production_java_callers",
                       "unapproved_production_packaging_wiring"):
              assert name in gate
          for name in ("FwpmFilterAdd","git push","git merge ","java.awt.Robot(", "Start-Process"):
              assert name not in gate
          print("STAGE46_21_STATIC_SYNTHETIC_ONLY_NO_PRODUCTION_WIRING")
          PY
