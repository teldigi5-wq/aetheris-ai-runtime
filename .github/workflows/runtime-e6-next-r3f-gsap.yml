name: Enterprise E6 Next React Three Fiber GSAP Integration Proof
on:
  pull_request:
    branches:
      - feat/e6-vetted-gltf-asset-pipeline-20261030
      - feat/e6-next-r3f-gsap-studio-integration-20261030
    paths:
      - '.github/workflows/runtime-e6-next-r3f-gsap.yml'
      - 'tools/enterprise/e6_studio/**'
      - 'docs/runtime/E6_NEXT_R3F_GSAP_ARCHITECTURE_20261030.md'
permissions:
  contents: read
concurrency:
  group: e6-next-r3f-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  next-r3f-gsap-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: SHA-pinned checkout, no write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: All E6 source contracts, GLB generation and exact pin verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s tools/enterprise/e6_studio -p 'test_*.py' -v
          python3 tools/enterprise/e6_studio/generate_reference_gltf.py --generate
          python3 tools/enterprise/e6_studio/generate_reference_gltf.py --verify
          python3 tools/enterprise/e6_studio/next-studio/scripts/build_research_glb.py
          node --check tools/enterprise/e6_studio/next-studio/browser_proof.mjs
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('tools/enterprise/e6_studio/next-studio')
          proof=json.loads((base/'public/research-panel-manifest.json').read_text())
          raw=(base/'public/research-panel.glb').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==proof['sha256']
          assert proof['bytes']==len(raw) and proof['sourceVertices']==36
          assert proof['sourceAuthoredByModel'] is False
          assert proof['blenderExported'] is False
          assert proof['dracoOrMeshoptCompressed'] is False
          assert proof['stage45Go'] is False
          assert "Stage45 NO_GO" in Path('docs/runtime/E6_NEXT_R3F_GSAP_ARCHITECTURE_20261030.md').read_text()
          print('E6_NEXT_OWNED_ASSET_PROVENANCE_NO_CERTIFICATION_PASS')
          PY
      - name: Verify committed lock provenance, audit dependencies, build and emit SBOM
        shell: bash
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          python3 scripts/validate_dependency_lock.py
          # npm ci enforces the tracked lockfile without resolving or rewriting it.
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/target/e6-studio/supply-chain"
          npm sbom --sbom-format cyclonedx > "$GITHUB_WORKSPACE/target/e6-studio/supply-chain/sbom.cdx.json"
          python3 scripts/report_dependency_licenses.py \
            "$GITHUB_WORKSPACE/target/e6-studio/supply-chain/sbom.cdx.json" \
            "$GITHUB_WORKSPACE/target/e6-studio/supply-chain/license-review.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          data=json.loads((Path(os.environ['GITHUB_WORKSPACE'])/'target/e6-studio/supply-chain/sbom.cdx.json').read_text())
          assert data['bomFormat']=='CycloneDX'
          assert isinstance(data.get('components'),list) and data['components']
          print('E6_CYCLONEDX_SBOM_GENERATED_NOT_CERTIFIED')
          PY
          # No automatic fix or dependency upgrades. Nonzero fails the job.
          npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/target/e6-studio/supply-chain/npm-audit.json"
          npm run typecheck
          npm run build
          test -f out/index.html
          test -f out/research-panel.glb
      - name: Install only fixed-version Playwright for real Chromium browser checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/enterprise/e6_studio --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e6_studio/node_modules/.bin/playwright install --with-deps chromium
      - name: Keep previous E6 raw WebGL2 and glTF positive-control suites
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/studio_browser_proof.mjs
          node tools/enterprise/e6_studio/gltf_browser_proof.mjs
      - name: Verify actual exported Next.js + R3F + GSAP page across desktop mobile and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/next-studio/browser_proof.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('target/e6-studio/next-r3f-evidence/report.json').read_text())
          assert report['kind']=='E6_NEXT_REACT_R3F_GSAP_RESEARCH_CONTROL'
          assert report['softwareWebGLNotOwnerGPU'] is True
          assert report['modelCalled'] is False
          assert report['trueGpu60fpsCertified'] is False
          assert report['stage45Go'] is False
          assert report['failures']==[]
          assert len(report['cases'])==3
          assert all(v['noExternalRequests'] for v in report['cases'])
          assert report['cases'][0]['r3fLoaded']
          assert report['cases'][1]['r3fLoaded']
          assert report['cases'][2]['reducedMotionStatic']
          assert report['cases'][2]['canvas']==0
          print('E6_NEXT_R3F_GSAP_REAL_BROWSER_NO_DEPLOY_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e6-next-r3f-gsap-research-not-release
          path: |
            target/e6-studio/storyboard-proof/
            target/e6-studio/gltf-proof/
            target/e6-studio/next-r3f-evidence/
            target/e6-studio/supply-chain/
            tools/enterprise/e6_studio/next-studio/package-lock.json
            tools/enterprise/e6_studio/next-studio/public/research-panel-manifest.json
          if-no-files-found: warn
          retention-days: 7
