name: Runtime Sandbox and SOC Security Verification

on:
  pull_request:
    branches:
      - security/owner-checkpoint-sse-gated-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/**'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/**'
      - 'orchestrator-service/src/main/resources/application.yml'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/**'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/AgentCatalogIntegrationTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/**'
      - 'docs/security/**'
      - '.github/workflows/runtime-sandbox-soc-verification.yml'

permissions:
  contents: read

jobs:
  isolated-sandbox-and-defensive-agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify sandbox escape attempts and defensive SOC catalog
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=WorkspaceContainmentHardeningTest,AgentCatalogIntegrationTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run all Java tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
