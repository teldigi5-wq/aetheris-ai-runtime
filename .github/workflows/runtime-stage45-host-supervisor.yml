name: Runtime Stage 45.5.9 Host STOP Supervisor Lab

on:
  pull_request:
    branches:
      - security/stage45-launch-race-recovery-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticHostStopFenceLab.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticHostStopFenceLabJpaTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticHostStopSupervisorIT.java'
      - 'docs/security/stage45-host-stop-supervisor.md'
      - '.github/workflows/runtime-stage45-host-supervisor.yml'

permissions:
  contents: read

jobs:
  fail-closed-host-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify signed reservations and host fail-closed STOP policy with JPA
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntheticHostStopFenceLabJpaTest,SyntheticOciExitReceiptLabTest test

  independent-host-termination-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-stage45-host-only
          POSTGRES_DB: aetheris_stage45_host_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_stage45_host_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_HOST_SUPERVISOR_CI: 'true'
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Confirm disposable OCI daemon
        run: docker info --format '{{.ServerVersion}}'
      - name: Pull pinned synthetic fixture before isolated execution
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Test host-side enforced STOP and stale epoch with disposable PostgreSQL 16
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_stage45_host_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-stage45-host-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dtest=SyntheticHostStopSupervisorIT,SyntheticHostStopFenceLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run full orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
