name: E4 Zero-Cost Model Route Admission — Advisory Only
on:
  pull_request:
    branches: [test/e39h-webgl-context-loss-recovery-qa-20261027]
    paths:
      - '.github/workflows/runtime-e4-route-admission.yml'
      - 'tools/enterprise/e3_factory/e4_free_route_admission.py'
      - 'tools/enterprise/e3_factory/test_e4_free_route_admission.py'
      - 'docs/runtime/e4-free-route-admission-20261027.md'
permissions:
  contents: read
jobs:
  independent-no-execution-admission:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: No-fallback zero-cost source and exact-head contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_free_route_admission.py -v
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e36_free_model_router.py -v
          python -m py_compile tools/enterprise/e3_factory/e4_free_route_admission.py
