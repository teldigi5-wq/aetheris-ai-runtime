name: Runtime Stage 46.14 Windows AppContainer Synthetic Capability Lab (Network Egress Unverified)

on:
  pull_request:
    branches:
      - feature/stage46-restricted-token-preflight-20261015
      - main
    paths:
      - 'workstation-agent/packaging/stage46/WindowsSyntheticAppContainerLab.cpp'
      - 'workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1'
      - 'docs/runtime/stage46-windows-appcontainer-capability-lab.md'
      - '.github/workflows/runtime-stage46-appcontainer-capability-lab.yml'

permissions:
  contents: read

jobs:
  windows-native-appcontainer-file-and-bounded-loopback-probe:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify AppContainer identity, file denial, bounded loopback outcome and kill
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_14_WINDOWS_APP_CONTAINER_DENIAL_FAILED' }

  prior-windows-reduced-token-and-job-regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Build existing fixed Java probe
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_14_JAVA_COMPILE_FAILURE' }
      - name: Preserve reduced-token and Windows Job Object tests
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_13_REGRESSION_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_REGRESSION_FAILED' }

  linux-synthetic-voice-and-process-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Existing security and synthetic voice tests
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test

  immutable-13-blocker-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify production policy
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-14-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-14-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fh: d=json.load(fh)
          assert d["decision"]=="NO_GO" and len(d["release_blockers"])==13
          assert d["production_pilot_authorized"] is False
          assert d["agent_command_execution_authorized"] is False
          assert d["desktop_actions_authorized"] is False
          print("STAGE46_14_PRODUCTION_AND_OWNER_PC_NO_GO")
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Workstation agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  static-appcontainer-no-device-and-no-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify fixed AppContainer zero capabilities and no runtime integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("workstation-agent/packaging/stage46")
          c=(p/"WindowsSyntheticAppContainerLab.cpp").read_text()
          test=(p/"Test-SyntraWindowsAppContainerLab.ps1").read_text()
          required=("CreateAppContainerProfile", "DeleteAppContainerProfile",
                    "PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES",
                    "capabilities.CapabilityCount = 0",
                    "TokenIsAppContainer", "JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE",
                    "JOB_OBJECT_LIMIT_ACTIVE_PROCESS", "CREATE_SUSPENDED",
                    "AssignProcessToJobObject", "ResumeThread",
                    "GetNamedSecurityInfoW", "SetNamedSecurityInfoW",
                    "INADDR_LOOPBACK", "GetExitCodeProcess")
          assert all(s in c for s in required), "INCOMPLETE_APP_CONTAINER_LAB"
          banned=("TargetDataLine", "SourceDataLine", "javax.sound.",
                  "SyntraLoopbackModelClient", "OwnerPermit",
                  "VoiceSessionService", "ShellExecute", "WinExec",
                  "InternetOpen", "HttpSendRequest")
          assert not any(s in c for s in banned), "UNAUTHORIZED_RUNTIME_ENTRY"
          assert "RUNNER_TEMP" in test
          assert "LOOPBACK_NOT_CONNECTED_NETWORK_EGRESS_NOT_CERTIFIED" in c
          assert "LOOPBACK_TIMEOUT_NETWORK_POLICY_INCONCLUSIVE" in c
          print("STAGE46_14_FIXED_NATIVE_APP_CONTAINER_NO_DEVICE")
          PY
