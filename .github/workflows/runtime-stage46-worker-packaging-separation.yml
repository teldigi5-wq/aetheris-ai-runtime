name: Runtime Stage 46.23 Synthetic Worker Packaging Separation

on:
  pull_request:
    branches:
      - feature/stage46-jar-packaging-evidence-20261016
      - main
    paths:
      - 'orchestrator-service/pom.xml'
      - 'tools/security/stage46_test_scoped_worker_packaging_gate.py'
      - 'tools/security/test_stage46_test_scoped_worker_packaging_gate.py'
      - 'docs/runtime/stage46-test-scoped-worker-packaging.md'
      - '.github/workflows/runtime-stage46-worker-packaging-separation.yml'

permissions:
  contents: read

jobs:
  real-default-and-opt-in-maven-package-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Clean and package DEFAULT orchestrator without lab profile
        run: ./mvnw -B -f orchestrator-service/pom.xml -DskipTests clean package
      - name: Verify no synthetic fixture archive is built by default and main classes remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("orchestrator-service/target")
          assert not list(p.glob("*synthetic-worker-lab-only.jar")), "DEFAULT_PRODUCTION_BUILD_CREATED_LAB_ARCHIVE"
          classes=p/"classes/io/aetheris/orchestrator/voice"
          for name in ("SyntraSyntheticPcmWorkerMain.class","SyntraSyntheticJobProbeMain.class"):
              assert (classes/name).is_file(), "FIXED_WINDOWS_TEST_FIXTURE_MUST_STAY_COMPILED"
          print("STAGE46_23_DEFAULT_BUILD_LAB_JAR_NOT_PRESENT")
          PY
      - name: Build only the opt-in UNATTACHED lab classifier without test execution
        run: ./mvnw -B -f orchestrator-service/pom.xml -Psynthetic-worker-lab -DskipTests package
      - name: Inspect both physical ZIP files and effective Maven configuration
        run: |
          python3 tools/security/stage46_test_scoped_worker_packaging_gate.py \
            --spec docs/runtime/stage46-minimal-integration-scope.json \
            --pom orchestrator-service/pom.xml \
            --orchestrator-jar orchestrator-service/target/orchestrator-service-0.2.0-SNAPSHOT.jar \
            --lab-fixture-jar orchestrator-service/target/orchestrator-service-0.2.0-SNAPSHOT-synthetic-worker-lab-only.jar \
            --compiled-classes-dir orchestrator-service/target/classes \
            --default-build-fixture-present false \
            --output "$RUNNER_TEMP/stage46-23-packaging-review.json"
      - name: Adversarial Maven and JAR packaging tests
        run: python3 -m unittest discover -s tools/security -p test_stage46_test_scoped_worker_packaging_gate.py -v
      - name: Do not publish, upload, install or deploy compiled JARs
        run: echo "STAGE46_23_LAB_ONLY_ARTIFACT_NOT_ATTACHED_NOT_RELEASED"

  full-java-voice-and-workstation-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Targeted existing Java synthetic process/STOP and owner isolation cases
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Complete orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Complete workstation agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  windows-real-synthetic-containment-and-fixture-compile:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile fixed workers without ordinary JAR distribution
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_23_WINDOWS_TEST_COMPILE_FAILED' }
      - name: Existing real Job Object and privilege reduced child testing
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_23_REDUCED_TOKEN_REGRESSION' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_23_JOB_OBJECT_REGRESSION' }
      - name: AppContainer lab boundary and STOP tests only
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_23_APPCONTAINER_REGRESSION' }

  source-policy-and-immutable-release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Existing source/installer prototype wiring audit must remain NO_GO
        run: |
          python3 tools/security/stage46_integration_surface_gate.py
          python3 -m unittest discover -s tools/security -p test_stage46_integration_surface_gate.py -v
      - name: Stage 45 all thirteen production blockers stay active
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-23-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-23-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          assert p["decision"]=="NO_GO" and len(p["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert p[key] is False, key
          print("STAGE46_23_THIRTEEN_RELEASE_BLOCKERS_MERGE_AND_PILOT_NO_GO")
          PY
