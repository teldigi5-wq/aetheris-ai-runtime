name: Runtime Stage 46.1 Offline Syntra Text Companion

on:
  pull_request:
    branches:
      - security/stage45-prepilot-readiness-review-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraLocalTextCompanion.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraLocalTextCompanionTest.java'
      - 'docs/runtime/stage46-offline-syntra-text-companion.md'
      - '.github/workflows/runtime-stage46-local-text-companion.yml'

permissions:
  contents: read

jobs:
  local-offline-conversation-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify pure-local console and underlying signed-consent/STOP policies
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraLocalTextCompanionTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test
      - name: Execute real offline text console from compiled Java classes
        run: |
          printf 'status\nhi sintra\nopen editor\nstop everything\nopen project notes\nquit\n' \
            | java -cp orchestrator-service/target/classes \
              io.aetheris.orchestrator.voice.SyntraLocalTextCompanion \
            > "$RUNNER_TEMP/syntra-stage46-local-demo.txt"
          grep -F 'SPEECH: HARDWARE_GATED; microphone=false; local-STT=false; local-TTS=false' \
            "$RUNNER_TEMP/syntra-stage46-local-demo.txt"
          grep -F 'PREVIEW ONLY: proposal recorded' \
            "$RUNNER_TEMP/syntra-stage46-local-demo.txt"
          grep -F 'STOP: latched. Pending previews invalidated' \
            "$RUNNER_TEMP/syntra-stage46-local-demo.txt"
          grep -F 'STOP: latched. Restarting this demo' \
            "$RUNNER_TEMP/syntra-stage46-local-demo.txt"
          if grep -F 'SIMULATED ONLY: no desktop action executed' "$RUNNER_TEMP/syntra-stage46-local-demo.txt"; then
            echo 'Standalone console unexpectedly approved a proposal' >&2
            exit 1
          fi
          echo STAGE46_OFFLINE_TEXT_CONSOLE_PASS

  no-go-release-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate existing Stage 45 pilot NO-GO invariants
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-no-go.json" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1],encoding="utf-8"))
          assert status['decision']=='NO_GO'
          assert status['agent_command_execution_authorized'] is False
          assert status['desktop_actions_authorized'] is False
          assert status['production_pilot_authorized'] is False
          assert len(status['release_blockers'])==13
          print('STAGE46_PRODUCTION_NO_GO_ENFORCED')
          PY

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: All orchestrator tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Host-agent security tests unchanged
        run: ./mvnw -B -f workstation-agent/pom.xml test
