name: Runtime Stage 45.5.10 Signed Host Watchdog Laboratory

on:
  pull_request:
    branches:
      - security/stage45-host-stop-supervisor-20261014
      - main
    paths:
      - 'tests/sandbox/stage45_host_watchdog.go'
      - 'tests/sandbox/stage45_host_watchdog_test.go'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticSupervisorPulseEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticSupervisorPulseRepository.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticSupervisorPulseLab.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticSupervisorPulseLabJpaTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticSignedHostWatchdogIT.java'
      - 'docs/security/stage45-signed-host-watchdog.md'
      - '.github/workflows/runtime-stage45-signed-host-watchdog.yml'

permissions:
  contents: read

jobs:
  signed-heartbeat-policy-h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Validate signed heartbeat issuer and existing host STOP policy
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntheticSupervisorPulseLabJpaTest,SyntheticHostStopFenceLabJpaTest,SyntheticOciExitReceiptLabTest test

  separate-go-host-watchdog-postgres-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stage45-host-watch-ci-only
          POSTGRES_DB: aetheris_host_watch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_host_watch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_WATCH_CI: 'true'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Validate Go and disposable Docker
        run: |
          go version
          docker info --format '{{.ServerVersion}}'
      - name: Go adversarial Ed25519 heartbeat authentication tests
        run: go test -v tests/sandbox/stage45_host_watchdog.go tests/sandbox/stage45_host_watchdog_test.go
      - name: Build separate CI-only host watchdog executable
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-host-watchdog" tests/sandbox/stage45_host_watchdog.go
          chmod 755 "$RUNNER_TEMP/stage45-host-watchdog"
      - name: Fetch digest-pinned synthetic image outside isolated workload
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Test actual signed-stop and absent-publisher host kill using PostgreSQL 16
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_host_watch_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: stage45-host-watch-ci-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Daetheris.stage45.watchdog.bin="$RUNNER_TEMP/stage45-host-watchdog" \
            -Dtest=SyntheticSignedHostWatchdogIT,SyntheticSupervisorPulseLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
