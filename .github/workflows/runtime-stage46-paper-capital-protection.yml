name: Runtime Stage 46.27 Paper Capital Protection and Company Risk Officer

on:
  pull_request:
    branches:
      - feature/stage46-company-organization-readonly-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperCapitalBudgetService.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperRiskOfficerService.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperRiskDecision.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperTradingService.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/Stage10PaperOrderSimulatorService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/trading/PaperCapitalBudgetServiceTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/Stage10TradingIntegrationTest.java'
      - 'docs/runtime/stage46-paper-capital-protection.md'
      - '.github/workflows/runtime-stage46-paper-capital-protection.yml'

permissions:
  contents: read

jobs:
  actual-paper-risk-and-simulator-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Adversarial stop loss, daily budget and net exposure money management tests
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperCapitalBudgetServiceTest test
      - name: Actual Stage 10 order simulator uses approved money-management notional
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=Stage10TradingIntegrationTest test
      - name: Existing Phase12 trading-risk role and authority tests
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=CompanyOrganizationDirectoryTest,Phase12SpecialistDivisionsIntegrationTest test

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator including paper, specialist and voice regressions
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  existing-quant-testnet-live-host-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test actual Python Quant testnet endpoint allowlist, never contact exchange
        run: python3 -m unittest discover -s aetheris-quant/tests -p test_execution_boundary.py -v
      - name: New capital sizing cannot import exchanges or issue executable orders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/trading")
          pure=(base/"PaperCapitalBudgetService.java").read_text()
          risk=(base/"PaperRiskOfficerService.java").read_text()
          durable=(base/"PaperTradingService.java").read_text()
          simulated=(base/"Stage10PaperOrderSimulatorService.java").read_text()
          assert "PaperCapitalBudgetService.assess" in risk
          assert "decision.approvedNotional()" in durable
          assert "decision.approvedNotional()" in simulated
          assert '"PAPER_ONLY"' in pure
          assert 'exchangeOrderAuthorized' in pure and 'liveMoneyAuthorized' in pure
          for forbidden in ("BinanceTestnetClient", "HttpClient", "RestTemplate", "WebClient",
                            "ProcessBuilder", "Runtime.getRuntime", "marketOrder(",
                            "createOrder(", "@PostMapping", "javax.sound.sampled"):
              assert forbidden not in pure, forbidden
          print("STAGE46_27_NO_LIVE_BROKER_OR_FINANCIAL_PROMISE_IN_MONEY_GATE")
          PY

  windows-inert-containment-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Independently compile CI-only synthetic workers
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_27_WORKER_MODULE_BUILD_FAILED' }
      - name: Existing reduced-token Job Object and AppContainer tests, no real PC
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_27_REDUCED_TOKEN_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_27_JOB_OBJECT_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_27_APPCONTAINER_FAILURE' }

  immutable-thirteen-release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Stage45 policy tests and immutable blocker count
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-27-paper-risk-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-27-paper-risk-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text())
          assert result["decision"]=="NO_GO"
          assert len(result["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert result[key] is False,key
          print("STAGE46_27_THIRTEEN_BLOCKERS_NO_LIVE_MONEY_OWNER_PC_NO_GO")
          PY
