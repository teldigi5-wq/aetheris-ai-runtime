name: Runtime Stage 46.8 Synthetic Read-Only Voice Conversation

on:
  pull_request:
    branches:
      - feature/stage46-offline-voice-turn-lifecycle-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraOfflineVoiceTurnCoordinator.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraVoiceReadOnlyConversationBridge.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraVoiceReadOnlyConversationBridgeTest.java'
      - 'docs/runtime/stage46-readonly-voice-conversation-bridge.md'
      - '.github/workflows/runtime-stage46-readonly-voice-conversation.yml'

permissions:
  contents: read

jobs:
  synthetic-voice-conversation-and-adversarial-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test preview-only conversation, replay protection, revocation and STOP
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  no-production-speech-or-desktop-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Conservative guard that preview cannot become a device, Spring or command adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          folder=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/voice")
          bridge=(folder/"SyntraVoiceReadOnlyConversationBridge.java").read_text(encoding="utf-8")
          coordinator=(folder/"SyntraOfflineVoiceTurnCoordinator.java").read_text(encoding="utf-8")
          forbidden=("@Component","@Service","@RestController","@RequestMapping","ProcessBuilder",
                     "Runtime.getRuntime()","java.net.","javax.sound.","TargetDataLine",
                     "SourceDataLine","Desktop.getDesktop()","Files.write(",
                     "SyntraLoopbackModelClient","OwnerPermit","VoiceSessionService")
          for name,content in (("bridge",bridge),("coordinator",coordinator)):
              assert not any(fragment in content for fragment in forbidden), name+" has a forbidden integration"
          assert "LocalSpeechRuntimePlan.current()" in bridge
          assert "consumeReadOnlyPreview" in bridge and "consumeReadOnlyPreview" in coordinator
          assert "canDeliverReadOnlyReply()" in bridge
          assert "pendingTicket = 0;" in coordinator and "pendingPreview = null;" in coordinator
          assert 'case STOP_LATCHED -> stopReply' in bridge
          print("STAGE46_8_READ_ONLY_NO_DEVICE_NO_DESKTOP_BRIDGE")
          PY

  fixed-release-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preserve every Stage 45 release and desktop security blocker
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-8-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-8-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fh: report=json.load(fh)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_8_PRODUCTION_AND_PHYSICAL_VOICE_NO_GO")
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent Java regression
        run: ./mvnw -B -f workstation-agent/pom.xml test
