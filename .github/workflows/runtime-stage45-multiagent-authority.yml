name: Runtime Stage 45.5.16 Multi-Agent Quota and STOP Authority Lab

on:
  pull_request:
    branches:
      - security/stage45-stop-audit-rollback-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticAgentQuotaEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticAgentQuotaRepository.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticAgentClaimEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticAgentClaimRepository.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SyntheticMultiAgentAuthorityLab.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticMultiAgentAuthorityLabJpaTest.java'
      - 'docs/security/stage45-multiagent-authority-stop.md'
      - '.github/workflows/runtime-stage45-multiagent-authority.yml'

permissions:
  contents: read

jobs:
  synthetic-agent-scope-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Owner-agent STOP and fixed shared budgets on isolated JPA
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntheticMultiAgentAuthorityLabJpaTest,WorkerSideFenceVerifierLabJpaTest,SyntheticHostStopFenceLabJpaTest test

  transactional-multiagent-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-stage45-multiagent-only
          POSTGRES_DB: aetheris_stage45_agents_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_stage45_agents_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_MULTIAGENT_PG_CI: 'true'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Concurrent owner quota denial and durable STOP on disposable PostgreSQL 16
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_stage45_agents_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-stage45-multiagent-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dtest=SyntheticMultiAgentAuthorityLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
