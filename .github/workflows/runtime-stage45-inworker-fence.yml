name: Runtime Stage 45.5.6 In-Container Signed Fence Lab

on:
  pull_request:
    branches:
      - security/stage45-worker-fencing-exit-evidence-20261014
      - main
    paths:
      - 'tests/sandbox/stage45_lease_guard.go'
      - 'tests/sandbox/stage45_lease_guard_test.go'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/InWorkerSignedLeaseOciPlan.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/InWorkerSignedLeaseLifecycleIT.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/InWorkerSignedLeaseOciPlanTest.java'
      - 'docs/security/stage45-inworker-lease-fencing.md'
      - '.github/workflows/runtime-stage45-inworker-fence.yml'

permissions:
  contents: read

jobs:
  isolated-inworker-oci-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-inworker-ci-only
          POSTGRES_DB: aetheris_inworker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_inworker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_INWORKER_CI: 'true'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify available Go and real Docker daemon
        run: |
          go version
          docker info --format '{{.ServerVersion}}'
      - name: Unit-test signature and STOP guard parser
        run: go test -v tests/sandbox/stage45_lease_guard.go tests/sandbox/stage45_lease_guard_test.go
      - name: Build static Linux CI-only in-container gate
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-lease-guard" tests/sandbox/stage45_lease_guard.go
          chmod 755 "$RUNNER_TEMP/stage45-lease-guard"
      - name: Pull immutable BusyBox OCI image outside isolated workload
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Exercise in-container signed lease and durable STOP on disposable PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_inworker_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-inworker-ci-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Daetheris.stage45.guard.bin="$RUNNER_TEMP/stage45-lease-guard" \
            -Dtest=InWorkerSignedLeaseLifecycleIT,WorkerSideFenceVerifierLabJpaTest test

  fixed-profile-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify fixed non-root OCI policy and prior confinement
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=InWorkerSignedLeaseOciPlanTest,SyntheticOciSleepProfilePlanTest,IsolatedOciProbePlanTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run full Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
