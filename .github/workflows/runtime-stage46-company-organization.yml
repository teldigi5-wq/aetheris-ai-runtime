name: Runtime Stage 46.26 Company Organization Directory and Governance

on:
  pull_request:
    branches:
      - feature/stage46-synthetic-worker-symbol-decoupling-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/organization/CompanyOrganizationDirectory.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/api/CompanyOrganizationController.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/organization/CompanyOrganizationDirectoryTest.java'
      - 'docs/runtime/stage46-company-organization-directory.md'
      - '.github/workflows/runtime-stage46-company-organization.yml'

permissions:
  contents: read

jobs:
  canonical-company-structure-and-readonly-endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Real configured catalog with GET and no authority tests
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=CompanyOrganizationDirectoryTest test
      - name: Existing Phase12 specialist governance and independent verification
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=Phase12SpecialistDivisionsIntegrationTest,Phase12SpecialistVerificationIntegrationTest,Phase12GovernedDelegationIntegrationTest,Phase12WorkerIdentityBindingIntegrationTest test

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete orchestrator unit and integration tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Complete workstation-agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  independent-worker-windows-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Build fixed independent synthetic child only
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_26_INDEPENDENT_WINDOWS_MODULE_BUILD_FAILED' }
      - name: Native Job Object and reduced token using standalone compiled classes
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_26_REDUCED_TOKEN_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_26_JOB_LIMIT_FAILED' }
      - name: Native AppContainer synthetic security regression
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_26_APPCONTAINER_FAILED' }

  immutable-stage45-blockers-and-readonly-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Stage45 all thirteen release blockers remain immutable
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-26-release-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-26-release-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r["decision"]=="NO_GO" and len(r["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert r[key] is False,key
          print("STAGE46_26_THIRTEEN_BLOCKERS_PRODUCTION_OWNER_PC_NO_GO")
          PY
      - name: Verify directory never implements mutating employee controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          svc=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/organization/CompanyOrganizationDirectory.java").read_text()
          api=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/api/CompanyOrganizationController.java").read_text()
          assert '@GetMapping("/api/orchestrator/company/organization")' in api
          assert "CacheControl.noStore()" in api
          assert "snapshotReadOnly" in svc and "certifiesAutonomousEmployees" in svc
          for forbidden in ("@PostMapping","@PutMapping","@DeleteMapping","@PatchMapping",
                            "ProcessBuilder","Runtime.getRuntime","ToolExecutionService",
                            "TaskDelegationService","OpenAiCompatibleModelProviderAdapter",
                            "TargetDataLine","FwpmFilterAdd"):
              assert forbidden not in svc and forbidden not in api,forbidden
          print("STAGE46_26_READ_ONLY_COMPANY_DIRECTORY_NOT_AN_AGENT_RUNNER")
          PY
