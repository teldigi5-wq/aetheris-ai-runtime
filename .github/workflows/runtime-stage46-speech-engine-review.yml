name: Runtime Stage 46.6 Offline Speech Engine Artifact Review

on:
  pull_request:
    branches:
      - feature/stage46-synthetic-offline-speech-gate-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraOfflineSpeechArtifactReview.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraOfflineSpeechArtifactReviewTest.java'
      - 'workstation-agent/packaging/stage46/**'
      - 'docs/runtime/stage46-offline-speech-engine-review.md'
      - '.github/workflows/runtime-stage46-speech-engine-review.yml'

permissions:
  contents: read

jobs:
  offline-artifact-integrity-and-permission-denials:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify locally supplied synthetic speech artifact trust, symlinks, tampering and STOP
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  windows-voice-readonly-synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AETHERIS_STAGE46_SPEECH_REVIEW_CI: 'true'
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Parse Windows voice-readiness script without executing any recording
        shell: pwsh
        run: |
          $f=(Resolve-Path workstation-agent/packaging/stage46/Inspect-SyntraVoiceReadiness.ps1).Path
          $t=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$t,[ref]$errors) | Out-Null
          if($errors.Count -ne 0) { throw 'SCRIPT_PARSING_FAILED' }
          $script=Get-Content -LiteralPath $f -Raw
          if($script -match 'Start-Process|Install-Module|Start-Transcript|Start-Job|Set-ItemProperty|Invoke-WebRequest|Invoke-RestMethod') {
            throw 'PROHIBITED_SCRIPT_OPERATION'
          }
      - name: Verify synthetic CI mode reports NO_GO and all hardware permissions false
        shell: pwsh
        run: |
          $f='./workstation-agent/packaging/stage46/Inspect-SyntraVoiceReadiness.ps1'
          $r=(& pwsh -NoProfile -NonInteractive -File $f -SyntheticCI | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $r.verdict -ne 'NO_GO' -or
             $r.platformEvidence -ne 'CI_SYNTHETIC_LINUX_NOT_WINDOWS' -or
             $r.recordingEnabled -or $r.speakerPlaybackEnabled -or
             $r.desktopActionAuthorized -or $r.installPerformed -or
             $r.physicalMicrophonePermissionVerified -or $r.localSttModelVerified -or
             $r.localTtsVoiceVerified -or $r.binaryAndModelLicenseReviewed) {
            throw 'SYNTHETIC_VOICE_READINESS_MUST_REMAIN_BLOCKED'
          }
          Write-Host 'STAGE46_SPEECH_HARDWARE_NOT_CERTIFIED'
      - name: Verify synthetic CI bypass is denied when trusted guard missing
        shell: pwsh
        run: |
          $f='./workstation-agent/packaging/stage46/Inspect-SyntraVoiceReadiness.ps1'
          Remove-Item Env:AETHERIS_STAGE46_SPEECH_REVIEW_CI
          $r=(& pwsh -NoProfile -NonInteractive -File $f -SyntheticCI | ConvertFrom-Json)
          if($LASTEXITCODE -eq 0 -or $r.verdict -ne 'DENIED' -or
             $r.reason -ne 'SYNTHETIC_CI_ACCESS_DENIED') {
            throw 'UNTRUSTED_SYNTHETIC_VOICE_BYPASS'
          }
          Write-Host 'STAGE46_UNTRUSTED_CI_BYPASS_DENIED'

  fixed-no-go-release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify immutable prepilot blockers
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/syntra-speech-no-go.json"
          python3 - "$RUNNER_TEMP/syntra-speech-no-go.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["decision"]=="NO_GO" and len(r["release_blockers"])==13
          assert r["production_pilot_authorized"] is False
          assert r["agent_command_execution_authorized"] is False
          assert r["desktop_actions_authorized"] is False
          print("STAGE46_SPEECH_ENGINE_PRODUCTION_NO_GO")
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent Java regression
        run: ./mvnw -B -f workstation-agent/pom.xml test
