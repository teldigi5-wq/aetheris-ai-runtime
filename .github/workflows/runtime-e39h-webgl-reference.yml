name: E3.9H Inert WebGL2 Reference and Browser Proof
on:
  pull_request:
    branches:
      - feature/syntra-cinematic-web-standards-20261025
    paths:
      - 'tools/enterprise/e3_factory/e39h/**'
      - 'tools/enterprise/e3_factory/e39h_browser_proof.mjs'
      - 'docs/runtime/enterprise-e39h-webgl-reference-control.md'
      - 'docs/runtime/roadmap-current-e3-through-e9-20261025.md'
      - 'docs/security/aetheris-nine-release-gates-20261021.md'
      - 'README.md'
      - '.github/workflows/runtime-e39h-webgl-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-source-and-nonexecution:
    name: Policy + source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: python -m unittest discover -s tools/enterprise/e3_factory/e39h -p 'test_policy.py' -v
      - run: node --check tools/enterprise/e3_factory/e39h/reference/scene.js
      - run: node --check tools/enterprise/e3_factory/e39h_browser_proof.mjs
      - name: Preserve canonical skill + role no-authority state
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
  chromium-actual-webgl-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install pinned browser test driver, not model-selected dependencies
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real WebGL2 browser pixels, reverse-scroll and static fallbacks
        run: node tools/enterprise/e3_factory/e39h_browser_proof.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e39h-controlled-real-chromium-positive-proof
          path: target/e3-factory/e39h-evidence/
          if-no-files-found: warn
          retention-days: 14
