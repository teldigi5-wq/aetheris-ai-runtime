name: Runtime Stage 46.12 Windows Synthetic Job Object Containment Lab

on:
  pull_request:
    branches:
      - feature/stage46-speech-host-containment-lab-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticJobProbeMain.java'
      - 'workstation-agent/packaging/stage46/WindowsSyntheticJobLab.cs'
      - 'workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1'
      - 'docs/runtime/stage46-windows-synthetic-job-lab.md'
      - '.github/workflows/runtime-stage46-windows-job-lab.yml'

permissions:
  contents: read

jobs:
  windows-job-object-real-kernel-validation:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile fixed synthetic Java child
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_JAVA_COMPILE_FAILED' }
      - name: Verify Windows Job Object limits and process lifecycle
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_WINDOWS_CONTAINMENT_LAB_FAILED' }

  linux-and-synthetic-voice-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Prior subprocess and synthetic conversation security
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  immutable-13-blocker-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify existing production policy
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/syntra-stage46-12-no-go.json"
          python3 - "$RUNNER_TEMP/syntra-stage46-12-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f: r=json.load(f)
          assert r['decision']=='NO_GO' and len(r['release_blockers'])==13
          assert r['production_pilot_authorized'] is False
          assert r['agent_command_execution_authorized'] is False
          assert r['desktop_actions_authorized'] is False
          print('STAGE46_12_PHYSICAL_OWNER_PC_AND_PRODUCTION_NO_GO')
          PY

  complete-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  static-no-real-voice-or-command-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Conservative lab-only entrypoint and security invariant checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('workstation-agent/packaging/stage46')
          code=(root/'WindowsSyntheticJobLab.cs').read_text(encoding='utf-8')
          script=(root/'Test-SyntraWindowsJobLab.ps1').read_text(encoding='utf-8')
          probe=Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticJobProbeMain.java').read_text(encoding='utf-8')
          required=('CREATE_SUSPENDED', 'AssignProcessToJobObject', 'ResumeThread',
                    'JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE', 'JOB_OBJECT_LIMIT_ACTIVE_PROCESS',
                    'JOB_OBJECT_LIMIT_PROCESS_MEMORY', 'JOB_OBJECT_LIMIT_JOB_MEMORY',
                    'JOB_OBJECT_CPU_RATE_CONTROL_HARD_CAP',
                    'ReadJobInfo<JOBOBJECT_EXTENDED_LIMIT_INFORMATION>',
                    'ReadJobInfo<JOBOBJECT_CPU_RATE_CONTROL_INFORMATION>',
                    'TerminateProcess(pi.hProcess, 26)', 'inheritHandles',
                    'false,', 'SystemRoot=', 'FIXED_MAIN')
          assert all(s in code for s in required), 'MISSING_WINDOWS_KERNEL_JOB_CONTRACT'
          for forbidden in ('@Service','@RestController','javax.sound.',
                            'SyntraLoopbackModelClient','OwnerPermit',
                            'VoiceSessionService','Start-Process','Invoke-WebRequest',
                            'Invoke-RestMethod','cmd.exe','powershell.exe'):
              assert forbidden not in code and forbidden not in probe, 'REAL_ACTION_ENTRY_PROHIBITED'
          assert 'OPENAI_API_KEY' in script and 'CHECK_ENV' in script
          print('STAGE46_12_WINDOWS_INERT_CONTAINMENT_LAB_ONLY')
          PY
