name: E4 Durable Operator-Local Attempt Budget (Linux and Windows)
on:
  push:
    branches: [feat/e4-durable-local-budget-20261108]
  pull_request:
    branches: [feat/e4-local-model-proposal-cli-20261027]
permissions:
  contents: read
jobs:
  cross-process-local-quota:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned head and full isolated E4 test contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e4_*.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e36_free_model_router.py' -v
          python -m py_compile tools/enterprise/e3_factory/e4_local_quota.py tools/enterprise/e3_factory/e4_local_proposal_session.py tools/enterprise/e3_factory/e4_local_proposal_cli.py
      - name: Real plan-only CLI process never requires budget directory or network
        shell: bash
        env:
          AETHERIS_E4_EXPLICIT_LOCAL_SESSION_OPT_IN: 'no'
          AETHERIS_E36_LOCAL_INFERENCE_OPT_IN: 'no'
          AETHERIS_E4_LOCAL_QUOTA_DIR: ''
        run: |
          set -euo pipefail
          python tools/enterprise/e3_factory/e4_local_proposal_cli.py --model qwen2.5-coder:1.5b --task scroll |
            python -c 'import sys,json; d=json.load(sys.stdin); assert d["status"]=="PLAN_ONLY_NO_INFERENCE" and not d["localInferenceExecuted"] and not d["cloudFallbackPermitted"]; print("E4_PLAN_ONLY_ZERO_PROVIDER_CALL_PASS")'
