name: Runtime Stage 46.10 Synthetic Speech Process Isolation

on:
  pull_request:
    branches:
      - feature/stage46-synthetic-voice-async-cancellation-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticPcmWorkerMain.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticProcessSpeechBoundary.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraSyntheticProcessSpeechBoundaryTest.java'
      - 'docs/runtime/stage46-synthetic-speech-process-isolation.md'
      - '.github/workflows/runtime-stage46-speech-process-isolation.yml'

permissions:
  contents: read

jobs:
  real-child-process-and-adversarial-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test real child JVM process termination and prior voice safeguards
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  process-contract-and-no-devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check conservative fixed worker protocol and no direct hardware entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/voice')
          parent=(p/'SyntraSyntheticProcessSpeechBoundary.java').read_text(encoding='utf-8')
          child=(p/'SyntraSyntheticPcmWorkerMain.java').read_text(encoding='utf-8')
          banned=('@Component','@RestController','@Service','javax.sound.',
                  'TargetDataLine','SourceDataLine','java.net.','Desktop.getDesktop()',
                  'SyntraLoopbackModelClient','OwnerPermit','VoiceSessionService',
                  'Runtime.getRuntime()', 'ProcessBuilder("/bin/sh"')
          assert not any(s in parent or s in child for s in banned), 'UNSAFE_AUDIO_OR_COMMAND_INTEGRATION'
          for requirement in ('command.environment().clear()', 'new ProcessBuilder(javaExecutable',
                              'child.destroyForcibly()', 'child.waitFor(maxWaitMs, TimeUnit.MILLISECONDS)',
                              'MAX_OUTPUT_BYTES = 128', 'Arrays.fill(privateFrame, (byte) 0)',
                              'if (latched.get()) return result(Outcome.STOP_LATCHED, 0)'):
              assert requirement in parent, 'MISSING_PROCESS_BOUNDARY_'+requirement
          for requirement in ('static final int MAGIC', 'input.readFully(pcm)',
                              'if (input.read() != -1)', 'Arrays.fill(pcm, (byte) 0)',
                              'PREFIX + verdict'):
              assert requirement in child, 'MISSING_CHILD_PROTOCOL_'+requirement
          print('STAGE46_10_FIXED_IPC_NO_DEVICE_PROCESS_GATE')
          PY

  fixed-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preserve Stage 45 immutable security release gate
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-10-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-10-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as source: result=json.load(source)
          assert result['decision']=='NO_GO' and len(result['release_blockers'])==13
          assert result['production_pilot_authorized'] is False
          assert result['agent_command_execution_authorized'] is False
          assert result['desktop_actions_authorized'] is False
          print('STAGE46_10_PRODUCTION_AND_OWNER_PC_PILOT_NO_GO')
          PY

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull-request HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent Java regression
        run: ./mvnw -B -f workstation-agent/pom.xml test
