name: Enterprise E3.7 Hermes and Advanced Local Model Catalog

on:
  pull_request:
    branches:
      - feature/enterprise-e36-free-multimodel-routing-20261020
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - 'docs/runtime/enterprise-e37-hermes-local-models.md'
      - '.github/workflows/runtime-enterprise-e37-hermes-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-allowlist-and-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Hermes and new advanced Ollama model route behavior
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e37_hermes_open_models.py' -v
      - name: Preserve free cloud provider, paid fallback, and credential nonleakage tests
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e36_free_model_router.py' -v
      - name: Preserve genuine-model opt-in and source patch refusal tests
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e35_real_model_trial.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_multi_fault.py' -v

  registry-and-catalog-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently count 13 company, 100 division, 26 configured agent identities
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('orchestrator-service/src/main/resources')
          blueprint=json.loads((root/'enterprise/organization-blueprint-v1.json').read_text())
          companies=blueprint['companies']
          assert len(companies)==13
          assert sum(len(c['divisions']) for c in companies)==100
          assert blueprint['evidenceClass']=='PROPOSED_TAXONOMY_NON_EXECUTABLE'
          config=(root/'application.yml').read_text()
          catalog=config.split('  agent-catalog:',1)[1].split('\n',1)[1]
          blocks=re.findall(r'(?m)^      - id: ([a-z][a-z0-9-]+)$',catalog)
          assert len(blocks)==26 and len(set(blocks))==26
          print('E37_REPO_SOURCED_ORG_REGISTRY',len(companies),
                'COMPANIES',sum(len(c['divisions']) for c in companies),'PROPOSED_DIVISIONS')
          print('E37_CONFIGURED_NOT_RUNNING_AGENT_IDENTITIES',len(blocks))
          PY
      - name: Assert 11 local + 5 cloud route declarations and research-only Hermes 4
        run: |
          python tools/enterprise/e3_factory/e36_free_model_router.py list
          python -m py_compile tools/enterprise/e3_factory/e36_free_model_router.py
          python -m py_compile tools/enterprise/e3_factory/test_e37_hermes_open_models.py

  original-functional-website-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual unchanged site in network-none disposable worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Verify generated site source digest and schema
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Install browser on disposable CI host only
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Genuine Chromium accessibility, mobile and scroll QA
        run: node tools/enterprise/e3_factory/browser_qa.mjs
      - name: Attach only genuine generated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e37-hermes-catalog-and-browser-regression
          path: target/e3-factory/
          if-no-files-found: warn
          retention-days: 14

  full-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  no-install-no-approval-no-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Guard truthful model catalogs and no model/tool activation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/enterprise/e3_factory/e36_free_model_router.py').read_text()
          assert '"hermes3:3b"' in s and '"hermes3:8b"' in s
          assert '"qwen3-coder:30b"' in s
          assert '"NousResearch/Hermes-4-14B"' in s
          assert 'OPEN_WEIGHT_REFERENCE_NOT_OLLAMA_ROUTABLE' in s
          assert '"localRuntimeValidated": False' in s
          assert 'E36_LOCAL_MODEL_NOT_INSTALLED' in s
          assert 'E36_LOCAL_MODEL_NOT_OPTED_IN' in s
          assert 'E36_EXTERNAL_CODE_UPLOAD_NOT_AUTHORIZED' in s
          assert '"ownerApprovalGranted": False' in s
          assert '"responseWasExecuted": False' in s
          for bad in ('subprocess','os.system','Popen(','ollama pull ',
                      'eval(','exec(','kubectl ','import requests'):
              assert bad not in s,bad
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E37_HERMES_3_ROUTABLE_ONLY_IF_INSTALLED_HERMES_4_RESEARCH_ONLY')
          print('E37_NO_REAL_INFERENCE_NO_PAID_ROUTING_NO_OWNER_PC_NO_STAGE45')
          PY
