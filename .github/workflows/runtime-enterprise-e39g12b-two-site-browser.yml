name: Enterprise E3.9G-12B Two Distinct Website Chromium Baseline Certification

on:
  pull_request:
    branches:
      - feature/enterprise-e39g12a-apache-coder-local-browser-pilot-20261021
    paths:
      - 'tools/enterprise/e3_factory/fixtures/e39g12b/**'
      - 'tools/enterprise/e3_factory/e39g12b_*'
      - 'tools/enterprise/e3_factory/test_e39g12b_*'
      - 'tools/enterprise/e3_factory/run_locked_worker.sh'
      - 'docs/runtime/enterprise-e39g12b-two-site-corpus.md'
      - '.github/workflows/runtime-enterprise-e39g12b-two-site-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-site-cross-platform-safety:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original 14 governed skill references and 26-agent allowlists
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
      - name: Reject symlinks, wrong files, fixture drift and falsely credited model work
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b_two_site_corpus.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12a_coder_model.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g9_multidomain.py' -v

  real-chromium-two-distinct-sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seed both disposable sites with a locked, network-none worker
        run: |
          set -euo pipefail
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
      - name: Install independent real Playwright Chromium runtime
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Prove broken vs fixed evaluator control outcomes in TWO sites and both viewports
        run: |
          set -euo pipefail
          node tools/enterprise/e3_factory/e39g12b_two_site_browser.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          base=Path("target/e3-factory/e39g12b")
          manifest=json.loads((base/"corpus-manifest.json").read_text())
          score=json.loads((base/"two-site-browser-summary.json").read_text())
          assert manifest["evidenceClass"]=="E39G12B_TWO_DISTINCT_PUBLIC_SYNTHETIC_WEBSITES"
          assert set(manifest["sites"])=={"studynest","cityline"}
          assert len({manifest["sites"][n]["variants"]["broken"]["sourceSha256"] for n in manifest["sites"]})==2
          assert (score["sites"],score["distinctFaultCategories"],score["realChromiumObservations"])==(2,4,8)
          assert (score["brokenVariantsThatFailedExpectedChecks"],score["referenceVariantsThatPassedExpectedChecks"])==(4,4)
          assert score["modelCalls"]==score["modelRepairsCredited"]==0
          assert score["independentExternalCuration"] is False
          assert score["stage45Go"] is False and score["ownerApprovalGranted"] is False
          assert len(score["entries"])==8
          for entry in score["entries"]:
              site,variant,viewport=entry["site"],entry["variant"],entry["viewport"]
              root=base/"evidence"/site/variant
              data=json.loads((root/(viewport+".json")).read_text())
              screenshot=(root/(viewport+".png")).read_bytes()
              assert hashlib.sha256(screenshot).hexdigest()==data["screenshotSha256"]
              assert entry["screenshotSha256"]==data["screenshotSha256"]
              assert data["pageJavaScriptErrors"]==[]
              assert data["modelCalls"]==0 and data["modelBrowserRepairCredited"] is False
          print("E39G12B_TWO_REAL_DISTINCT_WEBSITES_8_CHROMIUM_PASSES_WITH_EXPECTED_CONTROL_FAILURES")
          PY
      - name: Upload raw real browser screenshots, evidence and immutable site manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39g12b-two-distinct-public-website-before-and-reference-control-evidence
          path: |
            target/e3-factory/e39g12b/
            target/e3-factory/sandbox-e39g12b-seed.json
          if-no-files-found: warn
          retention-days: 14

  full-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  no-model-repair-or-owner-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prove no model or repair authority introduced for test corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("tools/enterprise/e3_factory")
          corpus=(base/"e39g12b_two_site_corpus.py").read_text()
          browser=(base/"e39g12b_two_site_browser.mjs").read_text()
          runner=(base/"run_locked_worker.sh").read_text()
          wf=Path(".github/workflows/runtime-enterprise-e39g12b-two-site-browser.yml").read_text()
          assert "modelCalls:0" in browser and "modelRepairsCredited:0" in browser
          assert '"noModelRepairCredit":True' in corpus
          assert '"blindHeldOut":False' in corpus and '"externallyCurated":False' in corpus
          assert '"productionPublished":False' in corpus
          assert "e39g12b-seed" in runner and "--network none" in runner
          assert "127.0.0.1" in browser
          for bad in ("import subprocess","http.client","local_json(","os.system(","Popen("):
              assert bad not in corpus,bad
          assert "real-chromium-two-distinct-sites:" in wf
          print("E39G12B_NO_MODEL_APPROVAL_NO_PRODUCTION_NO_FAKE_BROWSER_REPAIR")
          PY
