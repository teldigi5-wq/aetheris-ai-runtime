name: Runtime Stage 45 Signed Worker and STOP Lab

on:
  pull_request:
    branches:
      - security/stage45-oci-sandbox-certification-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SignedSandboxJobGate.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SignedSandboxJobGateTest.java'
      - 'tests/sandbox/stage45_worker_stop_probe.sh'
      - 'docs/security/stage45-signed-worker-stop-lab.md'
      - '.github/workflows/runtime-stage45-worker-stop.yml'

permissions:
  contents: read

jobs:
  signed-job-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test signature, approval binding, replay, lease and revocable admission
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SignedSandboxJobGateTest,IsolatedOciProbePlanTest,WorkspaceContainmentHardeningTest test

  synthetic-container-stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AETHERIS_STAGE45_STOP_CI: 'true'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify disposable Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - name: Verify synthetic multi-process OCI emergency STOP
        run: bash tests/sandbox/stage45_worker_stop_probe.sh

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run all orchestrator Java tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
