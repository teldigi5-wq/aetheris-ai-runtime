name: Enterprise E3.8 Extended Model Catalog and High-resource Gates
on:
  pull_request:
    branches:
      - feature/enterprise-e37-hermes-open-model-catalog-20261020
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - 'docs/runtime/enterprise-e38-*.json'
      - 'docs/runtime/enterprise-e38-*.md'
      - '.github/workflows/runtime-enterprise-e38-model-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform-model-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check heavy local second opt-in, future separation and no autoload
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e38_advanced_model_budget.py' -v
      - name: Preserve Hermes, Qwen and OpenRouter pricing and scope refusal
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e37_hermes_open_models.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e36_free_model_router.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34_model_adviser.py' -v

  inventory-catalog-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-derived configured route count and research-only inventory
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/enterprise/e3_factory')
          import e36_free_model_router as r
          future=json.loads(Path('docs/runtime/enterprise-e38-future-model-research.json').read_text())
          assert len(r.LOCAL_CANDIDATES)==20
          assert len(r.CLOUD_CANDIDATES)==6
          assert len(r.HIGH_RESOURCE_LOCAL_CANDIDATES)==8
          assert len(future['additional'])==10
          assert len(r.RESEARCH_ONLY_MODELS)==2
          assert future['counts']['totalFutureResearchCandidates']==12
          assert 'openrouter/free' in r.CLOUD_CANDIDATES
          assert 'nvidia/nemotron-3.5-super-vl:free' in r.CLOUD_CANDIDATES
          assert r.catalog_status()['automaticModelFallback'] is False
          print('E38_VERIFIED_ROUTE_COUNTS 20_LOCAL + 6_FREE_CLOUD_ROUTE_CHOICES')
          print('E38_FUTURE_RESEARCH_ONLY 12_NONCALLABLE_MODEL_REFERENCES')
          print('E38_UNIQUE_NAMED_MODELS 25 + ONE_FREE_ROUTER_SELECTOR')
          PY
      - name: Source-derived organization and 26 configured agents
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('orchestrator-service/src/main/resources')
          blueprint=json.loads((root/'enterprise/organization-blueprint-v1.json').read_text())
          assert len(blueprint['companies'])==13
          assert sum(len(c['divisions']) for c in blueprint['companies'])==100
          source=(root/'application.yml').read_text()
          assert len(re.findall(r'(?m)^      - id: [a-z][a-z0-9-]+$',source))==26
          print('E38_ORGANIZATION_13_PROPOSED_COMPANIES_100_DIVISIONS_26_CONFIGURED_AGENT_IDENTITIES')
          PY

  real-chromium-website-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original website in isolated network-none Docker worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Verify exact generated file hashes and schema
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Browser install in disposable QA harness, never model worker
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser scroll, mobile, reduced-motion verification
        run: node tools/enterprise/e3_factory/browser_qa.mjs
      - name: Save browser report, no model output fabricated
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e38-model-catalog-original-chromium-qa
          path: target/e3-factory/
          retention-days: 14
          if-no-files-found: warn

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  no-cost-no-owner-no-autonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: All inference remains separately opt-in; no model may authorize tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('tools/enterprise/e3_factory/e36_free_model_router.py').read_text()
          assert 'E38_HIGH_RESOURCE_MODEL_REQUIRES_SECOND_OPT_IN' in code
          assert 'AETHERIS_E38_HIGH_RESOURCE_MODEL_OPT_IN' in code
          assert 'E36_NONZERO_OR_UNVERIFIED_PRICE_REFUSED' in code
          assert 'E36_EXTERNAL_CODE_UPLOAD_NOT_AUTHORIZED' in code
          assert 'E36_LOCAL_MODEL_NOT_INSTALLED' in code
          assert '"ownerApprovalGranted": False' in code
          assert '"responseWasExecuted": False' in code
          for forbidden in ('subprocess','os.system','Popen(','ollama pull ',
                            'docker run ','eval(','exec(','import requests'):
              assert forbidden not in code,forbidden
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E38_ADVISORY_CATALOG_ONLY_NO_MODEL_DOWNLOAD_NO_OWNER_PC_NO_RELEASE_AUTHORITY')
          PY
