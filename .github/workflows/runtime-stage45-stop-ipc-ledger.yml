name: Runtime Stage 45.5.2 Durable STOP IPC Integration

on:
  pull_request:
    branches:
      - security/stage45-local-worker-ipc-lab-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/DurableStopIpcBridgeLab.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxStopDispatchEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxStopDispatchRepository.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxWorkerStopWire.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/DurableStopIpcBridgeLabJpaTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/DurableStopIpcBridgeProcessTest.java'
      - 'docs/security/stage45-durable-stop-ipc.md'
      - '.github/workflows/runtime-stage45-stop-ipc-ledger.yml'

permissions:
  contents: read

jobs:
  authenticated-db-ipc-h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify signed STOP, disconnect, forged ACK, recovery and independent JVM
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=DurableStopIpcBridgeLabJpaTest,DurableStopIpcBridgeProcessTest,StandaloneStopWorkerLabProcessTest,SandboxWorkerStopWireTest test

  authenticated-db-ipc-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-stage45-ipc-only
          POSTGRES_DB: aetheris_stop_ipc_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_stop_ipc_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify durable STOP outbox and separate JVM against disposable PostgreSQL 16
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_stop_ipc_lab
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-stage45-ipc-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dtest=DurableStopIpcBridgeLabJpaTest,DurableStopIpcBridgeProcessTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run complete Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
