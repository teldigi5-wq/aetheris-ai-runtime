name: Enterprise E3.3 Held-Out Rule-Based Repair Evaluation
on:
  pull_request:
    branches:
      - feature/enterprise-e32-multifault-patch-gate-20261019
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - '.github/workflows/runtime-enterprise-e33-heldout-repairs.yml'
      - 'docs/runtime/enterprise-e33-heldout-repairs.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform-negative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_heuristic_repair.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_multi_fault.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_fault_repair.py' -v
      - run: node --check tools/enterprise/e3_factory/fault_contract.mjs
  disposable-real-chromium-heldouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: docker pull python:3.12-slim-bookworm
      - name: Rebuild original working website in restricted worker
        run: bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Install browser in disposable QA host only
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Run six injected variants through independent Chromium failure and restricted repair
        shell: bash
        run: |
          set -euo pipefail
          for case_id in scroll-00 scroll-24 mobile-940 mobile-1024 reduced-false reduced-boolean; do
            case "$case_id" in
              scroll-*) category=scroll;;
              mobile-*) category=mobile;;
              reduced-*) category=reduced;;
              *) exit 2;;
            esac
            echo "E33_CASE=$case_id"
            python tools/enterprise/e3_factory/e33_evaluator.py seed "$case_id"
            set +e
            node tools/enterprise/e3_factory/fault_contract.mjs "$category"
            browser_rc=$?
            set -e
            if [[ $browser_rc -eq 0 ]]; then
              echo "E33_EXPECTED_FAILURE_ABSENT"
              exit 1
            fi
            python tools/enterprise/e3_factory/e33_evaluator.py before "$case_id"
            bash tools/enterprise/e3_factory/run_locked_worker.sh e33-propose "$category"
            bash tools/enterprise/e3_factory/run_locked_worker.sh e33-apply "$category"
            node tools/enterprise/e3_factory/fault_contract.mjs "$category"
            python tools/enterprise/e3_factory/e33_evaluator.py after "$case_id"
            python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
          done
      - name: Original end-to-end Chromium regression after six restorations
        run: node tools/enterprise/e3_factory/browser_qa.mjs
      - name: Check all six case records, real Docker limits, and write truthful summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('target/e3-factory')
          cases=('scroll-00','scroll-24','mobile-940','mobile-1024','reduced-false','reduced-boolean')
          rows=[]
          for case in cases:
              p=base/'e33'/case
              before=json.loads((p/'browser-before.json').read_text())
              after=json.loads((p/'browser-after.json').read_text())
              receipt=json.loads((p/'receipt.json').read_text())
              assert before['passed'] is False and after['passed'] is True
              assert receipt['untrustedProposalValidated'] is True
              assert receipt['modelWasRun'] is False and receipt['ownerApproved'] is False
              rows.append({'case':case,'failedBefore':True,'passedAfter':True,
                           'failureCode':before['failureCode']})
          for category in ('scroll','mobile','reduced'):
              for phase in ('propose','apply'):
                  p=json.loads((base/('sandbox-e33-'+phase+'-'+category+'.json')).read_text())
                  assert p['network']=='none' and p['readOnlyRootfs'] is True
                  assert p['cpuLimit']==1 and p['memoryBytes']==268435456
                  assert p['pidsLimit']==64 and p['allCapabilitiesDropped'] is True
                  assert p['repositoryMount']=='read-only' and p['targetMount']=='read-write'
                  assert p['wallClockLimitSeconds']==45 and p['ownerPcUsed'] is False
          final=json.loads((base/'browser-evidence/qa-report.json').read_text())
          assert final['passed'] is True and final['errors']==[]
          summary={'evidenceClass':'E33_HEURISTIC_HELDOUT_SOURCE_VARIANTS_CI_ONLY',
                   'attempted':6,'browserDetected':6,'repairsPassed':6,
                   'modelCalls':0,'costForModelUsd':0,'unseenRealWorldDefectsTested':False,
                   'ownerPcUsed':False,'productionDeployed':False,'cases':rows}
          (base/'e33'/'evaluation-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('E33_EVALUATION_VERIFIED',json.dumps(summary,sort_keys=True))
          PY
      - name: Retain generated source, before-after screenshots and patch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e33-six-heldout-heuristic-repairs
          path: target/e3-factory/
          if-no-files-found: error
          retention-days: 14
  complete-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test
  no-external-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Ensure no model, evaluator import, shell or privileged command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('tools/enterprise/e3_factory')
          code=(root/'heuristic_repair.py').read_text()
          runner=(root/'run_locked_worker.sh').read_text()
          assert 'E33_ABSTAIN_UNRECOGNIZED_DEFECT' in code
          assert 'E33_PATCH_GRAMMAR_DENIED' in code
          assert 'E33_CANONICAL_OUTPUT_MISMATCH' in code
          assert 'e33_evaluator' not in code
          for forbidden in ('subprocess','os.system','import socket','urllib.request',
                            'import requests','eval(','exec(','Popen('):
              assert forbidden not in code,forbidden
          for required in ('--network none','--cpus 1','--memory 256m','--pids-limit 64',
                           '--read-only','--cap-drop ALL','--security-opt no-new-privileges',
                           'timeout --signal=TERM --kill-after=3s 45s'):
              assert required in runner,required
          assert 'e33-propose|e33-apply' in runner
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E33_NO_LLM_NO_OWNER_APPROVAL_NO_PC_NO_STAGE45_CERTIFIED')
          PY
