name: Enterprise E6 Cinematic Storyboard Real WebGL2 Research
on:
  pull_request:
    branches:
      - feat/e5-six-case-intent-benchmark-20261030
    paths:
      - '.github/workflows/runtime-e6-cinematic-storyboard.yml'
      - 'tools/enterprise/e6_studio/**'
      - 'docs/runtime/E6_CINEMATIC_STORYBOARD_20261030.md'
permissions:
  contents: read
concurrency:
  group: e6-cinematic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-e6-reference-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Pinned checkout of exact unmerged E6 PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Verify exact commit, bounded source and no production activation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m unittest discover -s tools/enterprise/e6_studio -p 'test_*.py' -v
          node --check tools/enterprise/e6_studio/reference/studio.js
          node --check tools/enterprise/e6_studio/studio_browser_proof.mjs
          python - <<'PY'
          from pathlib import Path
          folder=Path('tools/enterprise/e6_studio')
          studio=(folder/'reference/studio.js').read_text()
          browser=(folder/'studio_browser_proof.mjs').read_text()
          for marker in ('const shots=[', "name:'arrival'", "name:'material'",
                         "name:'precision'", "if(reduce.matches)",
                         "setFallback('no-webgl')", "setFallback('context-lost')",
                         '1200000/area', 'visibilitychange'):
              assert marker in studio, marker
          for marker in ("E6_STUDIO_REAL_CHROMIUM_WEBGL_3_SHOTS_REVERSE_LOSS_PASS",
                         "E6_STUDIO_REAL_CHROMIUM_STATIC_FALLBACK_PASS",
                         "SOFTWARE_EMULATED_NOT_OWNER_GPU", "stage45Go:false"):
              assert marker in browser, marker
          assert "Stage45 NO_GO" in Path('docs/runtime/E6_CINEMATIC_STORYBOARD_20261030.md').read_text()
          print('E6_STORYBOARD_RESEARCH_ONLY_NO_OWNER_GPU_CLAIM_PASS')
          PY
      - name: Install fixed actual Chromium driver without running package scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/enterprise/e6_studio --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e6_studio/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual Chromium three-scene desktop/mobile WebGL and safe fallback proof
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/studio_browser_proof.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('target/e6-studio/storyboard-proof/report.json').read_text())
          assert data['stage45Go'] is False
          assert data['trueGpuPerformanceCertified'] is False
          assert data['genuineModelAuthorshipProven'] is False
          assert data['browserWebgl']=='SOFTWARE_EMULATED_NOT_OWNER_GPU'
          assert data['modelCalls']==0
          assert not data['failures']
          assert len(data['cases'])==4
          for event in data['cases'][:2]:
              assert event['forwardThreeShots']
              assert event['reverseScroll']
              assert event['contextLossStatic']
              assert event['contextRecoveryRequiresReload']
              assert event['boundedPixels']
              assert event['idleFrameLoop'] is False
              assert event['browserErrors']==0
          assert data['cases'][2]['webglAttempts']==0
          assert data['cases'][3]['staticFallback']
          print('E6_STORYBOARD_ACTUAL_BROWSER_EVIDENCE_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e6-cinematic-storyboard-research-not-certified
          path: target/e6-studio/storyboard-proof/
          if-no-files-found: warn
          retention-days: 7
