name: Enterprise E6 Pinned glTF Asset and Actual WebGL2 Browser Research
on:
  pull_request:
    branches:
      - feat/e6-cinematic-storyboard-webgl-proof-20261030
    paths:
      - '.github/workflows/runtime-e6-vetted-gltf-asset.yml'
      - 'tools/enterprise/e6_studio/**'
      - 'docs/runtime/E6_PINNED_GLTF_PIPELINE_20261030.md'
permissions:
  contents: read
concurrency:
  group: e6-gltf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deterministic-local-gltf-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read-only exact PR head checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Source tests and pinned local glTF2 fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m unittest discover -s tools/enterprise/e6_studio -p 'test_*.py' -v
          python3 tools/enterprise/e6_studio/generate_reference_gltf.py --generate | tee /tmp/e6-gltf-generation.json
          python3 tools/enterprise/e6_studio/generate_reference_gltf.py --verify
          node --check tools/enterprise/e6_studio/gltf_lab/gltf_scene.js
          node --check tools/enterprise/e6_studio/gltf_browser_proof.mjs
          node --check tools/enterprise/e6_studio/reference/studio.js
          node --check tools/enterprise/e6_studio/studio_browser_proof.mjs
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          script=Path('tools/enterprise/e6_studio/gltf_lab/gltf_scene.js').read_text()
          fixture=Path('tools/enterprise/e6_studio/gltf_lab/reference_mesh.gltf')
          sha=hashlib.sha256(fixture.read_bytes()).hexdigest()
          assert sha=='ace770e960909c2b788312dfd80e9d788ed89fd1eeb3f8008842b4e246af45a7'
          assert sha in script
          assert not any(v in script for v in ('new Function(', 'eval(', 'XMLHttpRequest('))
          assert "Stage45 NO_GO" in Path('docs/runtime/E6_PINNED_GLTF_PIPELINE_20261030.md').read_text()
          print('E6_GLTF_2_EXACT_OWNED_ASSET_AND_SHA_PIN_PASS')
          PY
      - name: Install fixed Playwright Chromium with no package scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/enterprise/e6_studio --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e6_studio/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve parent original E6 browser regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/studio_browser_proof.mjs
      - name: Real browser glTF import, geometry pixels, context-loss and hostile asset denial
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/gltf_browser_proof.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('target/e6-studio/gltf-proof')
          report=json.loads((root/'report.json').read_text())
          assert report['kind']=='E6_PINNED_LOCAL_GLTF_2_CINEMATIC_WEBGL_RESEARCH_CONTROL'
          assert report['checkedGlTF2Bytes'] is True
          assert report['assetEmbeddedBufferOnly'] is True
          assert report['blenderExported'] is False
          assert report['modelCalls']==0
          assert report['browserWebgl']=='SOFTWARE_EMULATED_NOT_OWNER_GPU'
          assert report['productionReady'] is False
          assert report['stage45Go'] is False
          assert report['failures']==[]
          assert len(report['cases'])==5
          for case in report['cases'][:2]:
              assert case['forwardThreeShots']
              assert case['reverseScroll']
              assert case['contextLossStatic']
              assert case['contextRecoveryRequiresReload']
              assert case['boundedPixels']
              assert case['idleFrameLoop'] is False
              assert case['browserErrors']==0
              assert all(p['assetSha256']=='ace770e960909c2b788312dfd80e9d788ed89fd1eeb3f8008842b4e246af45a7' for p in case['renderObservations'])
              assert all(p['assetVertices']==36 for p in case['renderObservations'])
          assert report['cases'][2]['webglAttempts']==0
          assert report['cases'][3]['staticFallback']
          assert report['cases'][4]['assetDenied']
          print('E6_GLTF2_ACTUAL_BROWSER_FIVE_SCENARIOS_AND_TAMPER_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e6-vetted-gltf2-research-not-certified
          path: |
            target/e6-studio/storyboard-proof/
            target/e6-studio/gltf-proof/
            tools/enterprise/e6_studio/gltf_lab/reference_mesh.gltf
          if-no-files-found: warn
          retention-days: 7
