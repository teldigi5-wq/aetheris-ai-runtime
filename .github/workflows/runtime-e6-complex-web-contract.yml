name: Enterprise E6 Original Complex Website Contract - Synthetic Only
on:
  pull_request:
    branches:
      - feat/e6-cls-pin-ab-diagnostic-20261031
    paths:
      - '.github/workflows/runtime-e6-complex-web-contract.yml'
      - 'docs/runtime/E6_ORIGINAL_COMPLEX_WEB_EXPERIENCE_CAPABILITY_20261101.md'
      - 'tools/enterprise/e6_studio/next-studio/experience_contract.mjs'
      - 'tools/enterprise/e6_studio/next-studio/test_experience_contract.mjs'
permissions:
  contents: read
jobs:
  policy-and-static-research-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD, no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Experience contract and inherited synthetic regression tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --test tools/enterprise/e6_studio/next-studio/test_experience_contract.mjs
          node --test tools/enterprise/e6_studio/next-studio/test_cls_pin_experiment.mjs
          node --test tools/enterprise/e6_studio/next-studio/test_review_local_chrome_trace.mjs
          node --test tools/enterprise/e6_studio/next-studio/test_review_local_raf_evidence.mjs
          node --test tools/enterprise/e6_studio/next-studio/test_local_browser_raf_policy.mjs
      - name: Locked local preview typecheck and static export only
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          python3 scripts/validate_dependency_lock.py
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          NEXT_PUBLIC_E6_BLENDER_PREVIEW=1 npm run build
          test -f out/blender-preview/index.html
          grep -Rq 'e6_cls_pin' out/_next/static/chunks
          echo E6_ORIGINAL_COMPLEX_WEB_CONTRACT_SYNTHETIC_ONLY_NO_PRODUCTION_AUTHORIZATION
