name: Runtime Stage 46.28 Persistent Paper Drawdown and No-Reset Circuit

on:
  pull_request:
    branches:
      - feature/stage46-paper-capital-risk-budget-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperDrawdown*.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperRiskOfficerService.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperPortfolioAnalyticsService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/trading/PaperDrawdown*.java'
      - 'docs/runtime/stage46-paper-drawdown-circuit.md'
      - '.github/workflows/runtime-stage46-paper-drawdown-circuit.yml'

permissions:
  contents: read

jobs:
  real-durable-paper-circuit-policy-and-jpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Exact pull request HEAD without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Pure adversarial 8 percent peak-to-trough risk policy
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperDrawdownPolicyTest test
      - name: Real Spring and JPA latched halt, persistence, owner-approved risk gate
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperDrawdownGuardIntegrationTest test
      - name: Existing paper sizing and actual Stage10 simulation regression
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperCapitalBudgetServiceTest,Stage10TradingIntegrationTest test

  full-orchestrator-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete Java orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Complete workstation agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  independent-quant-testnet-endpoint-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify real-money Binance hosts are still rejected
        run: python3 -m unittest discover -s aetheris-quant/tests -p test_execution_boundary.py -v
      - name: Assert no new broker/permission/reset/command pathway
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/trading")
          parts=[base/("PaperDrawdown"+name+".java") for name in (
              "Policy","GuardEntity","GuardRepository","GuardService")]
          joined="\n".join(x.read_text(encoding="utf-8") for x in parts)
          officer=(base/"PaperRiskOfficerService.java").read_text()
          mark=(base/"PaperPortfolioAnalyticsService.java").read_text()
          assert "drawdownGuard.forNewPaperExposure(account)" in officer
          assert "drawdownGuard.observeMarkedEquity(account,equityValue)" in mark
          assert "PESSIMISTIC_WRITE" in joined and "@Version" in joined
          assert "REQUIRES_NEW" in joined
          for forbidden in ("BinanceTestnetClient","HttpClient","RestTemplate",
                            "WebClient","ProcessBuilder","Runtime.getRuntime",
                            "marketOrder(","createOrder(","@PostMapping","@PutMapping",
                            "@DeleteMapping","@PatchMapping","autoReset","resetCircuit",
                            "enable_live_money","setLeverage("):
              assert forbidden not in joined,forbidden
          print("STAGE46_28_NO_BROKER_NO_RESET_NO_INSTALL_NO_LIVE_MONEY")
          PY

  windows-existing-synthetic-containment:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Only fixed two-class CI synthetic worker compilation
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_28_LAB_MODULE_COMPILE_FAILED' }
      - name: Native Windows Job Object, reduced-token and AppContainer regressions
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_28_REDUCED_TOKEN_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_28_JOB_OBJECT_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_28_APPCONTAINER_FAILURE' }

  unchanged-thirteen-blocker-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Immutable Stage45 owner- and release-gate contract
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-28-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-28-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["decision"]=="NO_GO" and len(p["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified",
                      "deploy_permitted"):
              assert p[key] is False,key
          print("STAGE46_28_ALL_THIRTEEN_RELEASE_BLOCKERS_NO_GO")
          PY
