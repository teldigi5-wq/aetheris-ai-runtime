name: Runtime Stage 46.32 Independent Synthetic Rollback Checkpoint

on:
  pull_request:
    branches:
      - feature/stage46-durable-offline-replay-ledger-20261016
      - main
    paths:
      - 'risk-contracts/stage46-independent-replay-checkpoint-fixture.json'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/OfflinePaperRollbackCheckpointService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/trading/OfflinePaperRollbackCheckpointIntegrationTest.java'
      - 'aetheris-quant/app/offline_replay_checkpoint.py'
      - 'aetheris-quant/tests/test_offline_replay_checkpoint.py'
      - 'docs/runtime/stage46-independent-replay-checkpoint-review.md'
      - '.github/workflows/runtime-stage46-independent-replay-checkpoint.yml'

permissions:
  contents: read

jobs:
  actual-jpa-stale-backup-readonly-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Real JPA deleted/restored sequence and signed external fixture comparison
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=OfflinePaperRollbackCheckpointIntegrationTest test
      - name: Original durable JPA replay + same Java/Python signed snapshot fixture
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=OfflinePaperReplayLedgerIntegrationTest,OfflinePaperStateReconciliationTest test

  python-shared-public-fixture-and-testnet-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Synthetic checkpoint signing, stale DB detection and no authority
        run: python3 -m unittest discover -s aetheris-quant/tests -p test_offline_replay_checkpoint.py -v
      - name: Earlier offline HMAC, risk parity and live-Binance host refusal
        run: |
          python3 -m unittest discover -s aetheris-quant/tests -p test_offline_paper_state_boundary.py -v
          python3 -m unittest discover -s aetheris-quant/tests -p test_paper_risk_cross_language_contract.py -v
          python3 -m unittest discover -s aetheris-quant/tests -p test_execution_boundary.py -v
      - name: No real trust root or exchange access in the new verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          pure=Path("aetheris-quant/app/offline_replay_checkpoint.py").read_text()
          java=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/OfflinePaperRollbackCheckpointService.java").read_text()
          fixture=json.loads(Path("risk-contracts/stage46-independent-replay-checkpoint-fixture.json").read_text())
          assert fixture["production_verified"] is False and fixture["live_trading_authorized"] is False
          assert "PUBLIC CI HMAC KEY" in fixture["key_warning"]
          assert "independentTrustRootVerified" in java and "accountStateImported" in java
          assert "independent_trust_root_verified" in pure
          for forbidden in ("@PostMapping","@PutMapping","@DeleteMapping","BinanceTestnetClient","marketOrder(",
                  "placeOrder(","HttpClient","RestTemplate","ProcessBuilder","Runtime.getRuntime","os.environ",
                  "import requests","import socket"):
              assert forbidden not in java and forbidden not in pure,forbidden
          print("STAGE46_32_PUBLIC_FIXTURE_ONLY_NO_INDEPENDENT_TRUST_OR_TRADING")
          PY

  complete-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete actual orchestrator and integration test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Complete workstation-agent suite
        run: ./mvnw -B -f workstation-agent/pom.xml test

  real-hosted-windows-inert-containment:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Build independently scoped fixed inert lab worker
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_32_SYNTHETIC_LAB_BUILD_FAILED' }
      - name: Real native reduced token, Job Object and AppContainer regressions
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_32_REDUCED_TOKEN_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_32_JOB_OBJECT_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_32_APPCONTAINER_FAILED' }

  immutable-stage45-thirteen-release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: All thirteen release blockers and deployment refusal
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-32-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-32-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          assert p["decision"]=="NO_GO" and len(p["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert p[key] is False,key
          print("STAGE46_32_ALL_THIRTEEN_BLOCKERS_NO_GO")
          PY
