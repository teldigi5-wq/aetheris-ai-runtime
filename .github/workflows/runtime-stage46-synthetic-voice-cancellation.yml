name: Runtime Stage 46.9 Bounded Synthetic Voice Cancellation

on:
  pull_request:
    branches:
      - feature/stage46-readonly-voice-conversation-bridge-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticAsyncVoiceBoundary.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraSyntheticAsyncVoiceBoundaryTest.java'
      - 'docs/runtime/stage46-synthetic-async-voice-boundary.md'
      - '.github/workflows/runtime-stage46-synthetic-voice-cancellation.yml'

permissions:
  contents: read

jobs:
  bounded-async-voice-and-security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify bounded synthetic cancellation and prior voice/security behavior
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test

  static-guard-no-real-audio-or-executable-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify synthetic-only and bounded zero-queue policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticAsyncVoiceBoundary.java")
          source=p.read_text(encoding="utf-8")
          forbidden=("@Component","@Service","@RestController","@RequestMapping",
                     "ProcessBuilder","Runtime.getRuntime()","java.net.","javax.sound.",
                     "TargetDataLine","SourceDataLine","Desktop.getDesktop()",
                     "SyntraLoopbackModelClient","OwnerPermit","VoiceSessionService",
                     "Files.write(")
          assert not any(term in source for term in forbidden), "UNSAFE_INTEGRATION_DETECTED"
          required=("future.get(maxWaitMillis, TimeUnit.MILLISECONDS)",
                    "future.cancel(true)", "worker.shutdownNow()",
                    "new ArrayBlockingQueue<>(1)", "if (!busy.compareAndSet(false, true))",
                    "thread.setDaemon(true)", "Arrays.fill(privateFrame, (byte) 0)",
                    "if (stoppedExternally() || !permissionPresent())",
                    "new SyntraVoiceReadOnlyConversationBridge(gate)")
          # The returned Future is cancelled through the current ref, so
          # cancellation may be written as running.cancel(true).
          required=tuple(term for term in required if term != "future.cancel(true)")
          assert all(term in source for term in required), "MISSING_BOUNDED_FAIL_CLOSED_PROPERTY"
          assert "running.cancel(true)" in source
          print("STAGE46_9_SYNTHETIC_TIMEOUT_AND_STOP_CONTAINMENT")
          PY

  immutable-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Keep all 13 production release blockers active
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-9-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-9-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as file:
              report=json.load(file)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_9_PRODUCTION_AND_OWNER_PC_PILOT_NO_GO")
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test
