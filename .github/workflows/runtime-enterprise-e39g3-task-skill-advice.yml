name: Enterprise E3.9G-3 Task-Bound Read-Only Skill Advice

on:
  pull_request:
    branches:
      - feature/enterprise-e39g2-scoped-skill-advice-20261020
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/skills/**'
      - 'orchestrator-service/src/main/resources/enterprise/skill-advice-bindings-v1.json'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/skills/**'
      - 'tools/enterprise/**'
      - 'skills/**'
      - '.github/workflows/runtime-enterprise-e39g3-task-skill-advice.yml'
      - 'docs/runtime/enterprise-e39g3-task-bound-skill-advice.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-contract-and-injection-refusal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source provenance, agent roles and immutable cross-language policy
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m unittest discover -s tools/enterprise -p 'test_skills_registry.py' -v
          python -m unittest discover -s tools/enterprise -p 'test_e39g2_scoped_skill_advice.py' -v
          python -m unittest discover -s tools/enterprise -p 'test_e39g3_java_skill_manifest.py' -v

  exact-catalog-and-java-orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full Java orchestrator regression including new service-level authority tests
        run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  original-real-chromium-and-locked-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build original website under previously approved network-none worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Real original-site Chromium QA
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
          node tools/enterprise/e3_factory/browser_qa.mjs

  explicitly-no-http-tool-or-owner-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Strict control against endpoint or default runtime activation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/skills/GovernedSkillAdviceService.java").read_text()
          assert '@Service' in src and '@RestController' not in src
          assert 'reference-enabled:false' in src
          assert 'getActiveAgentId()' in src and 'TaskState.RUNNING' in src
          assert 'TaskState.VERIFYING' in src and 'E39G3_OPERATION_MODE_MISMATCH' in src
          assert 'ownerAuthenticated' in src and 'stage45Certified' in src
          for banned in ('Runtime.getRuntime()', 'ProcessBuilder(', 'System.exit(', 'WebClient', 'RestTemplate', 'new URL(', 'HttpClient.newHttpClient()'):
              assert banned not in src, banned
          print("E39G3_INTERNAL_TASK_BOUND_ONLY; NO_HTTP_ROUTE; NO_OWNER_AUTH; NO_MODEL_TOOLS")
          PY
