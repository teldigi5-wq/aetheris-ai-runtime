name: Agent Skills Safety Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/validate_agent_skills.py'
      - 'tests/test_agent_skills.py'
      - '.github/workflows/agent-skills-validation.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/validate_agent_skills.py'
      - 'tests/test_agent_skills.py'
      - '.github/workflows/agent-skills-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-skills-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
      - name: Validate pinned Agent Skills catalog
        run: python scripts/validate_agent_skills.py
      - name: Negative safety tests
        run: python -m unittest discover -s tests -p 'test_agent_skills.py' -v
