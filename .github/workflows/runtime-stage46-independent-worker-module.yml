name: Runtime Stage 46.24 Independent Synthetic Worker Maven Lab

on:
  pull_request:
    branches:
      - feature/stage46-test-scoped-worker-package-20261016
      - main
    paths:
      - 'synthetic-worker-lab/pom.xml'
      - 'tools/security/stage46_independent_worker_module_gate.py'
      - 'tools/security/test_stage46_independent_worker_module_gate.py'
      - 'docs/runtime/stage46-independent-worker-lab-module.md'
      - '.github/workflows/runtime-stage46-independent-worker-module.yml'

permissions:
  contents: read

jobs:
  linux-standalone-test-only-module-and-binary-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Independently compile the two reviewed workers with ZERO module dependencies
        run: ./mvnw -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
      - name: Package existing default Spring Boot orchestrator without installing
        run: ./mvnw -B -f orchestrator-service/pom.xml -DskipTests clean package
      - name: Inspect exact module bytecode, POM build topology and normal Spring Boot archive
        run: |
          python3 tools/security/stage46_independent_worker_module_gate.py \
            --output "$RUNNER_TEMP/stage46-24-independent-module-evidence.json"
          python3 - "$RUNNER_TEMP/stage46-24-independent-module-evidence.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["module_pom_trust_contract_valid"] is True
          assert p["only_two_canonical_sources_used"] is True
          assert p["only_two_worker_bytecodes_in_module_jar"] is True
          assert p["ordinary_spring_boot_contains_no_worker_main"] is True
          assert p["standalone_module_not_a_production_dependency"] is True
          assert p["module_worker_bytecode_count"] == 2
          assert p["production_worker_bytecode_count"] == 0
          assert p["module_maven_install_authorized"] is False
          assert p["module_maven_deploy_authorized"] is False
          assert p["source_migration_completed"] is False
          assert p["production_authorized"] is False and p["decision"] == "NO_GO"
          print("STAGE46_24_INDEPENDENT_MODULE_ZERO_DEPS_TWO_CANONICAL_SOURCES_NO_GO")
          PY
      - name: Execute ONLY fixed synthetic no-microphone worker modes against standalone module
        run: |
          python3 - <<'PY'
          import os,subprocess,struct
          classes="synthetic-worker-lab/target/classes"
          probe="io.aetheris.orchestrator.voice.SyntraSyntheticJobProbeMain"
          pcm="io.aetheris.orchestrator.voice.SyntraSyntheticPcmWorkerMain"
          env={"PATH":os.environ["PATH"],"JAVA_HOME":os.environ["JAVA_HOME"]}
          for mode,rc in (("EXIT",0),("FAIL",17),("CHECK_ENV",0)):
              result=subprocess.run(["java","-cp",classes,probe,mode],
                                    stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                                    env=env,timeout=8,check=False)
              assert result.returncode==rc and not result.stdout
          payload=struct.pack(">iii",0x53463431,16000,640)+bytes(640)
          r=subprocess.run(["java","-cp",classes,pcm,"NORMAL"],input=payload,
                           capture_output=True,env=env,timeout=8,check=False)
          assert r.returncode==0 and r.stdout==b"SYNTRA46_10_V1|SILENCE\n",r.stdout
          assert not r.stderr
          print("STAGE46_24_FIXED_LAB_CHILD_EXIT_AND_SYNTHETIC_PCM_PASS")
          PY
      - name: Adversarial malicious source/POM/payload gate tests
        run: python3 -m unittest discover -s tools/security -p test_stage46_independent_worker_module_gate.py -v
      - name: No binary publication
        run: echo "STAGE46_24_TEST_MODULE_STAYS_EPHEMERAL_NO_UPLOAD_NO_MAVEN_INSTALL"

  windows-real-job-reduced-token-using-INDEPENDENT-lab-module:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile standalone FIXED worker module without orchestrator/application runtime
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_24_STANDALONE_WINDOWS_MODULE_BUILD_FAILED' }
          $cp = (Resolve-Path './synthetic-worker-lab/target/classes').Path
          $probe = Join-Path $cp 'io/aetheris/orchestrator/voice/SyntraSyntheticJobProbeMain.class'
          if (-not (Test-Path -LiteralPath $probe)) { throw 'STAGE46_24_FIXED_JOB_CLASS_MISSING' }
          Write-Host 'STAGE46_24_STANDALONE_WINDOWS_WORKER_BUILT'
      - name: Execute real Windows reduced-privilege token tests with MODULE bytecode
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_24_REDUCED_TOKEN_WORKER_MODULE_FAILURE' }
      - name: Execute real Windows Job Object process tree/resource tests with MODULE bytecode
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_24_JOB_OBJECT_WORKER_MODULE_FAILURE' }
      - name: Preserve independent AppContainer C++ isolation fixture
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_24_APPCONTAINER_REGRESSION' }

  existing-voice-owner-stop-and-java-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify 111 existing synthetic voice, owner and STOP test cases
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Full orchestrator service regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: All workstation agent regressions
        run: ./mvnw -B -f workstation-agent/pom.xml test

  original-packaging-source-and-thirteen-release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Re-run source/main classpath and installer wiring regression
        run: |
          python3 tools/security/stage46_integration_surface_gate.py
          python3 -m unittest discover -s tools/security -p test_stage46_integration_surface_gate.py -v
      - name: Immutable Stage 45 production NO_GO gate and thirteen blockers
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-24-release-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-24-release-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["protected_branch_merge_permitted"] is False
          assert report["windows_device_certified"] is False
          assert report["voice_microphone_certified"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          assert report["deploy_permitted"] is False
          print("STAGE46_24_ALL_THIRTEEN_BLOCKERS_RELEASE_NO_GO")
          PY
