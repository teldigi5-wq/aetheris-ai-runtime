name: Enterprise E3.9G-12B4C gstack Reference Review and Real 3D Readiness Gate

on:
  pull_request:
    branches:
      - feature/enterprise-e39g12b4b-repair-failure-localization-20261021
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4c_*'
      - 'tools/enterprise/e3_factory/test_e39g12b4c_*'
      - 'docs/runtime/enterprise-e39g12b4c-gstack-cinematic-readiness.md'
      - '.github/workflows/runtime-enterprise-e39g12b4c-gstack-cinematic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-pattern-policy-windows-ubuntu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original 14 skills and 26 role allowlists retain pinned safe state
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
      - name: New external reference provenance, untrusted receipt and escalation adversarial suite
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4c_gstack_patterns.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4b_failure_localization.py' -v
          python tools/enterprise/e3_factory/e39g12b4c_gstack_pattern_gate.py validate

  actual-chromium-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate reviewed public two-site reference controls, not model authored
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
      - name: Install real headless Chromium
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Four actual browser negative-control screenshots for existing non-3D website fixtures
        run: |
          node tools/enterprise/e3_factory/e39g12b4c_cinematic_baseline.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("target/e3-factory/e39g12b4c")
          d=json.loads((root/"browser-summary.json").read_text())
          assert d["evidenceClass"]=="E39G12B4C_BASELINE_BROWSER_4_NEGATIVE_CONTROLS"
          assert (d["siteCount"],d["realChromiumObservations"])==(2,4)
          assert d["actualWebglCanvasCount"]==0 and d["actualScrollSceneTransitions"]==0
          assert d["independentlyVerifiedFull3dProductionSite"] is False
          assert d["autonomousCodingModelDemonstrated"] is False
          for row in d["rows"]:
              name=row["site"]+"-"+row["viewport"]
              png=(root/(name+".png")).read_bytes()
              assert hashlib.sha256(png).hexdigest()==row["screenshotSha256"]
              observation=json.loads((root/(name+".json")).read_text())
              assert observation["screenshotSha256"]==row["screenshotSha256"]
              assert observation["demonstratesPremiumCinematic3D"] is False
          print("E39G12B4C_FOUR_REAL_CHROMIUM_NEGATIVE_CONTROLS_ZERO_CINEMATIC_CLAIM")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e39g12b4c-real-chromium-cinematic-absence-baseline
          path: target/e3-factory/e39g12b4c/
          if-no-files-found: warn
          retention-days: 14

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  no-foreign-hooks-no-owner-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prove pinned gstack index is inert and no model/runtime rights granted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("tools/enterprise/e3_factory")
          r=json.loads((root/"e39g12b4c_reviewed_gstack_patterns.json").read_text())
          gate=(root/"e39g12b4c_gstack_pattern_gate.py").read_text()
          docs=Path("docs/runtime/enterprise-e39g12b4c-gstack-cinematic-readiness.md").read_text()
          assert len(r["patterns"])==12
          assert r["allSkillsReadOnly"] is True
          assert r["autoActivate"] is False
          assert r["toolExecutionGranted"] is False
          assert r["productionDeploymentGranted"] is False
          assert r["stage45Go"] is False
          assert all(not p["executionAllowed"] and not p["autoActivate"] for p in r["patterns"])
          assert "upstreamBlobSha1" in gate and "source" in docs
          for denied in ("import subprocess","import requests","import urllib","os.system(","Popen(","model.generate("):
              assert denied not in gate
          print("E39G12B4C_GSTACK_NO_HOOKS_NO_EXECUTION_NO_3D_CAPABILITY_CLAIM")
          PY
