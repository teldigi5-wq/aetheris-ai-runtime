name: Runtime S0-E6B Deny-only Route Authorization Policy
on:
  pull_request:
    branches:
      - security/s0-e6a-managed-pinned-identity-authority-20261029
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimeRouteAdmissionPolicy.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeRouteAdmissionPolicyTest.java'
      - '.github/workflows/runtime-s0-e6b-deny-only-route-policy.yml'
      - 'docs/security/RUNTIME_S0_E6B_DENY_ONLY_POLICY_20261029.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0-e6b-deny-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-app-policy-no-http-unlock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AETHERIS_DISPATCHER_ENABLED: 'false'
      AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED: 'false'
      AETHERIS_CLOUD_PROVIDER_ENABLED: 'false'
      AETHERIS_EXECUTION_WORKSPACE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Immutable head; deny-only policy has no HTTP permission side effects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('orchestrator-service/src')
          policy=(root/'main/java/io/aetheris/orchestrator/security/RuntimeRouteAdmissionPolicy.java').read_text()
          for needle in (
            '@Component','enum Verdict { QUARANTINED }',
            'RuntimePinnedPrincipalVerifier.VerifiedPrincipal',
            'MissingEvidence.LIVE_SESSION',
            'MissingEvidence.TRUSTED_WORKLOAD',
            'MissingEvidence.DURABLE_OBJECT_OWNER',
            'MissingEvidence.TENANT_MEMBERSHIP',
            'return new ReviewDecision(Verdict.QUARANTINED',
          ):
              assert needle in policy,needle
          for unsafe in ('@RestController','@RequestMapping','FilterRegistrationBean',
                         'OncePerRequestFilter','chain.doFilter','HttpServletResponse',
                         'getHeader(', 'Authorization', 'Verdict.ALLOW', 'enum Verdict { ALLOW'):
              assert unsafe not in policy,unsafe
          test=(root/'test/java/io/aetheris/orchestrator/security/RuntimeRouteAdmissionPolicyTest.java').read_text()
          for required in (
            'classes = AetherisOrchestratorApplication.class',
            'handlers' if False else 'mapping.getHandlerMethods().entrySet()',
            'jwt' if False else 'new RuntimePinnedPrincipalVerifier(',
            'assertEquals(Verdict.QUARANTINED',
            'jdbc:h2:mem:s0_e6b_review',
          ):
              assert required in test,required
          assert '@TestConfiguration' not in test and 'FilterRegistrationBean' not in test
          task=(root/'main/java/io/aetheris/orchestrator/api/OwnerlessTaskMissionHttpFilter.java').read_text()
          gate=(root/'main/java/io/aetheris/orchestrator/security/RuntimeUncertifiedApiHttpFilter.java').read_text()
          assert '@Component' in task and '@Order(Ordered.HIGHEST_PRECEDENCE)' in task
          assert '@Component' in gate and '@Order(Ordered.HIGHEST_PRECEDENCE + 1)' in gate
          assert 'SC_NOT_FOUND' in gate and 'SC_NOT_FOUND' in task
          event=(root/'main/java/io/aetheris/orchestrator/task/TaskEventStreamService.java').read_text()
          assert 'globalEmitters' not in event and 'subscribeAll(' not in event
          assert 'spring.jpa.hibernate.ddl-auto=update' in (root/'main/resources/application.properties').read_text()
          print('AETHERIS_S0_E6B_ROUTE_POLICY_WITHOUT_PERMIT_OR_FILTER_CHANGE_PASS')
          PY
      - name: Genuine full app policy with signed principal and previous HTTP/JWT/SSE regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml \
            -Dtest=RuntimeRouteAdmissionPolicyTest,RuntimeFullAppPinnedIdentityAuthorityTest,RuntimeControllerPolicyInventoryTest,RuntimeProductionApiQuarantineTest,RuntimeFullAppHttpContainmentTest,RuntimePinnedSpringBootHttpIntegrationTest,RuntimePinnedHttpBearerGateLoopbackTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskMissionHttpFilterTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          grep -Fq 'Stage45 NO_GO' docs/security/RUNTIME_S0_E6B_DENY_ONLY_POLICY_20261029.md
          echo AETHERIS_S0_E6B_FULL_MVC_ROUTES_SIGNED_PRINCIPAL_STILL_QUARANTINED_PASS
      - name: Release denial remains; HTTP authN integration not falsely credited
        shell: bash
        run: |
          set -euo pipefail
          test ! -f orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimePinnedHttpBearerGateRegistration.java
          echo AETHERIS_S0_E6B_POLICY_REVIEW_ONLY_PRODUCTION_HTTP_FILTER_STILL_NOT_INTEGRATED_NO_GO_PASS
