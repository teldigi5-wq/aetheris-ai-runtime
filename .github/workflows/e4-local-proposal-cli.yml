name: E4 Operator CLI - Plan First, Explicit Local Ollama Only
on:
  push:
    branches: [feat/e4-local-model-proposal-cli-20261027]
  pull_request:
    branches: [feat/e4-explicit-local-model-proposal-session-20261027]
    paths:
      - '.github/workflows/e4-local-proposal-cli.yml'
      - 'tools/enterprise/e3_factory/e4_local_proposal_cli.py'
      - 'tools/enterprise/e3_factory/test_e4_local_proposal_cli.py'
      - 'docs/runtime/E4_LOCAL_OPERATOR_CLI_20261027.md'
permissions:
  contents: read
jobs:
  readonly-and-optin-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact SHA, user-run dry-plan and explicit opt-in tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_local_proposal_cli.py -v
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_local_proposal_session.py -v
          python -m unittest discover -s tools/enterprise/e3_factory -p test_e4_free_route_admission.py -v
          python -m py_compile tools/enterprise/e3_factory/e4_local_proposal_cli.py
          python tools/enterprise/e3_factory/e4_local_proposal_cli.py --model qwen2.5-coder:1.5b --task scroll |
            python -c 'import sys,json; r=json.load(sys.stdin); assert r["status"]=="PLAN_ONLY_NO_INFERENCE" and not r["localInferenceExecuted"]; print("E4_LOCAL_CLI_DEFAULT_NO_PROVIDER_CALL")'
