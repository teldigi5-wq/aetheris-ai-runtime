name: Enterprise E3 CI Worker Writable Scope and Inspection Boundary
on:
  pull_request:
    branches: [feature/enterprise-e39g12b4c-gstack-cinematic-readiness-20261021]
    paths:
      - 'tools/enterprise/e3_factory/run_locked_worker.sh'
      - 'tools/security/locked_worker_inspection.py'
      - 'tools/security/test_locked_worker_boundary.py'
      - '.github/workflows/e3-worker-writable-scope-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/security -p 'test_locked_worker_boundary.py' -v

  real-disposable-docker-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pull CI-only reviewed image and execute fixed offline build
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Verify honest sandbox inspection evidence and generated output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("target/e3-factory/sandbox-build.json").read_text())
          assert report["evidenceClass"]=="DOCKER_INSPECTED_DISPOSABLE_CI_WORKER"
          assert report["network"]=="none" and report["readOnlyRootfs"] is True
          assert report["targetMount"]=="e3-factory-only-read-write"
          assert report["ownerPcUsed"] is False
          assert report["productionDeployment"] is False
          assert report["ownerApprovalGranted"] is False
          manifest=json.loads(Path("target/e3-factory/site/manifest.json").read_text())
          assert manifest["evidenceState"]=="CI_ONLY_WEBSITE_SOURCE_GENERATED_NOT_DEPLOYED"
          assert manifest["productionPublished"] is False
          assert manifest["realOwnerApprovalGranted"] is False
          print("E3_CI_ONLY_NARROW_MOUNT_REAL_DOCKER_INSPECTION_VERIFIED")
          PY
