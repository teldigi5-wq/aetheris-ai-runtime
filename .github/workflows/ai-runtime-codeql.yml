name: AI Runtime CodeQL

on:
  push:
    branches:
      - main
      - feature/initial-runtime-extraction
  pull_request:
    branches:
      - main
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ai-runtime-codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21.0.12'

jobs:
  analyze-orchestrator:
    name: Analyze Orchestrator Java
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          languages: java-kotlin
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build orchestrator Java surface
        run: ./mvnw -f orchestrator-service/pom.xml -DskipTests package
      - name: Analyze
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          category: '/language:java-kotlin/ai-runtime-orchestrator'
