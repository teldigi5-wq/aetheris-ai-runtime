name: Enterprise E3.4B Genuine CPU Ollama Inference (Disposable CI)
on:
  pull_request:
    branches:
      - feature/enterprise-e34-local-model-advisory-boundary-20261019
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - '.github/workflows/runtime-enterprise-e34b-real-inference.yml'
      - 'docs/runtime/enterprise-e34b-real-inference.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34b_real_inference.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34_model_adviser.py' -v
      - run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_heuristic_repair.py' -v
  real-smollm2-cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # An explicit CI opt-in only. This never connects to the owner's actual PC.
      AETHERIS_E34B_REAL_CI_OPT_IN: 'yes'
      MODEL_IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build target microsite in original network-disabled fixed worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Seed real-browser-detectable scroll failure on disposable generated output
        run: |
          python tools/enterprise/e3_factory/e33_evaluator.py seed scroll-24
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e34b_real_inference.py' -v
      - name: Install independent Chromium on CI host for real failure proof
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Require real Chromium to observe broken source before model query
        shell: bash
        run: |
          set +e
          node tools/enterprise/e3_factory/fault_contract.mjs scroll
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then exit 1; fi
          python tools/enterprise/e3_factory/e33_evaluator.py before scroll-24
      - name: Pull pinned official CPU-capable Ollama image and create isolated inference service
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MODEL_IMAGE"
          docker run -d --name e34b-real-ollama --cpus 2 \
            --memory 3g --memory-swap 3g --pids-limit 128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$MODEL_IMAGE"
          docker inspect e34b-real-ollama > "$RUNNER_TEMP/e34b-inspect.json"
          python3 - "$RUNNER_TEMP/e34b-inspect.json" <<'PY'
          import json,sys
          from pathlib import Path
          c=json.loads(Path(sys.argv[1]).read_text())[0]
          h=c['HostConfig']
          assert h['NanoCpus']==2000000000 and h['Memory']==3221225472
          assert h['MemorySwap']==3221225472 and h['PidsLimit']==128
          assert h['ReadonlyRootfs'] is True and 'ALL' in h['CapDrop']
          assert 'no-new-privileges' in h['SecurityOpt']
          assert h['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          assert not any(x['Destination']=='/workspace' for x in c['Mounts'])
          print('E34B_GENUINE_MODEL_ISOLATION_INSPECTED')
          PY
      - name: Pull published small real model (no mock), only into ephemeral Ollama container
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 300s docker exec e34b-real-ollama ollama pull smollm2:135m
          docker exec e34b-real-ollama ollama list
          docker image inspect "$MODEL_IMAGE" --format '{{json .RepoDigests}}' > target/e3-factory/e34b-ollama-image-digests.json
          docker inspect e34b-real-ollama --format '{{json .HostConfig}}' > "$RUNNER_TEMP/e34b-hostconfig.json"
      - name: Run actual CPU local-model inference; never trust generated response
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 135s python tools/enterprise/e3_factory/e34b_real_inference.py --run-real
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('target/e3-factory/e34b/real-inference.json')
          r=json.loads(p.read_text())
          assert r['actualLocalModelRequestCompleted'] is True
          assert r['selfReportedEvalTokens']>=1
          assert r['model']['sizeBytes']>10000000
          assert r['modelIdentityCryptographicallyAttested'] is False
          assert r['ownerApprovalGranted'] is False
          assert r['modelResponseDirectlyExecuted'] is False
          print('E34B_REAL_INFERENCE_CONFIRMED',
                'class',r['responseClass'],
                'tokens',r['selfReportedEvalTokens'],
                'milliseconds',r['measuredWallMs'],
                'reported_model_digest',r['model']['selfReportedDigest'])
          PY
      - name: Apply model advice ONLY if independent restricted patch policy permits
        shell: bash
        run: |
          set -euo pipefail
          kind="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('target/e3-factory/e34b/real-inference.json').read_text())['responseClass'])
          PY
          )"
          outcome=ABSTAIN_OR_INVALID
          if [[ "$kind" == "SCHEMA_VALID_REPLACE" ]]; then
            outcome=POLICY_REJECTED
            if bash tools/enterprise/e3_factory/run_locked_worker.sh e34-prepare scroll &&
               bash tools/enterprise/e3_factory/run_locked_worker.sh e33-apply scroll; then
              outcome=POLICY_ACCEPTED
            fi
          fi
          echo "$outcome" > target/e3-factory/e34b/patch-policy-outcome.txt
          echo "E34B_UNTRUSTED_MODEL_PATCH_OUTCOME=$outcome"
      - name: Score independent browser outcome and refuse false success claims
        shell: bash
        run: |
          set -euo pipefail
          outcome="$(cat target/e3-factory/e34b/patch-policy-outcome.txt)"
          verdict=NOT_TESTED
          if [[ "$outcome" == "POLICY_ACCEPTED" ]]; then
            if node tools/enterprise/e3_factory/fault_contract.mjs scroll &&
               python tools/enterprise/e3_factory/e33_evaluator.py after scroll-24 &&
               node tools/enterprise/e3_factory/browser_qa.mjs; then
              verdict=BROWSER_VERIFIED_REPAIR
            else
              verdict=BROWSER_FAILED_REPAIR
            fi
          else
            verdict=NO_REPAIR_PRODUCED
          fi
          echo "$verdict" > target/e3-factory/e34b/browser-verdict.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('target/e3-factory/e34b')
          e=json.loads((base/'real-inference.json').read_text())
          outcome=(base/'patch-policy-outcome.txt').read_text().strip()
          verdict=(base/'browser-verdict.txt').read_text().strip()
          result={'evidenceClass':'E34B_REAL_LOCAL_MODEL_SINGLE_ATTEMPT',
                  'attempts':1,'completedRealInference':1,
                  'model':e['model'],'selfReportedEvalTokens':e['selfReportedEvalTokens'],
                  'measuredWallMs':e['measuredWallMs'],
                  'responseClass':e['responseClass'],
                  'patchPolicyOutcome':outcome,'independentBrowserVerdict':verdict,
                  'verifiedRepairs':int(verdict=='BROWSER_VERIFIED_REPAIR'),
                  'modelOutputDirectlyExecuted':False,
                  'ownerApprovalGranted':False,'ownerPcUsed':False,
                  'productionPublished':False,
                  'trulyBlindDifferentFamilyBenchmark':False,
                  'modelIdentityCryptographicallyAttested':False}
          (base/'evaluation-summary.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('E34B_EMPIRICAL_RESULT',json.dumps(result,sort_keys=True))
          PY
      - name: Cleanup isolated real Ollama process and ephemeral model volume
        if: always()
        run: docker rm -fv e34b-real-ollama || true
      - name: Preserve actual real inference, rejection, and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e34b-real-smollm2-inference-no-authority-evidence
          path: |
            target/e3-factory/site/
            target/e3-factory/e33/
            target/e3-factory/e32/
            target/e3-factory/e34b/
            target/e3-factory/e34b-ollama-image-digests.json
          if-no-files-found: warn
          retention-days: 14
  complete-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21.0.12', cache: maven}
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test
  no-authority-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: No user host execution or model self-approval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/enterprise/e3_factory/e34b_real_inference.py').read_text()
          assert 'AETHERIS_E34B_REAL_CI_OPT_IN' in s
          assert 'HTTPConnection("127.0.0.1", 11434, timeout=95)' in s
          assert 'ownerApprovalGranted": False' in s
          assert 'modelResponseDirectlyExecuted": False' in s
          assert 'aiRepairVerifiedByBrowser": False' in s
          for bad in ('subprocess','os.system','Popen(','import requests','urllib.request','exec('):
              assert bad not in s,bad
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E34B_REAL_INFERENCE_ADVICE_ONLY_OWNER_PC_AND_PRODUCTION_NO_GO')
          PY
