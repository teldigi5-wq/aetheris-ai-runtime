name: Runtime Private Task Event Lockdown - Owner Scope Required
on:
  push:
    branches: [security/runtime-ownerless-task-event-lockdown-20261028]
  pull_request:
    branches: [feat/e5-untrusted-copy-proposal-preview-20261028]
    paths:
      - '.github/workflows/runtime-private-task-event-lockdown.yml'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/api/TaskEventExposureGate.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/api/OperationsStreamController.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/api/TaskController.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/task/TaskEventStreamService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/api/OwnerlessTaskEventLockdownTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/task/InternalTaskEventJournalLockdownTest.java'
      - 'docs/security/OWNERLESS_RUNTIME_SSE_LOCKDOWN_20261028.md'
permissions:
  contents: read
jobs:
  deny-ownerless-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Immutable PR head and no global SSE bypass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator")
          s=(root/"task/TaskEventStreamService.java").read_text()
          assert "globalEmitters" not in s
          assert "subscribeAll(" not in s
          assert "journal.append(event)" in s
          gate=(root/"api/TaskEventExposureGate.java").read_text()
          assert "throw new ResponseStatusException(HttpStatus.NOT_FOUND)" in gate
          assert "System.getenv(" not in gate and "@Value(" not in gate
          ops=(root/"api/OperationsStreamController.java").read_text()
          task=(root/"api/TaskController.java").read_text()
          assert "TaskEventExposureGate.requireVerifiedOwnerBinding()" in ops
          assert task.count("TaskEventExposureGate.requireVerifiedOwnerBinding()") == 2
          assert ops.index("TaskEventExposureGate.requireVerifiedOwnerBinding()") < ops.index("throw new IllegalStateException")
          for marker in ('public List<TaskEvent> history(', 'public SseEmitter events('):
              start=task.index(marker)
              following=task[start: start + 310]
              assert following.index("TaskEventExposureGate.requireVerifiedOwnerBinding()") < following.index("tasks.getRequired(id)")
          print("RUNTIME_SSE_GLOBAL_BROADCAST_REMOVED_AND_HTTP_DENIED_PASS")
          PY
      - name: Real servlet endpoint denial and internal journal regression
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml -Dtest=OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          echo RUNTIME_TASK_EVENT_REAL_MVC_DENIAL_TESTS_PASS
      - name: Confirm release remains blocked
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Stage45 NO_GO' docs/security/OWNERLESS_RUNTIME_SSE_LOCKDOWN_20261028.md
          echo RUNTIME_OWNERLESS_EVENT_RELEASE_NO_GO_PASS
