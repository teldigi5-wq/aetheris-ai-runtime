name: Runtime S0-D2 Restricted Signed Registry Read (Disposable PG16)
on:
  pull_request:
    branches:
      - security/s0-verified-jdbc-task-write-race-20261029
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimeVerifiedRegistryTaskReadProbe.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeVerifiedRegistryTaskReadProbeTest.java'
      - 'tests/security/s0-db-roles/**'
      - 'docs/security/RUNTIME_S0_RESTRICTED_READ_ROLE_20261029.md'
      - '.github/workflows/runtime-s0-restricted-read-role.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-s0-d2-read-role-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restricted-role-signed-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: s0read_disposable
          POSTGRES_USER: s0_owner_ci
          POSTGRES_PASSWORD: disposable_owner_ci_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s0_owner_ci -d s0read_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: s0_owner_ci
      PGDATABASE: s0read_disposable
      PGPASSWORD: disposable_owner_ci_not_a_real_secret
      AETHERIS_S0_READROLE_MUST_RUN: 'yes'
      AETHERIS_S0_DISPOSABLE_DB_ONLY: 'yes'
      AETHERIS_S0_READROLE_USER: s0_readonly_runtime
      AETHERIS_S0_READROLE_PASSWORD: s0_disposable_role_password_never_production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact head, non-injectable probe and unchanged lockdown
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('orchestrator-service/src/main/java/io/aetheris/orchestrator')
          probe=(root/'security/RuntimeVerifiedRegistryTaskReadProbe.java').read_text()
          for token in ('VerifiedPrincipal principal', 'principal.identityUid()',
                        'principal.hasScope("orchestrator:read")',
                        'connection.isReadOnly()', 'connection.getAutoCommit()',
                        'PreparedStatement', 'registry_tenants', 'registry_projects',
                        'registry_tenant_memberships', 'registry_project_memberships',
                        'owner_verified_at IS NOT NULL', 'clock_timestamp()'):
              assert token in probe, token
          for forbidden in ('@Component','@Bean','request.getHeader(',
                            'System.getenv(', 'SECURITY DEFINER', 'executeUpdate(',
                            'commit()', 'rollback()'):
              assert forbidden not in probe, forbidden
          auth=(root/'security/RuntimePinnedPrincipalVerifier.java').read_text()
          assert 'private VerifiedPrincipal(' in auth
          http=(root/'api/OwnerlessTaskMissionHttpFilter.java').read_text()
          events=(root/'task/TaskEventStreamService.java').read_text()
          assert '@Component' in http and 'SC_NOT_FOUND' in http
          assert 'globalEmitters' not in events and 'subscribeAll(' not in events
          assert 'spring.jpa.hibernate.ddl-auto=update' in Path('orchestrator-service/src/main/resources/application.properties').read_text()
          grant=Path('tests/security/s0-db-roles/disposable_readonly_registry_role.sql').read_text()
          for token in ('NOINHERIT', 'NOSUPERUSER', 'NOBYPASSRLS',
                        'REVOKE ALL ON DATABASE s0read_disposable FROM PUBLIC',
                        'GRANT SELECT (id, owner_identity_uid',
                        'GRANT USAGE ON SCHEMA public'):
              assert token in grant, token
          assert 'GRANT UPDATE' not in grant and 'GRANT ALL' not in grant
          print('AETHERIS_S0_D2_NONINJECTABLE_RESTRICTED_ROLE_SOURCE_PASS')
          PY
      - name: Build exclusively disposable PostgreSQL16 schema and restricted user
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = true
          test "${AETHERIS_S0_DISPOSABLE_DB_ONLY}" = yes
          test "${PGHOST}" = 127.0.0.1
          test "${PGUSER}" = s0_owner_ci
          test "${PGDATABASE}" = s0read_disposable
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -1 -v ON_ERROR_STOP=1             -f tests/security/migration-candidates/fixtures/jpa_shaped_tasks_baseline.sql             -f tests/security/migration-candidates/V1__review_tenant_project_registry.sql             -f tests/security/migration-candidates/V2__review_additive_task_owner_binding.sql             -f tests/security/s0-db-roles/disposable_readonly_registry_role.sql
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM aetheris_tasks")" = 7
          echo AETHERIS_S0_D2_DISPOSABLE_REAL_PG16_ROLE_CREATED_PASS
      - name: Actual signed RS256 JDBC and restricted database permission denials
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml             -Dtest=RuntimeVerifiedRegistryTaskReadProbeTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskMissionHttpFilterTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          grep -Fq 'Stage45 NO_GO' docs/security/RUNTIME_S0_RESTRICTED_READ_ROLE_20261029.md
          echo AETHERIS_S0_D2_REAL_SIGNED_JDBC_LEAST_PRIVILEGE_AND_DENIAL_PASS
      - name: Confirm restricted principal changed no schema or task state
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM aetheris_tasks WHERE state='QUEUED'")" = 7
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='s0_privilege_escape'")" = 0
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM registry_tenants")" = 3
          echo AETHERIS_S0_D2_NO_MUTATIONS_HTTP_UNLOCK_OR_PRODUCTION_CLAIM_PASS
