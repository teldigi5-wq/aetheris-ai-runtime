name: Runtime S0-E4 Real Default API Quarantine (Full App)
on:
  pull_request:
    branches:
      - security/s0-e3-full-application-http-containment-20261029
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimeUncertifiedApiHttpFilter.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeProductionApiQuarantineTest.java'
      - '.github/workflows/runtime-s0-e4-default-api-quarantine.yml'
      - 'docs/security/RUNTIME_S0_E4_DEFAULT_API_QUARANTINE_20261029.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-s0-e4-api-quarantine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-actual-runtime-deny-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AETHERIS_DISPATCHER_ENABLED: 'false'
      AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED: 'false'
      AETHERIS_CLOUD_PROVIDER_ENABLED: 'false'
      AETHERIS_EXECUTION_WORKSPACE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact head, immutable default-deny, earlier Ownerless lockdown remains first
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('orchestrator-service/src')
          src=(root/'main/java/io/aetheris/orchestrator/security/RuntimeUncertifiedApiHttpFilter.java').read_text()
          original=(root/'main/java/io/aetheris/orchestrator/api/OwnerlessTaskMissionHttpFilter.java').read_text()
          test=(root/'test/java/io/aetheris/orchestrator/security/RuntimeProductionApiQuarantineTest.java').read_text()
          for x in ('@Component', '@Order(Ordered.HIGHEST_PRECEDENCE + 1)',
                    '"/api"', '"/actuator"', 'request.getServletPath()',
                    'request.getRequestURI()', 'response.sendError(HttpServletResponse.SC_NOT_FOUND)',
                    'chain.doFilter(request, response)'):
              assert x in src,x
          for forbidden in ('@ConditionalOnProperty', '@Profile(', 'System.getenv(',
                            'Authorization', 'verifyBearer(', 'X-Forwarded-', 'getHeader(',
                            'getParameter(', 'getSession(', 'Boolean.parseBoolean('):
              assert forbidden not in src, forbidden
          assert '@Component' in original and '@Order(Ordered.HIGHEST_PRECEDENCE)' in original
          assert 'SC_NOT_FOUND' in original
          for key in ('classes = AetherisOrchestratorApplication.class',
                      'jdbc:h2:mem:s0_e4_real_api_quarantine', 'app.getBean(TaskController.class)',
                      'app.getBean(RuntimeUncertifiedApiHttpFilter.class)',
                      'servletContext.getFilterRegistrations()', 'handlers.getHandlerMethods()',
                      'uncovered.isEmpty()', 'tasks.count()', '"server.address=127.0.0.1"'):
              assert key in test,key
          assert '@Import' not in test and 'OnlyInThisJunitContext' not in test
          event=(root/'main/java/io/aetheris/orchestrator/task/TaskEventStreamService.java').read_text()
          assert 'globalEmitters' not in event and 'subscribeAll(' not in event
          assert 'spring.jpa.hibernate.ddl-auto=update' in (root/'main/resources/application.properties').read_text()
          print('AETHERIS_S0_E4_UNCONDITIONAL_REAL_COMPONENT_NO_BEARER_OVERRIDE_PASS')
          PY
      - name: Real full Aetheris context, direct port HTTP, all registered routes audited
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml \
            -Dtest=RuntimeProductionApiQuarantineTest,RuntimeFullAppHttpContainmentTest,RuntimePinnedSpringBootHttpIntegrationTest,RuntimePinnedHttpBearerGateLoopbackTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskMissionHttpFilterTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          grep -Fq 'Stage45 NO_GO' docs/security/RUNTIME_S0_E4_DEFAULT_API_QUARANTINE_20261029.md
          echo AETHERIS_S0_E4_FULL_RUNTIME_REQUIRES_REAL_DEFAULT_DENY_ON_ACTUAL_HTTP_PASS
      - name: No production route grant, database rollout or release approval
        shell: bash
        run: |
          set -euo pipefail
          test ! -f orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimePinnedHttpBearerGateRegistration.java
          test ! -f orchestrator-service/src/main/java/io/aetheris/orchestrator/api/SignedTaskController.java
          echo AETHERIS_S0_E4_UNMERGED_AVAILABILITY_IMPACT_AND_NO_GO_ACKNOWLEDGED_PASS
