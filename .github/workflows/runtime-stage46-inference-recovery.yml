name: Runtime Stage 46.4 Local Inference Budget and Recovery

on:
  pull_request:
    branches:
      - feature/stage46-local-model-readiness-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraLoopbackModelClient.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraLocalTextCompanion.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntraLoopbackModelClientTest.java'
      - 'docs/runtime/stage46-local-inference-recovery.md'
      - '.github/workflows/runtime-stage46-inference-recovery.yml'

permissions:
  contents: read

jobs:
  controlled-local-inference-and-fault-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Synthetic slow Ollama timeouts, local breaker, digest STOP and bounded HTTP
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraLoopbackModelClientTest,SyntraLocalModelReadinessTest,SyntraLocalTextCompanionTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest test
      - name: Confirm default console still never contacts model server
        run: |
          printf 'status\nhi syntra\nmodel health\nask explain java\nquit\n' \
            | java -cp orchestrator-service/target/classes \
              io.aetheris.orchestrator.voice.SyntraLocalTextCompanion \
            > "$RUNNER_TEMP/stage46-model-disabled.txt"
          grep -F 'network NOT USED' "$RUNNER_TEMP/stage46-model-disabled.txt"
          grep -F 'DENIED: typed wake and explicit local-model opt-in required' "$RUNNER_TEMP/stage46-model-disabled.txt"
          echo STAGE46_DEFAULT_NO_MODEL_IO

  release-gate-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Synthetic policy cannot authorize deployment or desktop execution
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/no-go.json"
          python3 - "$RUNNER_TEMP/no-go.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          assert report["decision"] == "NO_GO"
          assert len(report["release_blockers"]) == 13
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          assert report["production_pilot_authorized"] is False
          print("STAGE46_INFERENCE_PRODUCTION_NO_GO")
          PY

  complete-orchestrator-and-host-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: All orchestrator Java tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test
