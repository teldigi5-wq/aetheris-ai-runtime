name: Runtime consolidated deny-only HTTP and owner JDBC regression (review only)
# This is a review-only, single-branch proof. A path allowlist can leave
# stale green evidence when a security-related inherited class is changed.
# Reverify every commit on this exact draft branch, including workflow edits.
on:
  push:
    branches: [security/runtime-quarantine-pathinfo-boundary-20261101]
permissions:
  contents: read
jobs:
  decoded-servlet-pathinfo-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ownerlab_ci
          POSTGRES_PASSWORD: disposable_ci_only_not_a_real_secret
          POSTGRES_DB: ownerlab_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownerlab_ci -d ownerlab_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AETHERIS_OWNER_SCHEMA_DISPOSABLE_CI_ONLY: "yes"
      AETHERIS_MEMBERSHIP_JDBC_MUST_RUN: "yes"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: "ownerlab_ci"
      PGDATABASE: "ownerlab_disposable"
      PGPASSWORD: "disposable_ci_only_not_a_real_secret"
      AETHERIS_DISPATCHER_ENABLED: 'false'
      AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED: 'false'
      AETHERIS_CLOUD_PROVIDER_ENABLED: 'false'
      AETHERIS_EXECUTION_WORKSPACE_WRITE_ENABLED: 'false'
    steps:
      - name: Checkout isolated candidate, no credentials persisted
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm exact head and production filters stay quarantine-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator")
          for p,order in [
              (root/"api/OwnerlessTaskMissionHttpFilter.java", "@Order(Ordered.HIGHEST_PRECEDENCE)"),
              (root/"security/RuntimeUncertifiedApiHttpFilter.java", "@Order(Ordered.HIGHEST_PRECEDENCE + 1)")
          ]:
              s=p.read_text()
              assert order in s and "SC_NOT_FOUND" in s and "@Component" in s
          assert "enum Verdict { QUARANTINED }" in (root/"security/RuntimeRouteAdmissionPolicy.java").read_text()
          pinned=(root/"security/RuntimePinnedPrincipalVerifier.java").read_text()
          assert "expiresAt.isAfter(clock.instant())" in pinned
          # The JTI draft extended this PRIVATE constructor with signed
          # issuance/provenance fields. Do not reassert the superseded shape:
          # still require expiry/clock and signature-derived identity facts.
          assert "scopes, issued, expires, signedJti, expectedIssuer," in pinned
          assert "expectedKid, clock" in pinned
          assert "claims.getId()" in pinned
          assert "isFresh() && scopes.contains(scope)" in pinned
          assert "return isFresh() ? scopes : Set.of()" in pinned
          assert "VerifiedPrincipal verifyBearerForRevocation(" in pinned
          assert "verified.requireRevocationFacts();" in pinned
          assert "String signedJti = claims.getId()" in pinned
          assert "private VerifiedRevocationFacts(" in pinned
          assert "revocationBoundVerifierRejectsMissingIdAndExpiredRetainedPrincipal" in (Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimePinnedPrincipalVerifierTest.java")).read_text()
          assert "cachedPrincipalExpiresBeforeAnotherRealJdbcTaskRead" in (Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeVerifiedTaskReadProbeTest.java")).read_text()
          compat=(Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeB62EpochSignerCompatibilityTest.java")).read_text()
          for marker in ("Platform B62-G1 PR #302", "NOT a per-JTI session allowlist", "GREATEST(", "AND ? <= reject_issued_at_or_before_epoch", "DROP SCHEMA IF EXISTS", "commitBoundarySnapshotAndConnectionFailureDeny", "emergencyNonrevocationNeverSubstitutesForActiveSignedSession", "independentlyAuthenticatedReaderCannotWriteOrAlterSchema", "ownerlab_b62r_", "GRANT SELECT ON TABLE", "DROP ROLE ", "synthetic_session_registration", "AND active.state='ACTIVE'", "AND ? <= reject_issued_at_or_before_epoch"):
              assert marker in compat, marker
          synthetic_jti=(Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeSyntheticSignedSessionJdbcTest.java")).read_text()
          for marker in ("Assumptions.assumeTrue", "ownerlab_jti_", "requireRevocationFacts()", "current_setting('transaction_isolation') = 'read committed'", "DROP SCHEMA IF EXISTS", "committedRevocationIsNextStatementVisibleAndStoreFailureDenies"):
              assert marker in synthetic_jti, marker
          assert "AND s.iat_seconds > epoch.min_iat_seconds" in synthetic_jti
          assert "AND s.iat_seconds >= epoch.min_iat_seconds" not in synthetic_jti
          assert "principalEpochRejectsTokenIssuedAtCutoffButPermitsNextSecond" in synthetic_jti
          assert "GREATEST(min_iat_seconds,?)" in synthetic_jti
          assert "@Component" not in synthetic_jti and "@RestController" not in synthetic_jti
          bridge = (Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeHttpSignedOwnerJdbcBoundaryTest.java")).read_text()
          for marker in ("Assumptions.assumeTrue", "DROP SCHEMA IF EXISTS", "new OwnerlessTaskMissionHttpFilter()", "new RuntimeUncertifiedApiHttpFilter()", "committedTenantRevocationDeniesNextRealSignedHttpRequest"):
              assert marker in bridge, marker
          assert "retainedVerifiedPrincipalLosesScopesWhenSignedTokenExpires" in (Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimePinnedPrincipalVerifierTest.java")).read_text()
          # Keep the inherited full-context route policy and signed principal
          # tests runnable on this exact draft head, not only its leaf regressions.
          test_root=Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security")
          for name in ("RuntimeRouteAdmissionPolicyTest", "RuntimeFullAppPinnedIdentityAuthorityTest", "RuntimeControllerPolicyInventoryTest", "RuntimeFullAppHttpContainmentTest", "RuntimePinnedSpringBootHttpIntegrationTest", "RuntimePinnedHttpBearerGateLoopbackTest"):
              src=(test_root/(name+".java")).read_text()
              assert "@Test" in src and name in src, name
          probe=(root/"security/RuntimeVerifiedTaskReadProbe.java").read_text()
          regression=(Path("orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeVerifiedTaskReadProbeTest.java")).read_text()
          assert "current_setting('transaction_isolation') = 'read committed'" in probe
          assert "tm.valid_until > statement_timestamp()" in probe
          assert "pm.valid_until > statement_timestamp()" in probe
          assert "committedExternalMembershipRevocationIsSeenByOpenReaderTransaction" in regression
          assert "DROP SCHEMA IF EXISTS " in regression
          old_workflow=Path(".github/workflows/runtime-verified-jdbc-membership.yml").read_text()
          assert "current_setting('transaction_isolation') = 'read committed'" in old_workflow
          assert "'CURRENT_TIMESTAMP'" not in old_workflow
          print("RUNTIME_QUARANTINE_PRODUCTION_FILTERS_UNCHANGED_IN_ORDER")
          PY
      - name: Full stacked JWT, 403-entry route policy, direct-port HTTP and PostgreSQL regression
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml \
            -Dtest=RuntimeQuarantinePathInfoBoundaryTest,RuntimeRealDirectPortDenialRegressionTest,RuntimeRouteAdmissionPolicyTest,RuntimeFullAppPinnedIdentityAuthorityTest,RuntimeControllerPolicyInventoryTest,RuntimeProductionApiQuarantineTest,RuntimeFullAppHttpContainmentTest,RuntimePinnedSpringBootHttpIntegrationTest,RuntimePinnedHttpBearerGateLoopbackTest,OwnerlessTaskMissionHttpFilterTest,RuntimeVerifiedTaskReadProbeTest,RuntimeHttpSignedOwnerJdbcBoundaryTest,RuntimeSyntheticSignedSessionJdbcTest,RuntimeB62EpochSignerCompatibilityTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          echo 'RUNTIME_CONSOLIDATED_HTTP_IDENTITY_POLICY_AND_OWNER_JDBC_REGRESSION_PASS'
      - name: Verify private route inventory is still deny-only
        shell: bash
        run: |
          set -euo pipefail
          file=orchestrator-service/target/s0-e5-route-audit/runtime-handler-policy-matrix.tsv
          test -s "$file"
          test "$(grep -c 'DENY_404' "$file")" -ge 70
          if grep -E '(^|[[:space:]])(ALLOW|PERMIT|UNLOCKED)([[:space:]]|$)|UNCLASSIFIED_STOP' "$file"; then
            echo 'Unexpected route admission or unknown controller classification' >&2
            exit 1
          fi
          echo 'RUNTIME_FULL_MVC_ROUTE_INVENTORY_ALL_DENY_REVIEW_PASS'
      - name: Verify no transient shared-schema or permanent tenant/task objects
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          test "$(psql -X -A -t -c "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('aetheris_tasks','tenant_memberships','project_memberships') AND table_schema NOT LIKE 'pg_temp_%'")" = "0"
          test "$(psql -X -A -t -c "SELECT count(*) FROM pg_namespace WHERE nspname LIKE 'ownerlab_xconn_%' OR nspname LIKE 'ownerlab_http_%' OR nspname LIKE 'ownerlab_jti_%' OR nspname LIKE 'ownerlab_b62_%'")" = "0"
          test "$(psql -X -A -t -c "SELECT count(*) FROM pg_roles WHERE rolname LIKE 'ownerlab_b62r_%'")" = "0"
          echo 'RUNTIME_DISPOSABLE_PG16_CROSS_SESSION_SCHEMA_CLEANUP_PASS'
      - name: No API admission, deployment or publication
        shell: bash
        run: |
          echo 'RUNTIME_TASK_SSE_UNCERTIFIED_NO_GO_NO_XERJ'
