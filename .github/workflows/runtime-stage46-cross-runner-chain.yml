name: Runtime Stage 46.19 Cross-Runner Build Provenance and Draft PR Chain Audit

on:
  pull_request:
    branches:
      - feature/stage46-synthetic-wfp-correlation-and-dual-build-20261015
      - main
    paths:
      - 'tools/security/stage46_pr_chain_audit.py'
      - 'tools/security/test_stage46_pr_chain_audit.py'
      - 'docs/runtime/stage46-draft-chain-integrity-manifest.json'
      - 'tools/security/stage46_cross_runner_build_gate.py'
      - 'tools/security/test_stage46_cross_runner_build_gate.py'
      - 'workstation-agent/packaging/stage46/Build-SyntraSyntheticIndependentRunner.ps1'
      - 'docs/runtime/stage46-cross-runner-provenance-chain-review.md'
      - '.github/workflows/runtime-stage46-cross-runner-chain.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  windows-builder-a:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.build.outputs.digest }}
      source_sha256: ${{ steps.build.outputs.source_digest }}
      signature: ${{ steps.build.outputs.signature }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile fixed unsigned synthetic fixture on runner A
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Build-SyntraSyntheticIndependentRunner.ps1 -Builder A
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_19_BUILDER_A_FAIL' }

  windows-builder-b:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.build.outputs.digest }}
      source_sha256: ${{ steps.build.outputs.source_digest }}
      signature: ${{ steps.build.outputs.signature }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile fixed unsigned synthetic fixture on runner B
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Build-SyntraSyntheticIndependentRunner.ps1 -Builder B
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_19_BUILDER_B_FAIL' }

  separate-runner-hashes-and-live-stack-readonly-audit:
    needs: [windows-builder-a, windows-builder-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require byte-identical fixed native binaries from two Windows runner jobs
        env:
          WIN_A_SHA256: ${{ needs.windows-builder-a.outputs.sha256 }}
          WIN_A_SOURCE_SHA256: ${{ needs.windows-builder-a.outputs.source_sha256 }}
          WIN_A_SIGNATURE: ${{ needs.windows-builder-a.outputs.signature }}
          WIN_B_SHA256: ${{ needs.windows-builder-b.outputs.sha256 }}
          WIN_B_SOURCE_SHA256: ${{ needs.windows-builder-b.outputs.source_sha256 }}
          WIN_B_SIGNATURE: ${{ needs.windows-builder-b.outputs.signature }}
          EXACT_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/security/stage46_cross_runner_build_gate.py --from-github-actions-env
      - name: Fetch 13 actual GitHub PRs read-only and check exact branch+commit adjacency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BASE: ${{ github.event.pull_request.base.ref }}
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/security/stage46_pr_chain_audit.py \
            --manifest docs/runtime/stage46-draft-chain-integrity-manifest.json \
            --current-base "$CURRENT_BASE" --current-base-sha "$CURRENT_BASE_SHA"
      - name: Adversarial tests for forged releases, stale chains and retargeted draft PRs
        run: |
          python3 -m unittest discover -s tools/security -p test_stage46_cross_runner_build_gate.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_pr_chain_audit.py -v

  linux-existing-voice-and-release-security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Synthetic voice STOP process and owner-bound regression
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Existing Stage 46.15-46.18 evidence and policy regressions
        run: |
          python3 -m unittest discover -s tools/security -p test_stage46_worker_trust_evidence.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_provenance_gate.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_drop_audit_gate.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_synthetic_match_contract.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_synthetic_dual_build_gate.py -v
      - name: Preserve all thirteen NO_GO blockers
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-19-release-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-19-release-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as source: report=json.load(source)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_19_THIRTEEN_RELEASE_BLOCKERS_OWNER_PC_NO_GO")
          PY

  full-orchestrator-and-workstation-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator JUnit tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Workstation-agent JUnit tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  static-no-release-no-device-no-wfp-modification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert fixed native source and no live WFP mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('workstation-agent/packaging/stage46')
          build=(root/'Build-SyntraSyntheticIndependentRunner.ps1').read_text()
          gate=Path('tools/security/stage46_cross_runner_build_gate.py').read_text()
          audit=Path('tools/security/stage46_pr_chain_audit.py').read_text()
          assert '/Brepro' in build and 'NotSigned' in build
          assert 'Get-FileHash' in build and 'GITHUB_OUTPUT' in build
          assert 'separate_trust_domains_verified' in gate
          assert '"decision": "NO_GO"' in gate
          assert 'method="GET"' in audit and 'urlopen(request, timeout=12)' in audit
          for bad in ("FwpmFilterAdd", "FwpmFilterDelete", "FwpmNetEventSubscribe",
                      "TargetDataLine", "SourceDataLine", "SyntraLoopbackModelClient",
                      "Start-Process", "Invoke-WebRequest"):
              assert bad not in build and bad not in gate
          print("STAGE46_19_READ_ONLY_PR_AUDIT_AND_UNSIGNED_CROSS_RUNNER_NO_GO")
          PY
