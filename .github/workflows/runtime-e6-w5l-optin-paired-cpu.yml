name: Enterprise E6 W5-L Owner-Approved Six-Cell CPU Research - Fresh Label Only
on:
  pull_request:
    types:
      - labeled
    branches:
      - feat/e6-w5i-local-inference-completion-20261102
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: e6-w5l-owner-approved-paired-cpu
  cancel-in-progress: false
jobs:
  exact-owner-six-cell-cpu:
    if: >-
      github.event.label.name == 'e6-w5l-six-cell-cpu-approved' &&
      github.event.pull_request.number == 275 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.user.login == 'teldigi5-wq' &&
      github.actor == 'teldigi5-wq' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'feat/e6-w5i-local-inference-completion-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_LLM_LIBRARY: cpu
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      HIP_VISIBLE_DEVICES: '-1'
      E6_W5L_ENABLE_OWNER_LABELED_CPU_TRIAL: 'YES'
      E6_W5L_APPROVED_PR_NUMBER: '275'
      E6_W5L_CHECKED_OUT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      MODEL_TAG: qwen2.5:0.5b
    steps:
      - name: Checkout immutable, freshly labeled PR head without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Pin Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify NEW owner label event and exact checked-out SHA BEFORE downloads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E6_W5L_CHECKED_OUT_PR_HEAD"
          test "$(uname -m)" = 'x86_64'
          cd tools/enterprise/e6_studio/next-studio
          node --check w5l_owner_cpu_gate.mjs
          node --check w5l_owner_cpu_cli.mjs
          node --check w5l_live_capture_adapter.mjs
          node --check w5l_sanitized_metadata_gate.mjs
          node w5l_owner_cpu_cli.mjs authorize
          node --test test_w5l_owner_cpu_gate.mjs test_w5l_sanitized_metadata_gate.mjs
          echo E6_W5L_NEW_LABEL_EXACT_SHA_VERIFIED_NO_INFERENCE_YET
      - name: Demand successful model-free CI on exactly the labeled commit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E6_W5L_CHECKED_OUT_PR_HEAD"
          curl --fail --silent --show-error --connect-timeout 12 --max-time 35 --max-filesize 200000 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_READ_TOKEN" -H 'User-Agent: aetheris-w5l-preflight-check' "https://api.github.com/repos/teldigi5-wq/aetheris-ai-runtime/commits/$E6_W5L_CHECKED_OUT_PR_HEAD/check-runs?per_page=100" -o "$RUNNER_TEMP/w5l-check-runs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          head=os.environ['E6_W5L_CHECKED_OUT_PR_HEAD']
          source=json.loads((Path(os.environ['RUNNER_TEMP'])/'w5l-check-runs.json').read_text())
          assert source.get('total_count',101)<=100
          runs=[x for x in source.get('check_runs',[]) if x.get('name')=='bounded-model-proposal-and-simulated-browser-only']
          assert len(runs)==1,'exact-head normal model-free check is missing or ambiguous'
          x=runs[0]
          assert x.get('head_sha')==head and x.get('status')=='completed'
          assert x.get('conclusion')=='success'
          assert x.get('app',{}).get('slug')=='github-actions'
          print('E6_W5L_EXACT_HEAD_NORMAL_MODEL_FREE_CI_VERIFIED')
          PY
      - name: Recheck live owner label before downloading CPU runtime or model
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E6_W5L_CHECKED_OUT_PR_HEAD"
          curl --fail --silent --show-error --connect-timeout 12 --max-time 35 --max-filesize 200000 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_READ_TOKEN" -H 'User-Agent: aetheris-w5l-current-owner-pr' 'https://api.github.com/repos/teldigi5-wq/aetheris-ai-runtime/pulls/275' -o "$RUNNER_TEMP/w5l-live-owner-pr.json"
          cd tools/enterprise/e6_studio/next-studio
          node w5l_owner_cpu_cli.mjs live-approval
      - name: Download SHA-pinned CPU-only Ollama v0.40.13 into ephemeral runner
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 480 --max-filesize 1600000000 'https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst' -o "$RUNNER_TEMP/w5l-ollama-linux-amd64.tar.zst"
          echo 'c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6  '"$RUNNER_TEMP/w5l-ollama-linux-amd64.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/w5l-ollama-bin" "$RUNNER_TEMP/w5l-ollama-models"
          tar --zstd -xf "$RUNNER_TEMP/w5l-ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/w5l-ollama-bin"
          test -x "$RUNNER_TEMP/w5l-ollama-bin/bin/ollama"
          echo "$RUNNER_TEMP/w5l-ollama-bin/bin" >> "$GITHUB_PATH"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/w5l-ollama-models" >> "$GITHUB_ENV"
      - name: Pull exactly one research model on CPU and verify the published tag prefix
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/w5l-ollama-models"
          "$RUNNER_TEMP/w5l-ollama-bin/bin/ollama" serve > "$RUNNER_TEMP/w5l-private-ollama.log" 2>&1 &
          for n in $(seq 1 100); do
            if curl --silent --fail --max-time 2 'http://127.0.0.1:11434/api/version' > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --max-time 5 'http://127.0.0.1:11434/api/version' > /dev/null
          timeout --signal=TERM --kill-after=10s 600s "$RUNNER_TEMP/w5l-ollama-bin/bin/ollama" pull "$MODEL_TAG"
          curl --fail --silent --show-error --max-time 15 'http://127.0.0.1:11434/api/tags' -o "$RUNNER_TEMP/w5l-model-tags.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'w5l-model-tags.json').read_text())
          matches=[x for x in data.get('models',[]) if isinstance(x,dict) and (x.get('name')=='qwen2.5:0.5b' or x.get('model')=='qwen2.5:0.5b')]
          assert len(matches)==1,'installed tag not unique or not found'
          digest=matches[0].get('digest','')
          assert isinstance(digest,str) and len(digest.removeprefix('sha256:'))==64
          assert digest.removeprefix('sha256:').lower().startswith('a8b0c5157701')
          print('E6_W5L_VENDOR_TAG_PREFIX_CHECK_NOT_MODEL_WEIGHTS_ATTESTATION')
          PY
          # The 12-digit tag prefix alone cannot prove the actual file bytes.
          # Require the published exact GGUF hash, byte size and all four
          # accompanying system/template/license/config blob digests.
          cd tools/enterprise/e6_studio/next-studio
          python3 w5l_model_blob_integrity.py
      - name: Recheck LIVE owner approval again immediately before paired inference
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E6_W5L_CHECKED_OUT_PR_HEAD"
          curl --fail --silent --show-error --connect-timeout 12 --max-time 35 --max-filesize 200000 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_READ_TOKEN" -H 'User-Agent: aetheris-w5l-current-owner-pr' 'https://api.github.com/repos/teldigi5-wq/aetheris-ai-runtime/pulls/275' -o "$RUNNER_TEMP/w5l-live-owner-pr.json"
          cd tools/enterprise/e6_studio/next-studio
          node w5l_owner_cpu_cli.mjs live-approval
      - name: Attempt exactly three held-out compact-versus-staged pairs on CPU
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E6_W5L_CHECKED_OUT_PR_HEAD"
          cd tools/enterprise/e6_studio/next-studio
          node w5l_owner_cpu_cli.mjs run
          test -s target/e6-w5l-owner-cpu-review/paired-design-metadata.json
          echo E6_W5L_DESIGN_ONLY_UNATTESTED_HUMAN_REVIEW_REQUIRED_NO_RELEASE
      - name: Reject any noncanonical or raw owner CPU evidence before upload
        id: w5l_artifact_validation
        if: always()
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          node w5l_sanitized_metadata_gate.mjs
      - name: Preserve only sanitized evidence for seven days even on rejection
        if: ${{ always() && steps.w5l_artifact_validation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e6-w5l-owner-approved-six-cell-sanitized-metadata
          path: |
            tools/enterprise/e6_studio/next-studio/target/e6-w5l-owner-cpu-review/
          retention-days: 7
          if-no-files-found: ignore
