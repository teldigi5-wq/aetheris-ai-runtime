name: E3.9G-12B4M Actual Focus Ring Clipping Browser Regression
on:
  pull_request:
    branches: [test/e39g12b4l-source-selector-hints-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4m_focus_ring_chromium.mjs'
      - 'tools/enterprise/e3_factory/test_e39g12b4m_focus_ring_semantics.py'
      - 'docs/runtime/e39g12b4m-focus-indicator-semantics-20261025.md'
      - 'docs/runtime/roadmap-current-e3-through-e9-20261025.md'
      - 'README.md'
      - '.github/workflows/runtime-e39g12b4m-focus-ring.yml'
permissions:
  contents: read
jobs:
  exact-history-and-default-deny:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - name: Static model receipt hash, source delta and full focus outline semantics
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4m_focus_ring_semantics.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4l_source_hints.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4k_two_real_model_trial.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4j_typed_control_worker.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b2_isolation_policy.py' -v
          node --check tools/enterprise/e3_factory/e39g12b4m_focus_ring_chromium.mjs
      - name: Enforce role registry and permission deny-by-default
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
  real-trusted-chromium-outline-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - name: Install pinned Playwright Chromium and no untrusted node postinstall
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify archived top-zero model proposal clips visible keyboard focus outline
        run: node tools/enterprise/e3_factory/e39g12b4m_focus_ring_chromium.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b4m-trusted-focus-ring-5x5-viewport-controls-no-model
          path: target/e3-factory/e39g12b4m-focus-ring/
          if-no-files-found: warn
          retention-days: 10
