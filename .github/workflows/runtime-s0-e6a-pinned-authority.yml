name: Runtime S0-E6A Managed Pinned Identity Authority
on:
  pull_request:
    branches:
      - security/s0-e5-controller-policy-inventory-20261029
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimePinnedIdentityAuthority.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/security/RuntimeFullAppPinnedIdentityAuthorityTest.java'
      - '.github/workflows/runtime-s0-e6a-pinned-authority.yml'
      - 'docs/security/RUNTIME_S0_E6A_MANAGED_IDENTITY_AUTHORITY_20261029.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-s0-e6a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-app-signed-principal-no-grants:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AETHERIS_DISPATCHER_ENABLED: 'false'
      AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED: 'false'
      AETHERIS_CLOUD_PROVIDER_ENABLED: 'false'
      AETHERIS_EXECUTION_WORKSPACE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact commit and production identity authority must not grant HTTP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('orchestrator-service/src')
          code=(root/'main/java/io/aetheris/orchestrator/security/RuntimePinnedIdentityAuthority.java').read_text()
          expected=(
            '@Component','public-key-pem-base64','key-id','issuer','audience',
            'if (key.isEmpty() && kid.isEmpty() && issuer.isEmpty() && audience.isEmpty())',
            'Incomplete pinned Runtime Identity trust configuration',
            'new RuntimePinnedPrincipalVerifier(', 'requireVerifiedPrincipal(',
            'if (verifier == null)', 'Base64.getDecoder()', 'Clock.systemUTC()',
          )
          for x in expected: assert x in code,x
          for x in ('@RestController','@RequestMapping','@GetMapping','@PostMapping',
                    'OncePerRequestFilter','FilterRegistrationBean','@Order(',
                    'chain.doFilter','sendError(','URL(', 'System.getenv('):
              assert x not in code,x
          pinned=(root/'main/java/io/aetheris/orchestrator/security/RuntimePinnedPrincipalVerifier.java').read_text()
          assert 'private VerifiedPrincipal(' in pinned
          assert 'verifyWith(trustedKey)' in pinned
          orig=(root/'main/java/io/aetheris/orchestrator/api/OwnerlessTaskMissionHttpFilter.java').read_text()
          quarantine=(root/'main/java/io/aetheris/orchestrator/security/RuntimeUncertifiedApiHttpFilter.java').read_text()
          assert '@Order(Ordered.HIGHEST_PRECEDENCE)' in orig
          assert '@Order(Ordered.HIGHEST_PRECEDENCE + 1)' in quarantine
          assert 'SC_NOT_FOUND' in orig and 'SC_NOT_FOUND' in quarantine
          test=(root/'test/java/io/aetheris/orchestrator/security/RuntimeFullAppPinnedIdentityAuthorityTest.java').read_text()
          for x in ('classes = AetherisOrchestratorApplication.class','DynamicPropertySource',
                    'jdbc:h2:mem:s0_e6a_identity_authority','spring.jpa.hibernate.ddl-auto=create-drop',
                    'app.getBean(RuntimePinnedIdentityAuthority.class)',
                    'assertFalse(absent.isConfigured())',
                    'RuntimePinnedIdentityAuthority(partial)',
                    'RuntimePinnedIdentityAuthority(invalidBase64)',
                    'for(String bearer:new String[]{good(),"Bearer forged",null})',
                    'tasks.count()', 'GET', 'assertEquals(404,response.statusCode(),path)'):
              assert x in test,x
          assert 'spring.jpa.hibernate.ddl-auto=update' in (root/'main/resources/application.properties').read_text()
          events=(root/'main/java/io/aetheris/orchestrator/task/TaskEventStreamService.java').read_text()
          assert 'globalEmitters' not in events and 'subscribeAll(' not in events
          print('AETHERIS_S0_E6A_MANAGED_PINNED_IDENTITY_NO_HTTP_AUTHORITY_PASS')
          PY
      - name: Full real Spring application with signed Identity and predecessor security tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f orchestrator-service/pom.xml \
            -Dtest=RuntimeFullAppPinnedIdentityAuthorityTest,RuntimeControllerPolicyInventoryTest,RuntimeProductionApiQuarantineTest,RuntimeFullAppHttpContainmentTest,RuntimePinnedSpringBootHttpIntegrationTest,RuntimePinnedHttpBearerGateLoopbackTest,RuntimePinnedPrincipalVerifierTest,OwnerlessTaskMissionHttpFilterTest,OwnerlessTaskEventLockdownTest,InternalTaskEventJournalLockdownTest test
          grep -Fq 'Stage45 NO_GO' docs/security/RUNTIME_S0_E6A_MANAGED_IDENTITY_AUTHORITY_20261029.md
          echo AETHERIS_S0_E6A_REAL_FULL_APP_PINNED_IDENTITY_AND_DENY_ONLY_HTTP_PASS
      - name: No customer route opened or HTTP security order changed
        shell: bash
        run: |
          set -euo pipefail
          test ! -f orchestrator-service/src/main/java/io/aetheris/orchestrator/security/RuntimePinnedHttpBearerGateRegistration.java
          echo AETHERIS_S0_E6A_JWT_CRYPTOGRAPHIC_IDENTITY_NOT_TENANT_AUTHORIZATION_NO_GO_PASS
