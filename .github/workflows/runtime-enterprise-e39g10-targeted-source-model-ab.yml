name: Enterprise E3.9G-10 Source-Targeted vs Original Real Model Website Repair

on:
  pull_request:
    branches:
      - feature/enterprise-e39g9-multidomain-real-model-ci-20261020
    paths:
      - 'tools/enterprise/e3_factory/e39g7_*'
      - 'tools/enterprise/e3_factory/e39g8_*'
      - 'tools/enterprise/e3_factory/e39g9_*'
      - 'tools/enterprise/e3_factory/e39g10_*'
      - 'tools/enterprise/e3_factory/run_locked_worker.sh'
      - '.github/workflows/runtime-enterprise-e39g10-targeted-source-model-ab.yml'
      - 'docs/runtime/enterprise-e39g10-source-targeting-ab.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-proposer-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Vendor Git blob, 14 skills and role allowlist review
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
      - name: Adversarial no-oracle and pinned skill A-B tests
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g7_skill_ab.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g8_model_browser.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g9_multidomain.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g10_targeted_prompt.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39e_eight_model_policy.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39f_forensics.py' -v

  actual-local-ollama-design-skill-ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: granite4-3b
            model: 'granite4:3b'
          - label: hermes3-3b
            model: 'hermes3:3b'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AETHERIS_E39G10_ACTUAL_TARGETED_PROMPT_EXPLICIT_OPT_IN: 'yes'
      MODEL_IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build test-only website in locked network-none Docker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Prepare real Chromium independently of model proposals
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Start pinned and resource-limited local Ollama inference container
        run: |
          set -euo pipefail
          docker pull "$MODEL_IMAGE"
          docker run -d --name e39g7-model --cpus 2 \
            --memory 5g --memory-swap 5g --pids-limit 128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$MODEL_IMAGE"
          docker inspect e39g7-model > "$RUNNER_TEMP/e39g7-model-inspect.json"
          python3 - "$RUNNER_TEMP/e39g7-model-inspect.json" <<'PY'
          import json,sys
          from pathlib import Path
          cfg=json.loads(Path(sys.argv[1]).read_text())[0]["HostConfig"]
          assert cfg["NanoCpus"]==2000000000
          assert cfg["Memory"]==5368709120 and cfg["MemorySwap"]==5368709120
          assert cfg["ReadonlyRootfs"] is True and cfg["PidsLimit"]==128
          assert "ALL" in cfg["CapDrop"] and "no-new-privileges" in cfg["SecurityOpt"]
          assert cfg["PortBindings"]["11434/tcp"][0]["HostIp"]=="127.0.0.1"
          print("E39G7_LOCAL_REAL_MODEL_CPU_MEMORY_LOOPBACK_LIMITS_VERIFIED")
          PY
      - name: Pull exactly one reviewed OSS model to ephemeral CI container
        env:
          MODEL_TAG: ${{ matrix.model }}
        run: |
          timeout --signal=TERM --kill-after=5s 420s docker exec e39g7-model ollama pull "$MODEL_TAG"
          docker exec e39g7-model ollama list
      - name: Paired real original-vs-source-targeted model prompts with independently scored Chromium repairs
        env:
          MODEL_TAG: ${{ matrix.model }}
        run: |
          set -euo pipefail
          for id in mobile-940 reduced-boolean scroll-24; do
            bash tools/enterprise/e3_factory/run_locked_worker.sh e39g9-seed "$id"
            node tools/enterprise/e3_factory/e39g9_multidomain_browser.mjs before "$id"
            timeout --signal=TERM --kill-after=5s 330s \
              python tools/enterprise/e3_factory/e39g10_targeted_adviser.py "$MODEL_TAG" "$id"
            slug="${MODEL_TAG/:/-}"
            for arm in original targeted; do
              token="$slug--$id--$arm"
              bash tools/enterprise/e3_factory/run_locked_worker.sh e39g10-apply "$token"
              applied="$(python3 - "$token" <<'PY'
          import json,sys
          from pathlib import Path
          slug,case,arm=sys.argv[1].split("--")
          row=json.loads((Path("target/e3-factory/e39g10/models")/slug/case/arm/"patch.json").read_text())
          assert row["evidenceClass"]=="E39G10_NETWORK_NONE_MODEL_SOURCE_POLICY"
          print("yes" if row["patchApplied"] is True else "no")
          PY
          )"
              if [[ "$applied" == "yes" ]]; then
                node tools/enterprise/e3_factory/e39g10_targeted_browser.mjs after "$id" "$slug" "$arm"
              fi
              python tools/enterprise/e3_factory/e39g10_targeted_score.py score "$token"
              bash tools/enterprise/e3_factory/run_locked_worker.sh e39g10-reset "$token"
            done
            bash tools/enterprise/e3_factory/run_locked_worker.sh e39g10-done "$slug--$id--original"
          done
          python tools/enterprise/e3_factory/e39g10_targeted_score.py summarize "$MODEL_TAG"
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
          node tools/enterprise/e3_factory/browser_qa.mjs
      - name: Record local model resource sample, not peak usage
        if: always()
        run: |
          mkdir -p target/e3-factory/e39d
          docker stats --no-stream --format '{{json .}}' e39g7-model \
            > target/e3-factory/e39d/e39g7-model-stats-snapshot.jsonl || true
      - name: Remove disposable model container and ephemeral weights
        if: always()
        run: docker rm -fv e39g7-model || true
      - name: Upload all real responses, unedited before-browser evidence and policy scorecards
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39g10-${{ matrix.label }}-source-targeting-real-browser-ab
          path: |
            target/e3-factory/e39d/
            target/e3-factory/e39g8/
            target/e3-factory/e39g9/
            target/e3-factory/e39g10/
            target/e3-factory/sandbox-e39d-*.json
          if-no-files-found: warn
          retention-days: 14

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  explicit-model-advice-only-no-owner-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify no model authority and unchanged original E33 categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path("tools/enterprise/e3_factory")
          proposer=(d/"e39g10_targeted_adviser.py").read_text()
          gate=(d/"e39g10_targeted_gate.py").read_text()
          scorer=(d/"e39g10_targeted_score.py").read_text()
          browser=(d/"e39g10_targeted_browser.mjs").read_text()
          runner=(d/"run_locked_worker.sh").read_text()
          assert "import e39g9_multidomain_worker" not in proposer
          assert "import e39g10_targeted_gate" not in proposer
          assert "realModelCalls" in proposer and "ownerApproved" in proposer
          assert "frozen.permitted" in gate
          assert "source" in proposer and "ONLY EDITABLE OLD SUBSTRING" in proposer
          assert "browserVerifiedModelRepair" in scorer
          assert "deterministicResetCountedAsRepair" in scorer
          assert "chromium.launch" in browser and "screenshotSha256" in browser
          assert "e39g10-apply" in runner and "--network none" in runner
          assert "127.0.0.1:11434:11434" in Path(
             ".github/workflows/runtime-enterprise-e39g9-multidomain-website-ab.yml").read_text()
          for bad in ("import subprocess","os.system(","import requests","Popen("):
              assert bad not in proposer,bad
          print("E39G10_TWO_PROMPT_VARIANTS_SAME_SKILLS_REAL_MODEL_NO_OWNER_EXECUTION")
          PY
