name: Runtime Stage 46.25 Worker Symbol Decoupling and Source Migration Preflight

on:
  pull_request:
    branches:
      - feature/stage46-independent-synthetic-worker-module-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticHostLimits.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntraSyntheticProcessSpeechBoundary.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntheticWorkerProtocolContractTest.java'
      - 'tools/security/stage46_worker_source_migration_preflight.py'
      - 'tools/security/test_stage46_worker_source_migration_preflight.py'
      - 'docs/runtime/stage46-worker-symbol-decoupling.md'
      - '.github/workflows/runtime-stage46-worker-symbol-decoupling.yml'

permissions:
  contents: read

jobs:
  real-compiled-worker-symbol-and-independent-module-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile fixed independent module and normal Boot archive, without activation
        run: |
          ./mvnw -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          ./mvnw -B -f orchestrator-service/pom.xml -DskipTests clean package
      - name: Verify normal Boot ZIP omits both lab workers and inspect actual JVM ClassRefs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path=Path("orchestrator-service/target/orchestrator-service-0.2.0-SNAPSHOT.jar")
          prefix="BOOT-INF/classes/io/aetheris/orchestrator/voice/"
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
          count=sum((prefix+name+".class") in names for name in
                    ("SyntraSyntheticPcmWorkerMain","SyntraSyntheticJobProbeMain"))
          assert count==0,"PRODUCTION_JAR_WORKER_ENTRYPOINT_PRESENT"
          Path("/tmp/stage46-25-main-count").write_text(str(count),encoding="utf-8")
          PY
          python3 tools/security/stage46_worker_source_migration_preflight.py \
            --jar-worker-mains "$(cat /tmp/stage46-25-main-count)" \
            --output "$RUNNER_TEMP/stage46-25-real-javap-evidence.json"
      - name: Verify real separate worker module still has 2 bytecodes and no production edge
        run: python3 tools/security/stage46_independent_worker_module_gate.py
      - name: Adversarial forged ClassRef and wire-protocol tests
        run: python3 -m unittest discover -s tools/security -p test_stage46_worker_source_migration_preflight.py -v

  complete-orchestrator-speech-owner-and-workstation-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Java frozen PCM wire and class name agreement
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=SyntheticWorkerProtocolContractTest test
      - name: Existing synthetic voice process stop and owner consent suite
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Full orchestrator Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  windows-actual-independent-module-containment-regressions:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Independently build only the fixed two-worker lab
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_25_INDEPENDENT_MODULE_WINDOWS_BUILD_FAILED' }
      - name: Real reduced-token and Job Object, module classpath only
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_25_REDUCED_TOKEN_REGRESSION_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_25_JOB_OBJECT_REGRESSION_FAILED' }
      - name: Existing AppContainer synthetic permissions test
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_25_APPCONTAINER_REGRESSION_FAILED' }

  complete-policy-13-blockers-and-no-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Original compiled source/installer boundary and adversarial checks
        run: |
          python3 tools/security/stage46_integration_surface_gate.py
          python3 -m unittest discover -s tools/security -p test_stage46_integration_surface_gate.py -v
      - name: All thirteen immutable Stage45 release blockers
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-25-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-25-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["decision"]=="NO_GO" and len(result["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert result[key] is False,key
          print("STAGE46_25_ALL_THIRTEEN_BLOCKERS_OWNER_PC_AND_PRODUCTION_NO_GO")
          PY
