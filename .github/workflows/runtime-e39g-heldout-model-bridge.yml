name: E3.9G model-only held-out curator bridge contract
on:
  pull_request:
    branches: [test/e39g12b4n-safe-focus-alternatives-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g_heldout_local_model.py'
      - 'tools/enterprise/e3_factory/test_e39g_heldout_local_model.py'
      - '.github/workflows/runtime-e39g-heldout-model-bridge.yml'
      - 'docs/runtime/e39g-heldout-model-bridge-20261106.md'
      - 'tools/enterprise/e3_factory/e39g_public_model_smoke.py'
      - 'tools/enterprise/e3_factory/test_e39g_public_model_smoke.py'
      - 'tools/enterprise/e3_factory/test_e39g_workflow_model_digest.py'
permissions:
  contents: read
jobs:
  cross-platform-offline-interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Real B4G and B4H contracts, mock-model local transport
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g_heldout_local_model.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4g_curator_boundary.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4h_proposal_admission.py' -v
          python -m py_compile tools/enterprise/e3_factory/e39g_heldout_local_model.py
      - name: Existing governed skills remain deny-only
        shell: bash
        run: |
          set -euo pipefail
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g_public_model_smoke.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g_workflow_model_digest.py' -v
          python -m py_compile tools/enterprise/e3_factory/e39g_public_model_smoke.py


  public-broken-only-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Freeze four already PUBLIC source files, never golden references
        shell: bash
        run: |
          set -euo pipefail
          python tools/enterprise/e3_factory/e39g_public_model_smoke.py pack
          mkdir -p target/e3-factory/e39g-public-smoke/runner
          cp tools/enterprise/e3_factory/e39g_heldout_local_model.py target/e3-factory/e39g-public-smoke/runner/
          cp tools/enterprise/e3_factory/e39g12b4g_curator_boundary.py target/e3-factory/e39g-public-smoke/runner/
          test "$(find target/e3-factory/e39g-public-smoke/runner -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39g-public-broken-only-model-package
          path: target/e3-factory/e39g-public-smoke/
          if-no-files-found: error
          retention-days: 5

  genuine-model-four-public-controls-NO-CHECKOUT:
    needs: public-broken-only-packet
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MODEL: qwen2.5-coder:7b
      MODEL_SHA256: 'dae161e27b0e90dd1856c8bb3209201fd6736d8eb66298e75ed87571486f4364'
      IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      # NO checkout, golden source, model prompt policy, customer data or credentials.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: e39g-public-broken-only-model-package, path: received/}
      - name: Verify no checkout and exact public-model-only package
        shell: bash
        run: |
          set -euo pipefail
          for item in .git README.md docs skills orchestrator-service tools; do test ! -e "$item"; done
          test "$(find received -type f | wc -l)" -eq 3
          test -f received/model.zip
          test -f received/runner/e39g_heldout_local_model.py
          test -f received/runner/e39g12b4g_curator_boundary.py
          cp received/model.zip "$RUNNER_TEMP/e39g-known-public.zip"
          test ! -e "$RUNNER_TEMP/e39g-model-receipt.json"
          echo "E39G_MODEL_ONLY_NO_CHECKOUT_PUBLIC_CASES"
      - name: Start pinned confined loopback Ollama, no reusable credentials
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name e39g-public-ollama --cpus 4 --memory 10g --memory-swap 10g \
            --pids-limit 128 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$IMAGE"
          docker inspect e39g-public-ollama > "$RUNNER_TEMP/e39g-container.json"
          python3 - "$RUNNER_TEMP/e39g-container.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))[0]['HostConfig']
          assert x['NanoCpus']==4000000000 and x['Memory']==10737418240
          assert x['ReadonlyRootfs'] and x['PidsLimit']==128
          assert 'ALL' in x['CapDrop'] and 'no-new-privileges' in x['SecurityOpt']
          assert x['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          print('E39G_MODEL_RESOURCE_BOUND_LOOPBACK_ONLY')
          PY
      - name: Download licensed, exact model and pin full runtime digest
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 900s docker exec e39g-public-ollama ollama pull "$MODEL"
          docker exec e39g-public-ollama ollama show "$MODEL" --license > "$RUNNER_TEMP/e39g-model-license"
          grep -Fq 'Apache License' "$RUNNER_TEMP/e39g-model-license"
          grep -Fq 'Version 2.0' "$RUNNER_TEMP/e39g-model-license"
          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=30) as r:
              meta=json.load(r)
          matches=[x for x in meta.get('models',[]) if x.get('name')==os.environ['MODEL']]
          assert len(matches)==1
          entry=matches[0]
          digest=entry['digest'].removeprefix('sha256:')
          if digest != os.environ['MODEL_SHA256']:
              raise ValueError('E39G_FULL_MODEL_SHA256_MISMATCH')
          assert 4000000000 <= entry['size'] <= 5300000000
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PINNED_MODEL_SHA256='+os.environ['MODEL_SHA256']+'\n')
          print("E39G_GENUINE_QWEN7B_FULL_DIGEST_PINNED")
          PY
      - name: Make four actual model calls, no private references or evaluator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 1450s \
            python3 received/runner/e39g_heldout_local_model.py \
              "$RUNNER_TEMP/e39g-known-public.zip" "$RUNNER_TEMP/e39g-model-receipt.json" \
              --model "$MODEL" --model-sha256 "$PINNED_MODEL_SHA256"
          test -s "$RUNNER_TEMP/e39g-model-receipt.json"
          mkdir -p returned
          cp "$RUNNER_TEMP/e39g-model-receipt.json" returned/model-receipt.json
          echo "E39G_FOUR_PUBLIC_ACTUAL_QWEN7B_GENERATIONS_COMPLETE"
      - name: Tear down model and disposable volume
        if: always()
        shell: bash
        run: docker rm -fv e39g-public-ollama || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: e39g-four-real-public-model-answers-untrusted
          path: returned/model-receipt.json
          if-no-files-found: error
          retention-days: 5

  separate-static-admission-NO-PATCH-EXECUTION:
    needs: [public-broken-only-packet, genuine-model-four-public-controls-NO-CHECKOUT]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: e39g-public-broken-only-model-package, path: returned-public/}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: e39g-four-real-public-model-answers-untrusted, path: returned-model/}
      - name: Independently re-derive public inputs and classify every genuine raw answer
        shell: bash
        run: |
          set -euo pipefail
          python tools/enterprise/e3_factory/e39g_public_model_smoke.py pack
          cmp returned-public/model.zip target/e3-factory/e39g-public-smoke/model.zip
          cp returned-model/model-receipt.json target/e3-factory/e39g-public-smoke/model-receipt.json
          python tools/enterprise/e3_factory/e39g_public_model_smoke.py score
          echo "E39G_PUBLIC_MODEL_ACTUAL_STATIC_ONLY_NO_HELDOUT_NO_BROWSER_CREDIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39g-public-four-cases-untrusted-static-admission-score
          path: target/e3-factory/e39g-public-smoke/public-score.json
          if-no-files-found: error
          retention-days: 5

