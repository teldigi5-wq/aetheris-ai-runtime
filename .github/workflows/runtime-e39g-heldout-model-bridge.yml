name: E3.9G model-only held-out curator bridge contract
on:
  pull_request:
    branches: [test/e39g12b4n-safe-focus-alternatives-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g_heldout_local_model.py'
      - 'tools/enterprise/e3_factory/test_e39g_heldout_local_model.py'
      - '.github/workflows/runtime-e39g-heldout-model-bridge.yml'
      - 'docs/runtime/e39g-heldout-model-bridge-20261106.md'
permissions:
  contents: read
jobs:
  cross-platform-offline-interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Real B4G and B4H contracts, mock-model local transport
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g_heldout_local_model.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4g_curator_boundary.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4h_proposal_admission.py' -v
          python -m py_compile tools/enterprise/e3_factory/e39g_heldout_local_model.py
      - name: Existing governed skills remain deny-only
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
