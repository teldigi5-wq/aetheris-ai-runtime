name: Runtime Stage 45.4 Durable STOP and Replay Ledger

on:
  pull_request:
    branches:
      - security/stage45-worker-coordinator-lab-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/DurableSandboxAdmissionLab.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxJobReservationEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxJobReservationRepository.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxWorkerFenceEntity.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxWorkerFenceRepository.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/DurableSandboxAdmissionLabJpaTest.java'
      - 'docs/security/stage45-durable-worker-ledger.md'
      - '.github/workflows/runtime-stage45-durable-worker-ledger.yml'

permissions:
  contents: read

jobs:
  durable-lab-jpa-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify JPA ledger restart, replay, STOP, owner isolation
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=DurableSandboxAdmissionLabJpaTest,SandboxWorkerLabCoordinatorTest,SignedSandboxJobGateTest test

  postgres-durable-ledger-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-stage45-only
          POSTGRES_DB: aetheris_sandbox_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_sandbox_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Exercise actual synthetic PostgreSQL 16 JPA admission and row locks
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_sandbox_lab
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: synthetic-stage45-only
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dtest=DurableSandboxAdmissionLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run all orchestrator Java tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
