name: AI Runtime Lock Regeneration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-ai-runtime-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
      - name: Regenerate quant hash lock
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=aetheris-quant/requirements.lock.txt \
            aetheris-quant/requirements.in
      - name: Set up Java 21.0.12
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Regenerate AI-runtime Maven dependency trees
        run: |
          mkdir -p build-evidence/maven
          for module in orchestrator-service workstation-agent; do
            ./mvnw -f "$module/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
              -Dscope=runtime \
              -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/$module.txt"
          done
      - name: Verify and hash AI-runtime evidence
        run: python scripts/check_dependency_lockdown.py --scope ai-runtime --write-hashes
      - name: Commit regenerated AI-runtime evidence
        run: |
          git config user.name "aetheris-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aetheris-quant/requirements.lock.txt \
            build-evidence/maven/orchestrator-service.txt \
            build-evidence/maven/workstation-agent.txt \
            build-evidence/ai-runtime-dependency-lock-sha256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate AI-runtime dependency evidence"
          git push
