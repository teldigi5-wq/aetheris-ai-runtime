name: Enterprise E3.9G-4 Candidate Signature Skill Preflight

on:
  pull_request:
    branches:
      - feature/enterprise-e39g3-task-bound-java-skill-advice-20261020
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/skills/**'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/skills/**'
      - 'orchestrator-service/src/main/resources/enterprise/skill-advice-bindings-v1.json'
      - 'tools/enterprise/**'
      - 'skills/**'
      - '.github/workflows/runtime-enterprise-e39g4-signed-candidate-preflight.yml'
      - 'docs/runtime/enterprise-e39g4-signed-candidate-skill-preflight.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-crypto-negative-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Real JDK Ed25519 candidate skill signature tests
        run: ./mvnw -B -ntp -f orchestrator-service/pom.xml '-Dtest=CandidateSkillProofPreflightTest,GovernedSkillAdviceServiceTest' test

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  policy-provenance-and-model-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m unittest discover -s tools/enterprise -p 'test_e39g3_java_skill_manifest.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39f_forensics.py' -v

  original-real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Site from existing read-only network-none worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Independent original website real Chromium QA
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
          node tools/enterprise/e3_factory/browser_qa.mjs

  no-owner-auth-no-lease-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Static denial gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/skills/CandidateSkillProofPreflight.java").read_text()
          assert "Signature.getInstance(\"Ed25519\")" in code
          assert "pinnedCandidateKey" in code and "canonicalBytes(proof)" in code
          assert "getActiveAgentId()" in code and "tasks.getRequired" in code
          assert "MAX_SECONDS = 300" in code
          assert "E39G4_NONCE_REPLAY_INSTANCE_DENIED" in code
          assert "boolean actualOwnerAuthenticated" in code
          assert "boolean durableReplayCertified" in code
          assert "@RestController" not in code and "@Service" not in code
          assert "KeyPairGenerator" not in code
          for bad in ("ProcessBuilder(", "Runtime.getRuntime()", "System.exit(", "RestTemplate", "HttpClient"):
              assert bad not in code,bad
          print("E39G4_CANDIDATE_KEY_NOT_HUMAN; NO_PRODUCTION_LEASE; ZERO_TOOL_EXECUTION")
          PY
