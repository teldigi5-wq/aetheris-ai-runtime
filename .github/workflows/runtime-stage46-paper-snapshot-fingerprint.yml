name: Runtime Stage 46.34 Paper Recovery Snapshot Fingerprint

on:
  pull_request:
    branches:
      - feature/stage46-supervised-paper-recovery-review-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperRecoverySnapshotFingerprintService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/trading/PaperRecoverySnapshotFingerprintIntegrationTest.java'
      - 'docs/runtime/stage46-paper-recovery-snapshot-fingerprint.md'
      - '.github/workflows/runtime-stage46-paper-snapshot-fingerprint.yml'

permissions:
  contents: read

jobs:
  real-jpa-snapshot-and-stale-reference-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Real persisted paper portfolio snapshot, stale reference, read-only safety
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperRecoverySnapshotFingerprintIntegrationTest test
      - name: Previous actual paper recovery, independent checkpoint and replay evidence
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=PaperRecoveryReviewIntegrationTest,OfflinePaperRollbackCheckpointIntegrationTest,OfflinePaperReplayLedgerIntegrationTest test

  complete-orchestrator-workstation-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Entire existing Java orchestrator suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Entire existing workstation-agent suite
        run: ./mvnw -B -f workstation-agent/pom.xml test

  python-quant-reference-and-nonexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Independent rollback and offline paper state tests
        run: |
          python3 -m unittest discover -s aetheris-quant/tests -p test_offline_replay_checkpoint.py -v
          python3 -m unittest discover -s aetheris-quant/tests -p test_offline_paper_state_boundary.py -v
      - name: Existing Quant paper-risk and live Binance endpoint denial
        run: |
          python3 -m unittest discover -s aetheris-quant/tests -p test_paper_risk_cross_language_contract.py -v
          python3 -m unittest discover -s aetheris-quant/tests -p test_execution_boundary.py -v
      - name: New snapshot provides no order/restore authority or network route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/PaperRecoverySnapshotFingerprintService.java").read_text()
          assert '@Transactional(readOnly = true, isolation = Isolation.SERIALIZABLE)' in source
          assert '"NO_GO"' in source
          assert 'ownerAuthorized' in source and 'drawdownReset' in source
          for forbidden in ('@PostMapping','@DeleteMapping','@PutMapping','@PatchMapping',
                  'saveAndFlush(', 'deleteById(', 'resetCircuit(', 'marketOrder(',
                  'placeOrder(', 'HttpClient','ProcessBuilder','Runtime.getRuntime',
                  'BinanceTestnetClient'):
              assert forbidden not in source,forbidden
          print("STAGE46_34_SNAPSHOT_REVIEW_NO_ACCOUNT_MUTATION_OR_BROKER")
          PY

  hosted-windows-inert-containment-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Build fixed non-network synthetic worker only
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_34_INERT_WINDOWS_BUILD_FAILED' }
      - name: Existing native Windows restricted token, Job Object and AppContainer checks
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_34_REDUCED_TOKEN_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_34_JOB_OBJECT_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_34_APPCONTAINER_FAILED' }

  unchanged-13-stage45-release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Immutable release NO_GO and all thirteen blockers
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-34-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-34-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          assert p["decision"]=="NO_GO" and len(p["release_blockers"])==13
          for key in ("production_pilot_authorized","protected_branch_merge_permitted",
                      "agent_command_execution_authorized","desktop_actions_authorized",
                      "windows_device_certified","voice_microphone_certified","deploy_permitted"):
              assert p[key] is False,key
          print("STAGE46_34_THIRTEEN_RELEASE_BLOCKERS_OWNER_PC_PRODUCTION_NO_GO")
          PY
