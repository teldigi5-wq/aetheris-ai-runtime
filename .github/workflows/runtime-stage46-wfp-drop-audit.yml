name: Runtime Stage 46.17 WFP Read-only Drop Audit and Signed Worker Spec

on:
  pull_request:
    branches:
      - feature/stage46-wfp-readonly-and-release-provenance-20261015
      - main
    paths:
      - 'workstation-agent/packaging/stage46/WindowsSyntheticWfpDropAuditReadOnly.cpp'
      - 'workstation-agent/packaging/stage46/Test-SyntraWfpDropAuditReadOnly.ps1'
      - 'tools/security/stage46_wfp_drop_audit_gate.py'
      - 'tools/security/test_stage46_wfp_drop_audit_gate.py'
      - 'docs/runtime/stage46-trusted-signed-worker-release-spec.json'
      - 'docs/runtime/stage46-wfp-drop-audit-release-spec.md'
      - '.github/workflows/runtime-stage46-wfp-drop-audit.yml'

permissions:
  contents: read

jobs:
  windows-readonly-wfp-drop-audit-and-release-spec:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Repeat native AppContainer positive control and unsigned-worker evidence
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_15_POSITIVE_CONTROL_REGRESSION' }
      - name: Preserve Windows WFP ALE v4/v6 metadata proof
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsWfpReadOnly.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_16_WFP_LAYER_REGRESSION' }
      - name: Audit bounded read-only historical drop snapshot and release checklist
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWfpDropAuditReadOnly.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_17_DROP_EVIDENCE_OR_TRUST_SPEC_FAILED' }
      - name: Adversarial audit and signing-spec tests on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tools/security -p test_stage46_wfp_drop_audit_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_17_SECURITY_POLICY_TEST_FAILURE' }

  existing-windows-job-object-and-privilege-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile inert Java child
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_17_JAVA_PROBE_COMPILE_FAILURE' }
      - name: Repeat Windows reduced token and Job Object checks
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_13_REDUCED_TOKEN_REGRESSION' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_JOB_OBJECT_REGRESSION' }

  linux-synthetic-voice-and-security-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Existing synthetic voice/STOP, owner-bound and subprocess tests
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Adversarial older and new WFP/release-signature tests
        run: |
          python3 -m unittest discover -s tools/security -p test_stage46_worker_trust_evidence.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_provenance_gate.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_drop_audit_gate.py -v

  unchanged-thirteen-production-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Keep Stage 45 release and owner-PC pilot NO_GO
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-17-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-17-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as file: status=json.load(file)
          assert status["decision"]=="NO_GO" and len(status["release_blockers"])==13
          assert status["production_pilot_authorized"] is False
          assert status["agent_command_execution_authorized"] is False
          assert status["desktop_actions_authorized"] is False
          print("STAGE46_17_PHYSICAL_OWNER_PC_AND_PRODUCTION_NO_GO")
          PY

  complete-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full Java orchestrator
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation agent
        run: ./mvnw -B -f workstation-agent/pom.xml test

  no-wfp-mutation-no-device-static-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce read-only WFP, no PII emission, unapproved release and no device
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("workstation-agent/packaging/stage46")
          c=(p/"WindowsSyntheticWfpDropAuditReadOnly.cpp").read_text()
          policy=Path("tools/security/stage46_wfp_drop_audit_gate.py").read_text()
          spec=json.loads(Path("docs/runtime/stage46-trusted-signed-worker-release-spec.json").read_text())
          required=("FwpmNetEventCreateEnumHandle0", "FwpmNetEventEnum0",
                    "FwpmNetEventDestroyEnumHandle0", "FWPM_CONDITION_NET_EVENT_TYPE",
                    "FWPM_NET_EVENT_TYPE_CLASSIFY_DROP", "kMaxSnapshotEvents = 16",
                    "STAGE46_17_WFP_PROCESS_CORRELATION_NOT_VERIFIED")
          assert all(x in c for x in required), "READ_ONLY_DROP_SNAPSHOT_GUARD_MISSING"
          forbidden=("FwpmEngineSetOption", "FwpmFilterAdd", "FwpmFilterDelete",
                     "FwpmProviderAdd", "FwpmSubLayerAdd", "FwpmNetEventSubscribe",
                     "TargetDataLine", "SourceDataLine", "SyntraLoopbackModelClient")
          assert not any(x in c for x in forbidden), "MUTATING_WFP_OR_DEVICE_PROHIBITED"
          assert "app_specific_drop_verified" in policy
          assert "NO_GO" in policy
          assert spec["release_decision"] == "NO_GO"
          assert spec["candidate_worker"]["approved_code_signing_leaf_certificate_sha256"] is None
          assert spec["enforcement_scope"]["real_microphone_enabled"] is False
          print("STAGE46_17_BOUNDED_WFP_UNCORRELATED_UNSIGNED_NO_DEVICE")
          PY
