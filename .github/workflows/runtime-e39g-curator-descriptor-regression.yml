name: E3.9G B4G curator descriptor and B4H receipt regressions
on:
  pull_request:
    branches: [test/e39g12b4n-safe-focus-alternatives-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4g_curator_boundary.py'
      - 'tools/enterprise/e3_factory/test_e39g12b4g_curator_boundary.py'
      - 'tools/enterprise/e3_factory/e39g12b4h_proposal_admission.py'
      - 'tools/enterprise/e3_factory/test_e39g12b4h_proposal_admission.py'
      - '.github/workflows/runtime-e39g-curator-descriptor-regression.yml'
permissions:
  contents: read
jobs:
  curator-offline-file-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Run synthetic B4G/B4H private-boundary safety checks only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/enterprise/e3_factory/e39g12b4g_curator_boundary.py
          python -m py_compile tools/enterprise/e3_factory/e39g12b4h_proposal_admission.py
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4g_curator_boundary.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4h_proposal_admission.py' -v
          echo 'E39G_CURATOR_DESCRIPTOR_BOUNDARY_OFFLINE_ONLY_NO_HELDOUT_NO_MODEL'
