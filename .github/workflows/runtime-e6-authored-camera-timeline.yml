name: Enterprise E6 Authored Cinematic Camera Timeline Proof
on:
  pull_request:
    branches:
      - feat/e6-browser-visual-parity-20261030
    paths:
      - '.github/workflows/runtime-e6-authored-camera-timeline.yml'
      - 'tools/enterprise/e6_studio/next-studio/**'
      - 'docs/runtime/E6_AUTHORED_CAMERA_TIMELINE_20261030.md'
permissions:
  contents: read
concurrency:
  group: e6-camera-authoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deterministic-timeline-and-actual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: SHA-pinned read-only checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fixed Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Fixed Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prior local E6 safety controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s tools/enterprise/e6_studio -p 'test_next_studio_policy.py' -v
          python3 -m unittest discover -s tools/enterprise/e6_studio -p 'test_e6_visual_pixel_policy.py' -v
          node --check tools/enterprise/e6_studio/next-studio/browser_timeline_proof.mjs
      - name: Locked install, TS compile and static research app build
        shell: bash
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          python3 scripts/validate_dependency_lock.py
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/build_research_glb.py
          npm run typecheck
          npm run build
          test -f out/index.html
          test -f out/research-panel.glb
          ./node_modules/.bin/tsc --strict --skipLibCheck --target ES2022 --module commonjs --moduleResolution node --outDir "$GITHUB_WORKSPACE/target/e6-studio/camera-compiled" components/cameraTimeline.ts
      - name: Exact compiled TS pure keyframe sampler regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/next-studio/test_camera_timeline.mjs
      - name: Fixed Playwright Chromium with Ubuntu dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/enterprise/e6_studio --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e6_studio/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify existing R3F controls and new three-shot forward/reverse timeline
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e6_studio/next-studio/browser_proof.mjs
          node tools/enterprise/e6_studio/next-studio/browser_timeline_proof.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('target/e6-studio/timeline-evidence/report.json')
          r=json.loads(p.read_text())
          assert r['kind']=='E6_AUTHORED_SCROLL_CAMERA_RESEARCH'
          assert r['rendering']=='CHROMIUM_SWIFTSHADER_SOFTWARE'
          assert r['ownerGpuVerified'] is False
          assert r['hardwareFpsVerified'] is False
          assert r['independentVisualApproval'] is False
          assert r['protectedMainMerged'] is False
          assert r['productionDeployed'] is False
          assert r['stage45Go'] is False
          assert r['failures']==[]
          assert len(r['cases'])==3
          assert all(x['threeActs'] and x['reversible'] for x in r['cases'][:2])
          assert r['cases'][2]['staticOnly'] and r['cases'][2]['noWebglCanvas']
          assert len(list(p.parent.glob('*.png')))==12
          assert all(x['screenshots']==6 and x['fullViewportCompositionCaptured'] is True for x in r['cases'][:2])
          print('E6_HUMAN_AUTHORED_CAMERA_THREE_ACTS_BROWSER_ONLY_PASS')
          PY
      - name: Retain research-only camera evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e6-authored-timeline-research-not-release
          path: |
            target/e6-studio/timeline-evidence/
            target/e6-studio/next-r3f-evidence/
          if-no-files-found: warn
          retention-days: 7
