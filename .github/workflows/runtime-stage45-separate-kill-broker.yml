name: Runtime Stage 45.5.12 Separate Fixed-Target Kill Broker Lab

on:
  pull_request:
    branches:
      - security/stage45-host-watchdog-restart-fence-20261014
      - main
    paths:
      - 'tests/sandbox/stage45_kill_broker_protocol.go'
      - 'tests/sandbox/stage45_kill_broker_protocol_test.go'
      - 'tests/sandbox/stage45_fixed_kill_broker.go'
      - 'tests/sandbox/stage45_unprivileged_watch_verifier.go'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SyntheticSeparatedKillBrokerIT.java'
      - 'docs/security/stage45-separate-kill-broker.md'
      - '.github/workflows/runtime-stage45-separate-kill-broker.yml'

permissions:
  contents: read

jobs:
  fixed-broker-authentication-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test narrow signed IPC protocol and persistent high-water journal
        run: |
          go test -v tests/sandbox/stage45_kill_broker_protocol.go \
            tests/sandbox/stage45_host_watch_state.go \
            tests/sandbox/stage45_kill_broker_protocol_test.go \
            tests/sandbox/stage45_host_watch_state_test.go
      - name: Verify existing issuer STOP and host policy
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntheticSupervisorPulseLabJpaTest,SyntheticHostStopFenceLabJpaTest test

  separated-linux-uid-broker-postgresql-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stage45-split-broker-synthetic
          POSTGRES_DB: aetheris_stage45_broker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheris_stage45_broker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      AETHERIS_STAGE45_BROKER_CI: 'true'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Ensure fixed hosted-runner Linux and Docker
        run: |
          go version
          docker info --format '{{.ServerVersion}}'
          id nobody
          sudo -n true
      - name: Build separate narrowly scoped verifier and broker
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-unprivileged-verifier" \
            tests/sandbox/stage45_unprivileged_watch_verifier.go \
            tests/sandbox/stage45_kill_broker_protocol.go \
            tests/sandbox/stage45_host_watch_state.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/stage45-kill-broker" \
            tests/sandbox/stage45_fixed_kill_broker.go \
            tests/sandbox/stage45_kill_broker_protocol.go
          chmod 755 "$RUNNER_TEMP/stage45-unprivileged-verifier" "$RUNNER_TEMP/stage45-kill-broker"
      - name: Pull pinned synthetic OCI image outside isolated workload
        run: docker pull ghcr.io/containerd/busybox@sha256:907ca53d7e2947e849b839b1cd258c98fd3916c60f2e6e70c30edbf741ab6754
      - name: Test separate UID verifier, authenticated local broker and fixed STOP on PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/aetheris_stage45_broker_ci
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: stage45-split-broker-synthetic
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dspring.datasource.url="$SPRING_DATASOURCE_URL" \
            -Dspring.datasource.driver-class-name="$SPRING_DATASOURCE_DRIVER_CLASS_NAME" \
            -Dspring.datasource.username="$SPRING_DATASOURCE_USERNAME" \
            -Dspring.datasource.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Daetheris.stage45.verifier.bin="$RUNNER_TEMP/stage45-unprivileged-verifier" \
            -Daetheris.stage45.broker.bin="$RUNNER_TEMP/stage45-kill-broker" \
            -Dtest=SyntheticSeparatedKillBrokerIT,SyntheticSupervisorPulseLabJpaTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full Java regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
