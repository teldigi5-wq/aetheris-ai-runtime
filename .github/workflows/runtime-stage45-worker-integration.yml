name: Runtime Stage 45.3 Synthetic Worker Integration Verification

on:
  pull_request:
    branches:
      - security/stage45-signed-worker-stop-lab-20261014
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SandboxWorkerLabCoordinator.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/execution/SignedSandboxJobGate.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SandboxWorkerLabCoordinatorTest.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/execution/SignedSandboxJobGateTest.java'
      - 'docs/security/stage45-worker-integration-lab.md'
      - '.github/workflows/runtime-stage45-worker-integration.yml'

permissions:
  contents: read

jobs:
  authenticated-lab-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify fake backend authorization, cancellation and emergency STOP
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SandboxWorkerLabCoordinatorTest,SignedSandboxJobGateTest,IsolatedOciProbePlanTest,WorkspaceContainmentHardeningTest test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Run complete Java test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
