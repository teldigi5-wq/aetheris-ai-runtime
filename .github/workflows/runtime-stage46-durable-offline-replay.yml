name: Runtime Stage 46.31 Durable Offline Paper Replay Ledger

on:
  pull_request:
    branches:
      - feature/stage46-offline-risk-state-reconciliation-20261016
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/OfflinePaperReplayAnchor*.java'
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/trading/OfflinePaperReplayLedgerService.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/trading/OfflinePaperReplayLedgerIntegrationTest.java'
      - 'docs/runtime/stage46-durable-offline-replay-ledger.md'
      - '.github/workflows/runtime-stage46-durable-offline-replay.yml'

permissions:
  contents: read

jobs:
  real-jpa-durable-ledger-and-concurrent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Real JPA committed replay anchor, fresh service and concurrent conflicts
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=OfflinePaperReplayLedgerIntegrationTest test
      - name: Retain existing exact Java/Python HMAC wire compatibility
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=OfflinePaperStateReconciliationTest,PaperCrossLanguageRiskContractTest test

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: All Java orchestrator and integration tests
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: All Java workstation-agent tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  python-offline-auth-risk-and-testnet-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preserve Python HMAC and in-memory verification test vectors
        run: python3 -m unittest discover -s aetheris-quant/tests -p test_offline_paper_state_boundary.py -v
      - name: Preserve Python paper-risk reference and live Binance denial
        run: |
          python3 -m unittest discover -s aetheris-quant/tests -p test_paper_risk_cross_language_contract.py -v
          python3 -m unittest discover -s aetheris-quant/tests -p test_execution_boundary.py -v
      - name: New durable anchor does not connect to finance/exchange endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("orchestrator-service/src/main/java/io/aetheris/orchestrator/trading")
          files=[base/p for p in (
             "OfflinePaperReplayLedgerService.java","OfflinePaperReplayAnchorEntity.java",
             "OfflinePaperReplayAnchorRepository.java")]
          source="\n".join(p.read_text() for p in files)
          assert "PROPAGATION_REQUIRES_NEW" in source
          assert "PESSIMISTIC_WRITE" in source and "@Version" in source
          assert "MessageDigest.isEqual" in source and "saveAndFlush" in source
          assert "snapshotApplied" in source and "pythonTestnetOrderAuthorized" in source
          for bad in ("@PostMapping","@PutMapping","@DeleteMapping",
                      "BinanceTestnetClient","marketOrder(","placeOrder(",
                      "HttpClient","RestTemplate","WebClient","ProcessBuilder",
                      "Runtime.getRuntime","resetLedger("):
              assert bad not in source,bad
          print("STAGE46_31_OFFLINE_DURABLE_LEDGER_NO_EXCHANGE_NO_ACCOUNT_IMPORT")
          PY

  hosted-windows-contained-worker-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Only independent synthetic worker compile
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f synthetic-worker-lab/pom.xml -DskipTests clean package
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_31_WORKER_COMPILE_FAILED' }
      - name: Real Windows reduced-token Job Object and AppContainer checks
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_31_REDUCED_TOKEN_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./synthetic-worker-lab/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_31_JOB_OBJECT_FAILURE' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_31_APPCONTAINER_FAILURE' }

  stage45-immutable-13-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Thirteen existing security release blockers stay active
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-31-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-31-no-go.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r["decision"]=="NO_GO" and len(r["release_blockers"])==13
          for flag in ("production_pilot_authorized","protected_branch_merge_permitted",
                       "agent_command_execution_authorized","desktop_actions_authorized",
                       "windows_device_certified","voice_microphone_certified",
                       "deploy_permitted"):
              assert r[flag] is False,flag
          print("STAGE46_31_THIRTEEN_RELEASE_BLOCKERS_OWNER_PC_AND_PRODUCTION_NO_GO")
          PY
