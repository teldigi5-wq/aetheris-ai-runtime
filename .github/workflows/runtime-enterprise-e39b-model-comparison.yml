name: Enterprise E3.9B Genuine Hermes vs Granite Keyboard Accessibility Benchmark

on:
  pull_request:
    branches:
      - feature/enterprise-e39a-keyboard-accessibility-gate-20261020
      - main
    paths:
      - 'tools/enterprise/e3_factory/**'
      - '.github/workflows/runtime-enterprise-e39b-model-comparison.yml'
      - 'docs/runtime/enterprise-e39b-model-comparison.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-untrusted-model-text:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse bad model IDs, owner authority and malicious untrusted CSS
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39b_model_comparison.py' -v
      - name: Preserve independent E3.9A keyboard policy and E3.8C schema tests
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39_keyboard_patch_gate.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e38c_structured_inference.py' -v
      - name: Validate browser scripts
        run: node --check tools/enterprise/e3_factory/e39_keyboard_browser.mjs

  genuine-local-model-keyboard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hermes3-3b
            tag: 'hermes3:3b'
          - label: granite4-3b
            tag: 'granite4:3b'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AETHERIS_E39B_REAL_MODEL_CI_OPT_IN: 'yes'
      MODEL_IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build canonical website in fixed network-none worker
        run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh build
      - name: Verify generated website source before defect seed
        run: python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
      - name: Install Playwright Chromium on disposable CI runner, not model
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Prove focused skip link is actually offscreen in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python tools/enterprise/e3_factory/e39_keyboard_evaluator.py seed
          set +e
          node tools/enterprise/e3_factory/e39_keyboard_browser.mjs before
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'E39B_EXPECTED_INDEPENDENT_BROWSER_FAILURE_MISSING'
            exit 1
          fi
          python tools/enterprise/e3_factory/e39_keyboard_evaluator.py before
      - name: Start pinned and limited CPU Ollama service with temporary weights
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MODEL_IMAGE"
          docker run -d --name e39b-model --cpus 2 \
            --memory 5g --memory-swap 5g --pids-limit 128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$MODEL_IMAGE"
          docker inspect e39b-model > "$RUNNER_TEMP/e39b-model-inspect.json"
          python3 - "$RUNNER_TEMP/e39b-model-inspect.json" <<'PY'
          import json,sys
          from pathlib import Path
          config=json.loads(Path(sys.argv[1]).read_text())[0]['HostConfig']
          assert config['NanoCpus']==2000000000
          assert config['Memory']==5368709120 and config['MemorySwap']==5368709120
          assert config['PidsLimit']==128 and config['ReadonlyRootfs'] is True
          assert 'ALL' in config['CapDrop'] and 'no-new-privileges' in config['SecurityOpt']
          assert config['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          print('E39B_MODEL_DOCKER_CPU_MEMORY_LOOPBACK_POLICY_VERIFIED')
          PY
      - name: Pull EXACT Ollama model tag only on disposable CI service
        shell: bash
        env:
          MODEL_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 420s \
            docker exec e39b-model ollama pull "$MODEL_TAG"
          docker exec e39b-model ollama list
      - name: Genuine model inference, separate network-none patch policy, real browser
        shell: bash
        env:
          MODEL_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 155s \
            python tools/enterprise/e3_factory/e39b_real_model_adviser.py --model "$MODEL_TAG"
          classification="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('target/e3-factory/e39/real-model-response.json').read_text())
          assert data['realModelCalls']==1 and data['selfReportedGeneratedTokens']>0
          assert data['ownerApproved'] is False and data['productionPublished'] is False
          assert data['fixtureGoldenPatchConsulted'] is False
          print(data['responseClass'])
          PY
          )"
          outcome=POLICY_REJECTED
          if [[ "$classification" == "ABSTAIN" ]]; then
            outcome=ABSTAIN
          elif [[ "$classification" == "INVALID_MODEL_RESPONSE" ]]; then
            outcome=INVALID
          elif [[ "$classification" == "TEXT_REPLACEMENT_PROPOSED" ]]; then
            if bash tools/enterprise/e3_factory/run_locked_worker.sh e39b-apply; then
              outcome=POLICY_ACCEPTED
              set +e
              node tools/enterprise/e3_factory/e39_keyboard_browser.mjs after
              after_rc=$?
              set -e
              echo "E39B_BROWSER_AFTER_RETURN=$after_rc MODEL=$MODEL_TAG"
            fi
          else
            echo "E39B_UNEXPECTED_MODEL_OUTPUT_CLASS"
            exit 2
          fi
          python tools/enterprise/e3_factory/e39b_score.py "$outcome"
          if [[ "$outcome" == "POLICY_ACCEPTED" ]]; then
            node tools/enterprise/e3_factory/browser_qa.mjs
            python -m unittest discover -s tools/enterprise/e3_factory -p 'test_worker.py' -v
          fi
      - name: Capture actual runtime snapshot and model evidence context
        if: always()
        shell: bash
        run: |
          mkdir -p target/e3-factory/e39
          docker stats --no-stream --format '{{json .}}' e39b-model \
            > target/e3-factory/e39/model-resource-snapshot.jsonl || true
          docker image inspect "$MODEL_IMAGE" --format '{{json .RepoDigests}}' \
            > target/e3-factory/e39/ollama-image-digests.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('target/e3-factory/e39')
          model=folder/'real-model-response.json'
          if model.is_file():
              doc=json.loads(model.read_text())
              print('E39B_REAL_MODEL_INFERENCE_EVIDENCE',doc['model']['tag'],
                    'tokens',doc['selfReportedGeneratedTokens'],'ms',doc['wallMs'])
          print('E39B_RESOURCE_SNAPSHOT_NOT_PEAK_RAM')
          PY
      - name: Delete temporary model service and weights volume
        if: always()
        run: docker rm -fv e39b-model || true
      - name: Attach real model, keyboard Chrome, policy and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e39b-${{ matrix.label }}-real-keyboard-model-evidence
          path: |
            target/e3-factory/e39/
            target/e3-factory/sandbox-e39b-apply.json
            target/e3-factory/browser-evidence/
          retention-days: 14
          if-no-files-found: warn

  full-java-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test

  explicit-no-owner-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: No model shell, secret, owner token, paid endpoint or Stage45 release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          adviser=Path('tools/enterprise/e3_factory/e39b_real_model_adviser.py').read_text()
          policy=Path('tools/enterprise/e3_factory/e39b_model_patch_gate.py').read_text()
          worker=Path('tools/enterprise/e3_factory/run_locked_worker.sh').read_text()
          scorer=Path('tools/enterprise/e3_factory/e39b_score.py').read_text()
          assert 'AETHERIS_E39B_REAL_MODEL_CI_OPT_IN' in adviser
          assert 'E39B_ACTUAL_MODEL_INFERENCE' in adviser
          assert 'e39_keyboard_evaluator' not in adviser
          assert 'e39_keyboard_patch_gate' not in adviser
          assert 'canonical.validate(proposal' not in policy
          assert 'gate.validate(proposal' in policy
          assert 'e39b-apply)' in worker and '--network none' in worker
          assert 'chromiumVerifiedModelRepair' in scorer
          for dangerous in ('subprocess','os.system','Popen(','import requests',
                            'openrouter.ai','eval(','exec('):
              assert dangerous not in adviser,dangerous
          assert not Path('tools/security/stage45_pre_pilot_gate.py').exists()
          print('E39B_HERMES_AND_GRANITE_TEXT_ONLY_NO_OWNER_PC_NO_STAGE45')
          PY
