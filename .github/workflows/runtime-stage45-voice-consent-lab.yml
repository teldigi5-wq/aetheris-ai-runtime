name: Runtime Stage 45.5.18 Voice Consent Preview Lab

on:
  pull_request:
    branches:
      - security/stage45-windows-offline-preflight-20261015
      - main
    paths:
      - 'orchestrator-service/src/main/java/io/aetheris/orchestrator/voice/SyntheticVoiceOwnerConsentLab.java'
      - 'orchestrator-service/src/test/java/io/aetheris/orchestrator/voice/SyntheticVoiceOwnerConsentLabTest.java'
      - 'docs/security/stage45-voice-owner-consent-lab.md'
      - '.github/workflows/runtime-stage45-voice-consent-lab.yml'

permissions:
  contents: read

jobs:
  deterministic-voice-owner-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Verify synthetic wake, STOP and signed owner consent
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=SyntheticVoiceOwnerConsentLabTest test

  unchanged-workstation-host-agent-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test existing workstation-agent security boundary
        run: ./mvnw -B -f workstation-agent/pom.xml test

  complete-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full Java orchestrator regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
