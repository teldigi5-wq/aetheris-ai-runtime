name: Enterprise E6 W4-A Opt-in Signal Fold WebGL - Review Only
on:
  pull_request:
    branches:
      - feat/e6-w3b-signal-fold-original-asset-20261101
    paths:
      - '.github/workflows/runtime-e6-w4a-webgl-story.yml'
      - 'tools/enterprise/e6_studio/next-studio/w4a_*'
      - 'tools/enterprise/e6_studio/next-studio/test_w4a_*'
      - 'docs/runtime/E6_W4A_SIGNAL_FOLD_WEBGL_20261101.md'
permissions:
  contents: read
jobs:
  local-scene-provenance-and-real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Read-only checkout of exact PR SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Source, static contract and generation smoke checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cd tools/enterprise/e6_studio/next-studio
          node --check w4a_signal_fold_viewer.mjs
          node --check w4a_stage_scene.mjs
          node --check w4a_browser_proof.mjs
          node --test test_experience_contract.mjs test_w2_compiler.mjs test_w2b_curated_compiler.mjs test_w2c_narrative_compiler.mjs
          python3 -m py_compile blender/w3b_author_signal_fold.py w3b_verify_signal_fold.py w3b_stage_signal_fold.py
          node w2c_generate_preview.mjs
      - name: Reviewed Blender 4.0.2 with Ubuntu system NumPy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 'blender=4.0.2+dfsg-1ubuntu8' python3-numpy
      - name: Reproduce first-party W3-A source and verified GLB
        run: |
          set -euo pipefail
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-use-system-env --python-exit-code 17 --python tools/enterprise/e6_studio/next-studio/blender/author_command_module.py
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-use-system-env --python-exit-code 17 --python tools/enterprise/e6_studio/next-studio/blender/export_no_uv_candidate.py
          python3 tools/enterprise/e6_studio/next-studio/blender/compare_glb_variants.py
          python3 tools/enterprise/e6_studio/next-studio/blender/verify_detailed_module.py
          python3 tools/enterprise/e6_studio/next-studio/w3a_stage_provenance.py
      - name: Generate actual W3-B branded GLB and preserve owner provenance gates
        run: |
          set -euo pipefail
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-use-system-env --python-exit-code 17 --python tools/enterprise/e6_studio/next-studio/blender/w3b_author_signal_fold.py
          cd tools/enterprise/e6_studio/next-studio
          python3 -m unittest -v test_w3a_asset_provenance test_w3b_signal_fold
          python3 w3b_verify_signal_fold.py
          python3 w3b_stage_signal_fold.py
          test -f target/e6-w3b-arcloom/assets/arcloom-signal-fold.glb
      - name: Locked Next.js dependencies and isolated bundler for W4-A
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          python3 scripts/validate_dependency_lock.py
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          NEXT_PUBLIC_E6_BLENDER_PREVIEW=1 npm run build
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12
          test -x node_modules/.bin/esbuild
      - name: Generate isolated real WebGL website and check no-overwrite, asset hash and fallback
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          node w4a_stage_scene.mjs
          node --test test_w4a_scene.mjs
          test -f target/e6-w4a-arcloom/studies/signal-fold/index.html
          test -f target/e6-w4a-arcloom/assets/signal-fold-scene.mjs
          if node w4a_stage_scene.mjs; then
            echo "UNSAFE: W4-A overwrote the existing preview"
            exit 1
          fi
          echo E6_W4A_ASSET_BOUND_NO_OVERWRITE_PASS
      - name: Install pinned browser harness without modifying repo lock
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real local GLB rendering and progressive fallbacks in software Chromium
        run: |
          set -euo pipefail
          cd tools/enterprise/e6_studio/next-studio
          node w3b_browser_proof.mjs
          node w4a_browser_proof.mjs
          echo E6_W4A_SWIFTSHADER_IS_NOT_OWNER_DEVICE_GPU_CERTIFICATION
      - name: Store only temporary W4-A review evidence, never production deploy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e6-w4a-webgl-story-research-not-release
          path: |
            target/e6-studio/w3b-signal-fold/
            tools/enterprise/e6_studio/next-studio/target/e6-w4a-arcloom/assets/
          retention-days: 7
          if-no-files-found: warn
