name: E3.9G-12B4N Bounded CSS Alternatives and Semantic Browser Oracle
on:
  pull_request:
    branches: [test/e39g12b4m-focus-ring-visibility-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4n_*'
      - 'tools/enterprise/e3_factory/test_e39g12b4n_*'
      - 'tools/enterprise/e3_factory/run_locked_worker.sh'
      - 'docs/runtime/e39g12b4n-safe-focus-alternatives-20261025.md'
      - 'docs/runtime/roadmap-current-e3-through-e9-20261025.md'
      - 'README.md'
      - '.github/workflows/runtime-e39g12b4n-safe-focus-alternatives.yml'
permissions:
  contents: read
jobs:
  schema-and-deny-by-default:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - name: Adversarial bounded CSS, previous frozen gate and keyboard focus
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4n_safe_focus_alternatives.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4m_focus_ring_semantics.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4j_typed_control_worker.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b2_isolation_policy.py' -v
          node --check tools/enterprise/e3_factory/e39g12b4n_semantic_after_browser.mjs
          python -m py_compile tools/enterprise/e3_factory/e39g12b4n_focus_semantic_policy.py
          python -m py_compile tools/enterprise/e3_factory/e39g12b4n_seed_controls.py
      - name: Preserve existing default-off enterprise skill/agent scope
        run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
  bounded-docker-and-real-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - name: Prepare fixed developer-authored safe, unsafe and clipped probes
        run: python tools/enterprise/e3_factory/e39g12b4n_seed_controls.py seed
      - name: Apply ONLY exact bounded CSS forms in previous restricted Docker runner
        run: |
          set -euo pipefail
          docker pull python:3.12-slim-bookworm
          for case in zero six eight sixteen thirtytwo malicious; do
            bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b4n-probe "$case"
          done
      - name: Install fixed Chromium only for source-verified trusted fixture
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Independently check entire focus outline at five viewport sizes
        run: node tools/enterprise/e3_factory/e39g12b4n_semantic_after_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b4n-network-none-css-semantic-trusted-control-evidence
          path: target/e3-factory/e39g12b4n/
          if-no-files-found: warn
          retention-days: 10
