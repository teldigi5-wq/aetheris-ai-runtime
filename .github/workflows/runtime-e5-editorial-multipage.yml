name: E5 Three-Page Editorial Website - Offline Browser Acceptance
on:
  push:
    branches: [feat/e5-editorial-three-page-review-20261108]
  pull_request:
    branches: [feat/e5-six-case-intent-benchmark-20261030]
permissions:
  contents: read
jobs:
  editorial-website-browser-and-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Exact source head, inherited E5 tests, and new editorial validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e5_*.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e4_free_route_admission.py' -v
          python -m py_compile tools/enterprise/e3_factory/e5_editorial_multipage.py
          node --check tools/enterprise/e3_factory/e5_editorial_multipage_browser.mjs
      - name: Build independent themed three-page sites from synthetic input
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/enterprise/e3_factory python - <<'PY'
          import hashlib,io,json,zipfile
          from pathlib import Path
          import e5_editorial_multipage as pages
          from test_e5_editorial_multipage import BRIEF,COPY,CONTENT,LAYOUTS
          root=Path("target/e5")
          root.mkdir(parents=True,exist_ok=True)
          for name,choice in zip(("paper","charcoal"),LAYOUTS,strict=True):
              bundle,manifest=pages.build(BRIEF,COPY,choice,CONTENT)
              second,again=pages.build(BRIEF,COPY,choice,CONTENT)
              assert second==bundle and manifest==again
              folder=root/("editorial-"+name)
              folder.mkdir(exist_ok=False)
              with zipfile.ZipFile(io.BytesIO(bundle)) as z:
                  assert z.testzip() is None
                  assert all("/" not in n and ".." not in n for n in z.namelist())
                  z.extractall(folder)
              assert manifest["pagePaths"]==["index.html","work.html","contact.html"]
              assert not any(manifest[n] for n in (
                  "ownerApproved","deploymentAuthorized","productionReady",
                  "siteCodeModelAuthored","stage45Go"))
              for entry in manifest["files"]:
                  data=(folder/entry["path"]).read_bytes()
                  assert len(data)==entry["bytes"]
                  assert hashlib.sha256(data).hexdigest()==entry["sha256"]
              print("E5_EDITORIAL_3_PAGE_BUNDLE_SHA256_PASS",name,
                    hashlib.sha256(bundle).hexdigest())
          PY
      - name: Install pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Real desktop/mobile/reduced motion cross-page navigation
        shell: bash
        run: |
          set -euo pipefail
          node tools/enterprise/e3_factory/e5_editorial_multipage_browser.mjs
          echo E5_REAL_THREE_PAGE_NAVIGATION_BROWSER_ACCEPTANCE_PASS
      - name: Assert permanent research release hold
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Stage45 NO_GO' docs/runtime/E5_THREE_PAGE_EDITORIAL_PREVIEW_20261108.md
          echo E5_EDITORIAL_REVIEW_ONLY_NOT_MODEL_AUTHORED_STAGE45_NO_GO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: e5-three-page-synthetic-editorial-preview-not-approved
          path: |
            target/e5/editorial-paper/
            target/e5/editorial-charcoal/
          if-no-files-found: error
          retention-days: 7
