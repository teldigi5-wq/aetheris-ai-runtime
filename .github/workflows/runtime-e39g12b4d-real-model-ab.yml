name: E3.9G-12B4D Genuine Qwen7B Paired Source-Span Browser Benchmark
on:
  pull_request:
    branches: [feature/e39h-cinematic-proof-and-roadmap-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4d_*'
      - 'tools/enterprise/e3_factory/test_e39g12b4d_*'
      - 'docs/runtime/enterprise-e39g12b4d-paired-local-model.md'
      - '.github/workflows/runtime-e39g12b4d-real-model-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4d_paired_trial.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4a_sevenb_model.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4b_failure_localization.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b2_isolation_policy.py' -v
  public-no-gold-prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
          python tools/enterprise/e3_factory/e39g12b2_proposer_bundle.py pack
          python tools/enterprise/e3_factory/e39g12b4b_source_locator.py pack
          python tools/enterprise/e3_factory/e39g12b4d_trial_contract.py pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4d-public-no-gold-prompts
          path: target/e3-factory/e39g12b4d/model-input-prompts.zip
          if-no-files-found: error
          retention-days: 10
  real-model-NO-CHECKOUT:
    needs: public-no-gold-prompts
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      MODEL: qwen2.5-coder:7b
      IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      # Security: NO actions/checkout and no model-visible policy/gold.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4d-public-no-gold-prompts, path: received/}
      - name: Inspect no-checkout and no golden files
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json
          for x in ('.git','tools','docs','skills','orchestrator-service'):
              assert not pathlib.Path(x).exists()
          zips=list(pathlib.Path('received').rglob('*.zip'))
          assert len(zips)==1
          with zipfile.ZipFile(zips[0]) as z:
              assert z.namelist()==['prompts.json']
              p=json.loads(z.read('prompts.json'))
          assert len(p['trials'])==8 and set(p['order'])==set(p['trials'])
          assert p['containsGolden'] is False and p['containsReplacementAnswers'] is False
          assert p['ownerAuthorized'] is False
          print('B4D_NO_CHECKOUT_NO_GOLD_INPUT')
          PY
      - name: Start fixed loopback-only disposable Ollama model
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name b4d-ollama --cpus 4 --memory 10g --memory-swap 10g \
            --pids-limit 128 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$IMAGE"
          docker inspect b4d-ollama > "$RUNNER_TEMP/b4d-inspect.json"
          python3 - "$RUNNER_TEMP/b4d-inspect.json" <<'PY'
          import json,sys
          from pathlib import Path
          c=json.loads(Path(sys.argv[1]).read_text())[0]['HostConfig']
          assert c['NanoCpus']==4000000000 and c['Memory']==10737418240
          assert c['ReadonlyRootfs'] and c['PidsLimit']==128
          assert 'ALL' in c['CapDrop'] and 'no-new-privileges' in c['SecurityOpt']
          assert c['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          PY
      - name: Review model's actual Apache license and fetch reviewed tag
        run: |
          timeout --signal=TERM --kill-after=5s 900s docker exec b4d-ollama ollama pull "$MODEL"
          docker exec b4d-ollama ollama show "$MODEL" --license > "$RUNNER_TEMP/license.txt"
          grep -Fq 'Apache License' "$RUNNER_TEMP/license.txt"
          grep -Fq 'Version 2.0' "$RUNNER_TEMP/license.txt"
      - name: Exactly eight real Qwen7B generations, matched original/source-span ABBA pairs
        run: |
          timeout --signal=TERM --kill-after=6s 2550s python3 - <<'PY'
          import hashlib,json,os,time,urllib.request,zipfile
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          zips=list(Path('received').rglob('*.zip'))
          assert len(zips)==1
          with zipfile.ZipFile(zips[0]) as z:
              assert z.namelist()==['prompts.json']
              p=json.loads(z.read('prompts.json'))
          assert len(p['order'])==8 and set(p['order'])==set(p['trials'])
          assert p['containsGolden'] is False
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request('http://127.0.0.1:11434'+path,data=data,method=method,
                                         headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=310) as response:
                  return json.loads(response.read(500000))
          model=os.environ['MODEL']
          assert model=='qwen2.5-coder:7b'
          found=[x for x in call('GET','/api/tags').get('models',[]) if x.get('name')==model]
          assert len(found)==1
          details=found[0]
          digest=details['digest']
          assert digest.removeprefix('sha256:').startswith('dae161e27b0e')
          assert type(details['size']) is int and 4000000000<=details['size']<=5300000000
          trials={}
          for key in p['order']:
              item=p['trials'][key];prompt=item['prompt']
              assert sha(prompt.encode())==item['promptSha256']
              opts={'model':model,'stream':False,'format':'json','prompt':prompt,
                    'system':'Strict JSON response only. Do not run commands or tools.',
                    'keep_alive':'2m','options':{'temperature':0,'num_predict':220,
                                                'num_ctx':4096,'num_thread':4}}
              start=time.monotonic()
              r=call('POST','/api/generate',opts)
              elapsed=max(1,round((time.monotonic()-start)*1000))
              raw=r.get('response')
              assert r.get('done') is True and r.get('model')==model
              assert type(raw) is str and 0<len(raw.encode())<=1800
              assert type(r.get('eval_count')) is int and r['eval_count']>0
              trials[key]=dict(site=item['site'],fault=item['fault'],arm=item['arm'],
                sourceSha256=item['sourceSha256'],promptSha256=item['promptSha256'],
                modelTag=model,rawModelResponse=raw,rawResponseSha256=sha(raw.encode()),
                generatedTokens=r['eval_count'],elapsedWallMs=elapsed,
                promptTokensSelfReported=r.get('prompt_eval_count'))
              print('B4D_REAL_LOCAL_MODEL_ATTEMPT',key,'tokens',r['eval_count'],flush=True)
          assert len(trials)==8
          receipt=dict(
            evidenceClass='E39G12B4D_EIGHT_REAL_LOCAL_MODEL_COMPLETIONS_UNTRUSTED',
            modelTag=model,realModelCalls=8,trials=trials,
            promptBundleSha256=sha(zips[0].read_bytes()),ollamaSelfReportedDigest=digest,
            sizeBytes=details['size'],ownerApprovalGranted=False,modelSourceEdited=False,
            goldenReferenceAvailable=False,productionPublished=False,
            upstreamSignedModelAttestation=False,externallyHeldOut=False,modelTextExecuted=False)
          out=Path('model-results');out.mkdir(exist_ok=False)
          (out/'real-model-results.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('B4D_EIGHT_REAL_LOCAL_MODEL_COMPLETIONS_RECOVERABLE_RECEIPT')
          PY
      - name: Remove temporary weight volume and model process
        if: always()
        run: docker rm -fv b4d-ollama || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4d-untrusted-model-receipt
          path: model-results/real-model-results.json
          if-no-files-found: error
          retention-days: 10
  separate-network-none-policy-and-browser:
    needs: [public-no-gold-prompts, real-model-NO-CHECKOUT]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4d-public-no-gold-prompts, path: received-prompt/}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4d-untrusted-model-receipt, path: received-model/}
      - name: Independently rebuild same prompt bytes, separate evaluator/golden workspace
        run: |
          set -euo pipefail
          docker pull python:3.12-slim-bookworm
          bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b-seed
          python tools/enterprise/e3_factory/e39g12b2_proposer_bundle.py pack
          python tools/enterprise/e3_factory/e39g12b4b_source_locator.py pack
          python tools/enterprise/e3_factory/e39g12b4d_trial_contract.py pack
          cmp received-prompt/model-input-prompts.zip target/e3-factory/e39g12b4d/model-input-prompts.zip
          mkdir -p target/e3-factory/e39g12b4d/incoming
          cp received-model/real-model-results.json target/e3-factory/e39g12b4d/incoming/
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/enterprise/e3_factory')
          import e39g12b4d_trial_contract as t
          r,p=t.verify_model_receipt()
          assert len(r['trials'])==8 and set(r['trials'])==set(p['trials'])
          print('B4D_UNTRUSTED_OUTPUT_RECHECKED_BY_TRUSTED_EVALUATOR')
          PY
      - name: Install pinned real Playwright Chromium for accepted source patches only
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Same frozen typed one-literal policy, 2 viewports if accepted, score every rejected attempt
        shell: bash
        run: |
          set -euo pipefail
          for arm in original source-span; do
            python tools/enterprise/e3_factory/e39g12b4d_trial_contract.py prepare-arm "$arm"
            for token in \
              studynest--keyboard-focus-visibility studynest--responsive-mobile-overflow \
              cityline--reduced-motion cityline--safe-untrusted-text; do
              bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b4a-apply "$token"
              if python3 - "$token" <<'PY'
          import sys,json
          from pathlib import Path
          r=json.loads((Path('target/e3-factory/e39g12b4a/repairs')/sys.argv[1]/'patch.json').read_text())
          assert r['ownerApprovalGranted'] is False and r['stage45Go'] is False
          assert r['policyOutcome'] in ('POLICY_APPLIED','POLICY_REJECTED')
          sys.exit(0 if r['policyOutcome']=='POLICY_APPLIED' else 1)
          PY
              then
                node tools/enterprise/e3_factory/e39g12b4a_independent_browser.mjs "$token"
              fi
              python tools/enterprise/e3_factory/e39g12b4a_independent_score.py score "$token"
            done
            python tools/enterprise/e3_factory/e39g12b4a_independent_score.py summarize
            python tools/enterprise/e3_factory/e39g12b4d_trial_contract.py archive-arm "$arm"
          done
          python tools/enterprise/e3_factory/e39g12b4d_trial_contract.py summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b4d-independent-browser-compare
          path: target/e3-factory/e39g12b4d/
          if-no-files-found: warn
          retention-days: 10
  java-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21.0.12', cache: maven}
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test
