name: E3.9G-12B4K Two Real Qwen7B Model Repairs on Reviewed Public Fixtures
on:
  pull_request:
    branches: [test/e39g12b4j-locked-patch-browser-proof-20261025]
    paths:
      - 'tools/enterprise/e3_factory/e39g12b4k_*'
      - 'tools/enterprise/e3_factory/test_e39g12b4k_*'
      - 'tools/enterprise/e3_factory/run_locked_worker.sh'
      - 'docs/runtime/e39g12b4k-public-model-results-20261025.md'
      - '.github/workflows/runtime-e39g12b4k-real-model.yml'
      - 'README.md'
      - 'docs/runtime/roadmap-current-e3-through-e9-20261025.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-frozen-policy:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-2022]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - name: Original trusted typed gates and adversarial receipt tests
        run: |
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4k_two_real_model_trial.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b4j_typed_control_worker.py' -v
          python -m unittest discover -s tools/enterprise/e3_factory -p 'test_e39g12b2_isolation_policy.py' -v
          python tools/enterprise/skills_registry.py validate
          python tools/enterprise/e39g2_scoped_skill_advice.py check
          python tools/enterprise/e39g3_validate_java_skill_manifest.py verify
          python -m py_compile tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py
          python -m py_compile tools/enterprise/e3_factory/e39g12b4k_model_patch_worker.py
          python -m py_compile tools/enterprise/e3_factory/e39g12b4k_model_score.py
          node --check tools/enterprise/e3_factory/e39g12b4k_model_after_browser.mjs

  public-source-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Create only public broken-page prompts and no reference answers
        run: python tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4k-broken-only-two-model-prompts
          path: target/e3-factory/e39g12b4k/public-model-prompts.zip
          if-no-files-found: error
          retention-days: 10

  genuine-qwen7b-NO-CHECKOUT:
    needs: public-source-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MODEL: qwen2.5-coder:7b
      IMAGE: 'ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6'
    steps:
      # NO actions/checkout, no policy source, no positive references or secrets.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4k-broken-only-two-model-prompts, path: received/}
      - name: Assert no-checkout, exactly two known-public defective pages
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          for p in ('.git','README.md','tools','docs','skills','orchestrator-service'):
              assert not Path(p).exists(),p
          files=list(Path('received').rglob('*.zip'))
          assert len(files)==1
          with zipfile.ZipFile(files[0]) as z:
              assert z.namelist()==['prompts.json']
              p=json.loads(z.read('prompts.json'))
          assert p['order']==['focus','motion']
          assert p['goldenSolutionsIncluded'] is False
          assert p['referencesIncluded'] is False
          assert p['genuinelyHeldOut'] is False
          print('B4K_MODEL_JOB_BROKEN_ONLY_NO_GOLD')
          PY
      - name: Launch pinned resource-limited loopback Ollama
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name b4k-ollama --cpus 4 --memory 10g --memory-swap 10g \
            --pids-limit 128 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m --mount type=volume,dst=/root/.ollama \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -p 127.0.0.1:11434:11434 "$IMAGE"
          docker inspect b4k-ollama > "$RUNNER_TEMP/b4k-container.json"
          python3 - "$RUNNER_TEMP/b4k-container.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text())[0]['HostConfig']
          assert x['NanoCpus']==4000000000 and x['Memory']==10737418240
          assert x['ReadonlyRootfs'] and x['PidsLimit']==128
          assert 'ALL' in x['CapDrop'] and 'no-new-privileges' in x['SecurityOpt']
          assert x['PortBindings']['11434/tcp'][0]['HostIp']=='127.0.0.1'
          print('B4K_MODEL_CONTAINER_CONSTRAINED_LOOPBACK')
          PY
      - name: Verify Apache 2.0 model license and pull fixed digest prefix
        run: |
          timeout --signal=TERM --kill-after=5s 900s docker exec b4k-ollama ollama pull "$MODEL"
          docker exec b4k-ollama ollama show "$MODEL" --license > "$RUNNER_TEMP/b4k-license.txt"
          grep -Fq 'Apache License' "$RUNNER_TEMP/b4k-license.txt"
          grep -Fq 'Version 2.0' "$RUNNER_TEMP/b4k-license.txt"
      - name: Make exactly two genuine local inference calls, no reference
        run: |
          timeout --signal=TERM --kill-after=5s 1400s python3 - <<'PY'
          import hashlib,json,os,time,urllib.request,zipfile
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          files=list(Path('received').rglob('*.zip'));assert len(files)==1
          with zipfile.ZipFile(files[0]) as z:
              assert z.namelist()==['prompts.json']
              p=json.loads(z.read('prompts.json'))
          assert p['order']==['focus','motion'] and p['goldenSolutionsIncluded'] is False
          def call(method,endpoint,body=None):
              data=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request('http://127.0.0.1:11434'+endpoint,
                  data=data,method=method,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=310) as response:
                  return json.loads(response.read(500000))
          model=os.environ['MODEL']
          found=[x for x in call('GET','/api/tags').get('models',[]) if x.get('name')==model]
          assert len(found)==1
          meta=found[0]
          assert meta['digest'].removeprefix('sha256:').startswith('dae161e27b0e')
          assert 4000000000<=meta['size']<=5300000000
          trials={}
          for case in p['order']:
              item=p['trials'][case]
              assert sha(item['prompt'].encode())==item['promptSha256']
              now=time.monotonic()
              response=call('POST','/api/generate',{
                  'model':model,'stream':False,'format':'json',
                  'system':'Only return a strict JSON object. Never run tools, commands or network.',
                  'prompt':item['prompt'],'keep_alive':'2m',
                  'options':{'temperature':0,'num_predict':260,'num_ctx':4096,'num_thread':4}})
              elapsed=max(1,round((time.monotonic()-now)*1000))
              raw=response.get('response')
              assert response.get('model')==model and response.get('done') is True
              assert type(raw) is str and 0<len(raw.encode())<=1500
              assert type(response.get('eval_count')) is int and response['eval_count']>0
              trials[case]={
                  'case':case,'promptSha256':item['promptSha256'],
                  'sourceSha256':item['sourceSha256'],'rawModelResponse':raw,
                  'rawResponseSha256':sha(raw.encode()),
                  'generatedTokens':response['eval_count'],'elapsedWallMs':elapsed}
              print('B4K_REAL_MODEL_CALL',case,'tokens',response['eval_count'],flush=True)
          assert len(trials)==2
          receipt={
              'evidenceClass':'E39G12B4K_UNTRUSTED_TWO_GENUINE_LOCAL_RESPONSES',
              'modelTag':model,'realModelCalls':2,'trials':trials,
              'promptBundleSha256':sha(files[0].read_bytes()),
              'modelDigestSelfReported':meta['digest'],'modelSizeBytes':meta['size'],
              'ownerApprovalGranted':False,'referenceAvailableToModel':False,
              'productionAuthorized':False,'modelSourceEdited':False}
          out=Path('model-results');out.mkdir(exist_ok=False)
          (out/'model-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('B4K_TWO_REAL_QWEN7B_RESPONSES_RECEIVED')
          PY
      - name: Delete ephemeral Ollama model and weight volume
        if: always()
        run: docker rm -fv b4k-ollama || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4k-untrusted-genuine-qwen7b-replies
          path: model-results/model-receipt.json
          if-no-files-found: error
          retention-days: 10

  separate-reviewed-policy-and-chromium:
    needs: [public-source-inputs, genuine-qwen7b-NO-CHECKOUT]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4k-broken-only-two-model-prompts, path: received-public/}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: b4k-untrusted-genuine-qwen7b-replies, path: received-model/}
      - name: Regenerate exact broken prompts and validate untrusted receipt
        run: |
          set -euo pipefail
          python tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py pack
          cmp received-public/public-model-prompts.zip target/e3-factory/e39g12b4k/public-model-prompts.zip
          mkdir -p target/e3-factory/e39g12b4k/incoming
          cp received-model/model-receipt.json target/e3-factory/e39g12b4k/incoming/
          python tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py verify
          mkdir -p target/e3-factory/e39g12b4k/repairs
          python tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py prepare focus
          python tools/enterprise/e3_factory/e39g12b4k_two_real_model_trial.py prepare motion
      - name: Install pinned real browser for source-reviewed after-state only
        run: |
          npm install --prefix tools/enterprise/e3_factory --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tools/enterprise/e3_factory/node_modules/.bin/playwright install --with-deps chromium
      - name: Keep all denied model repairs as zero; fixed source-only network-none workers
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim-bookworm
          for case in focus motion; do
            if python3 - "$case" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads((Path('target/e3-factory/e39g12b4k/admission')/(sys.argv[1]+'.json')).read_text())
          assert r['ownerApprovalGranted'] is False and r['stage45Go'] is False
          sys.exit(0 if r['formatEligible'] is True else 1)
          PY
            then
              bash tools/enterprise/e3_factory/run_locked_worker.sh e39g12b4k-apply "$case"
              if python3 - "$case" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads((Path('target/e3-factory/e39g12b4k/repairs')/sys.argv[1]/'policy-report.json').read_text())
          assert r['ownerApprovalGranted'] is False and r['stage45Go'] is False
          assert r['policyOutcome'] in ('POLICY_APPLIED','POLICY_REJECTED')
          sys.exit(0 if r['policyOutcome']=='POLICY_APPLIED' else 1)
          PY
              then
                node tools/enterprise/e3_factory/e39g12b4k_model_after_browser.mjs "$case"
              fi
            fi
          done
          python tools/enterprise/e3_factory/e39g12b4k_model_score.py score
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b4k-two-genuine-qwen7b-fixed-policy-and-real-browser-score
          path: target/e3-factory/e39g12b4k/
          if-no-files-found: warn
          retention-days: 10
