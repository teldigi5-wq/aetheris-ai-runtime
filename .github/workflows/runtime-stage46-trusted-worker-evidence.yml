name: Runtime Stage 46.15 Trusted Synthetic Worker Evidence Gate

on:
  pull_request:
    branches:
      - feature/stage46-appcontainer-capability-lab-20261015
      - main
    paths:
      - 'workstation-agent/packaging/stage46/WindowsSyntheticAppContainerLab.cpp'
      - 'workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1'
      - 'tools/security/stage46_worker_trust_evidence.py'
      - 'tools/security/test_stage46_worker_trust_evidence.py'
      - 'docs/runtime/stage46-worker-trust-network-proof.md'
      - '.github/workflows/runtime-stage46-trusted-worker-evidence.yml'

permissions:
  contents: read

jobs:
  windows-native-positive-control-and-worker-trust:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Windows native AppContainer test, positive control and hash evidence
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_15_NATIVE_SECURITY_GATE_FAILED' }
      - name: Evaluate malformed and counterfeit evidence cases on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tools/security -p test_stage46_worker_trust_evidence.py -v
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_15_ADVERSARIAL_POLICY_TESTS_FAILED' }

  prior-windows-reduced-token-and-job:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile existing fixed Java probe
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_15_JAVA_COMPILE_FAILURE' }
      - name: Repeat Windows reduced-token and Job Object safeguards
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_13_REGRESSION_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_REGRESSION_FAILED' }

  linux-synthetic-voice-and-security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Repeat synthetic voice/STOP and owner-bound read tests
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Adversarial worker evidence policy
        run: python3 -m unittest discover -s tools/security -p test_stage46_worker_trust_evidence.py -v

  immutable-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: All 13 Stage 45 blockers must stay active
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-15-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-15-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as source: report=json.load(source)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_15_TRUSTED_WORKER_AND_NETWORK_PRODUCTION_NO_GO")
          PY

  complete-java-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Complete orchestrator Java test suite
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Workstation agent Java tests
        run: ./mvnw -B -f workstation-agent/pom.xml test

  conservative-no-device-and-evidence-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Deny confusing timeouts with explicit denial or unsigned hashes with trust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("workstation-agent/packaging/stage46")
          cpp=(p/"WindowsSyntheticAppContainerLab.cpp").read_text()
          runner=(p/"Test-SyntraWindowsAppContainerLab.ps1").read_text()
          policy=Path("tools/security/stage46_worker_trust_evidence.py").read_text()
          assert "STAGE46_15_LOOPBACK_POSITIVE_CONTROL_CONNECTED" in cpp
          assert "positiveLoopbackControl" in cpp
          assert "STAGE46_14_LOOPBACK_TIMEOUT_NETWORK_POLICY_INCONCLUSIVE" in cpp
          assert "Get-AuthenticodeSignature" in runner
          assert "Get-FileHash" in runner
          assert "tamperedHash" in runner and "STAGE46_15_WORKER_CHANGED_BEFORE_EXECUTION" in runner
          assert "network_egress_certified" in policy and '"NO_GO"' in policy
          for forbidden in ("TargetDataLine", "SourceDataLine",
                            "SyntraLoopbackModelClient", "VoiceSessionService", "OwnerPermit"):
              assert forbidden not in cpp, "New real-device/desktop capability is forbidden"
          print("STAGE46_15_UNTRUSTED_SIGNER_NETWORK_TIMEOUT_NO_DEVICE")
          PY
