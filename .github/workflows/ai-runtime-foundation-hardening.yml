name: AI Runtime Dependency Lockdown and Reproducibility

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feature/initial-runtime-extraction ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13.15'
  JAVA_VERSION: '21.0.12'
  PIP_TOOLS_VERSION: '7.6.1'
  PIP_AUDIT_VERSION: '2.10.1'

jobs:
  ai-runtime-dependency-lockdown:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Regenerate quant hash lock and detect drift
        run: |
          python -m pip install --disable-pip-version-check "pip-tools==${PIP_TOOLS_VERSION}"
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=aetheris-quant/requirements.lock.txt \
            aetheris-quant/requirements.in
          git diff --exit-code -- aetheris-quant/requirements.lock.txt
      - name: Frozen quant install
        run: python -m pip install --disable-pip-version-check --require-hashes -r aetheris-quant/requirements.lock.txt
      - name: Audit quant dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==${PIP_AUDIT_VERSION}"
          python -m pip_audit -r aetheris-quant/requirements.lock.txt --disable-pip
      - name: Compile quant sources
        run: python -m compileall -q aetheris-quant/app
      - name: Test reasoning primitives
        working-directory: aetheris-reasoning
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate AI-runtime Maven dependency trees
        run: |
          mkdir -p build-evidence/maven
          for module in orchestrator-service workstation-agent; do
            ./mvnw -f "$module/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
              -Dscope=runtime \
              -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/$module.txt"
          done
          git diff --exit-code -- build-evidence/maven/orchestrator-service.txt build-evidence/maven/workstation-agent.txt
      - name: Verify AI-runtime dependency-lockdown policy
        run: python scripts/check_dependency_lockdown.py --scope ai-runtime
      - name: Generate AI-runtime dependency evidence hashes
        run: python scripts/check_dependency_lockdown.py --scope ai-runtime --write-hashes
      - name: Upload AI-runtime dependency evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ai-runtime-dependency-evidence
          path: |
            build-evidence/ai-runtime-dependency-lock-sha256.txt
            build-evidence/maven/orchestrator-service.txt
            build-evidence/maven/workstation-agent.txt
            aetheris-quant/requirements.lock.txt
            aetheris-reasoning/pyproject.toml
          if-no-files-found: error

  ai-runtime-reproducible-build:
    runs-on: ubuntu-24.04
    needs: ai-runtime-dependency-lockdown
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build AI Java surfaces - pass 1
        run: |
          for module in orchestrator-service workstation-agent; do
            ./mvnw -f "$module/pom.xml" clean package
          done
      - name: Hash pass 1 artifacts
        run: |
          mkdir -p build-evidence/artifacts
          find orchestrator-service/target workstation-agent/target \
            -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum \
            > build-evidence/artifacts/ai-runtime-pass-1.sha256
      - name: Clean generated artifacts
        run: rm -rf orchestrator-service/target workstation-agent/target
      - name: Build AI Java surfaces - pass 2
        run: |
          for module in orchestrator-service workstation-agent; do
            ./mvnw -f "$module/pom.xml" clean package
          done
      - name: Hash pass 2 artifacts and compare
        run: |
          find orchestrator-service/target workstation-agent/target \
            -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum \
            > build-evidence/artifacts/ai-runtime-pass-2.sha256
          diff -u build-evidence/artifacts/ai-runtime-pass-1.sha256 build-evidence/artifacts/ai-runtime-pass-2.sha256
          cp build-evidence/artifacts/ai-runtime-pass-2.sha256 build-evidence/ai-runtime-artifact-sha256.txt
      - name: Upload AI-runtime reproducibility evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ai-runtime-reproducible-build-evidence
          path: |
            build-evidence/ai-runtime-artifact-sha256.txt
            build-evidence/artifacts/ai-runtime-pass-1.sha256
            build-evidence/artifacts/ai-runtime-pass-2.sha256
          if-no-files-found: error
