name: Enterprise Runtime Default Datasource Secret Refusal

on:
  pull_request:
    branches:
      - feature/enterprise-e39g12b4c-gstack-cinematic-readiness-20261021
    paths:
      - 'orchestrator-service/src/main/resources/application.properties'
      - 'tools/security/test_runtime_datasource_secrets.py'
      - '.github/workflows/runtime-datasource-secret-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-secret-static-refusal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Deny predictable production database defaults
        run: python -m unittest discover -s tools/security -p 'test_runtime_datasource_secrets.py' -v

  full-java-orchestrator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - run: ./mvnw -B -ntp -f orchestrator-service/pom.xml test
