name: Runtime Stage 46.16 WFP Read-only and Release Provenance Gate

on:
  pull_request:
    branches:
      - feature/stage46-trusted-worker-network-proof-20261015
      - main
    paths:
      - 'workstation-agent/packaging/stage46/WindowsSyntheticWfpReadOnlyProbe.cpp'
      - 'workstation-agent/packaging/stage46/Test-SyntraWindowsWfpReadOnly.ps1'
      - 'tools/security/stage46_wfp_provenance_gate.py'
      - 'tools/security/test_stage46_wfp_provenance_gate.py'
      - 'docs/runtime/stage46-wfp-readonly-provenance-no-go.md'
      - '.github/workflows/runtime-stage46-wfp-provenance-gate.yml'

permissions:
  contents: read

jobs:
  windows-wfp-readonly-and-release-trust:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Recheck positive-control synthetic AppContainer and unsigned binary
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsAppContainerLab.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_15_SYNTHETIC_PARENT_PROOF_FAILED' }
      - name: Read actual WFP ALE IPv4/IPv6 layer metadata without firewall mutation
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsWfpReadOnly.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_16_NATIVE_WFP_READ_ONLY_GATE_FAILED' }
      - name: Verify adversarial WFP and publisher-release evidence
        shell: pwsh
        run: |
          python -m unittest discover -s tools/security -p test_stage46_wfp_provenance_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_16_POLICY_REGRESSION' }

  windows-prior-reduced-token-job-regressions:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Compile inert Java test process
        shell: pwsh
        run: |
          .\mvnw.cmd -B -f orchestrator-service/pom.xml -DskipTests compile
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_16_JAVA_COMPILE_FAILED' }
      - name: Existing Job Object and privilege-reduced token tests
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsReducedTokenLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_13_REDUCED_TOKEN_REGRESSION_FAILED' }
          pwsh -NoProfile -NonInteractive -File ./workstation-agent/packaging/stage46/Test-SyntraWindowsJobLab.ps1 -ClassesPath ./orchestrator-service/target/classes
          if ($LASTEXITCODE -ne 0) { throw 'STAGE46_12_JOB_OBJECT_REGRESSION_FAILED' }

  linux-voice-and-adversarial-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Existing synthetic, owner-bound, STOP and child-process tests
        run: |
          ./mvnw -B -f orchestrator-service/pom.xml \
            -Dtest=SyntraSyntheticHostLimitsTest,SyntraSyntheticProcessSpeechBoundaryTest,SyntraSyntheticAsyncVoiceBoundaryTest,SyntraVoiceReadOnlyConversationBridgeTest,SyntraOfflineVoiceTurnCoordinatorTest,SyntraOfflineSpeechArtifactReviewTest,SyntraSyntheticAudioGateTest,SyntraSyntheticAudioTaskControlReviewTest,SyntheticVoiceOwnerConsentLabTest,SyntheticVoiceTaskControlReviewTest,VerifiedOwnerTaskReadTest test
      - name: Earlier worker trust and new WFP provenance adversarial tests
        run: |
          python3 -m unittest discover -s tools/security -p test_stage46_worker_trust_evidence.py -v
          python3 -m unittest discover -s tools/security -p test_stage46_wfp_provenance_gate.py -v

  immutable-13-blocker-production-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Stage 45 production release policy must remain immutable
        run: |
          python3 -m unittest discover -s tools/security -p test_stage45_pre_pilot_gate.py -v
          python3 tools/security/stage45_pre_pilot_gate.py > "$RUNNER_TEMP/stage46-16-no-go.json"
          python3 - "$RUNNER_TEMP/stage46-16-no-go.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as source: report=json.load(source)
          assert report["decision"]=="NO_GO" and len(report["release_blockers"])==13
          assert report["production_pilot_authorized"] is False
          assert report["agent_command_execution_authorized"] is False
          assert report["desktop_actions_authorized"] is False
          print("STAGE46_16_NETWORK_AND_SIGNED_RELEASE_PRODUCTION_NO_GO")
          PY

  full-orchestrator-and-workstation-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Full orchestrator JUnit regression
        run: ./mvnw -B -f orchestrator-service/pom.xml test
      - name: Existing workstation-agent JUnit regression
        run: ./mvnw -B -f workstation-agent/pom.xml test

  static-read-only-wfp-and-no-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce no WFP policy mutation and no real speech/device integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("workstation-agent/packaging/stage46")
          source=(p/"WindowsSyntheticWfpReadOnlyProbe.cpp").read_text(encoding="utf-8")
          script=(p/"Test-SyntraWindowsWfpReadOnly.ps1").read_text(encoding="utf-8")
          gate=Path("tools/security/stage46_wfp_provenance_gate.py").read_text(encoding="utf-8")
          required=("FwpmEngineOpen0", "FwpmLayerGetByKey0", "FwpmEngineClose0",
                    "FWPM_LAYER_ALE_AUTH_CONNECT_V4", "FWPM_LAYER_ALE_AUTH_CONNECT_V6",
                    "STAGE46_16_NO_CORRELATED_BLOCK_EVENT_EGRESS_UNVERIFIED")
          assert all(x in source for x in required), "REQUIRED_NONMUTATING_WFP_PROBE_MISSING"
          forbidden=("FwpmFilterAdd0(", "FwpmFilterDelete", "FwpmProviderAdd",
                     "FwpmSubLayerAdd", "FwpmEngineSetOption", "FwpmNetEventSubscribe",
                     "netsh ", "New-NetFirewallRule", "Set-NetFirewall", "Invoke-WebRequest",
                     "TargetDataLine", "SourceDataLine", "SyntraLoopbackModelClient")
          assert not any(s in source or s in script for s in forbidden), "WFP_MUTATION_OR_DEVICE_FORBIDDEN"
          assert "APPROVED_PUBLISHER_CERT_SHA256 = frozenset()" in gate
          assert "APPROVED_RELEASE_ARTIFACT_SHA256 = frozenset()" in gate
          assert '"decision": "NO_GO"' in gate
          print("STAGE46_16_READ_ONLY_WFP_UNAPPROVED_SIGNER_NO_DEVICE_GATE")
          PY
