spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aetheris}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aetheris}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

aetheris.local-model.base-url=${AETHERIS_LOCAL_MODEL_BASE_URL:http://localhost:11434}
aetheris.local-model.model=${AETHERIS_LOCAL_MODEL:qwen2.5:3b}

aetheris.syntra.owner-runtime.enabled=${AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED:false}
aetheris.syntra.owner-runtime.endpoint=${AETHERIS_SYNTRA_OWNER_RUNTIME_ENDPOINT:http://127.0.0.1:11434}

aetheris.execution.workspace-root=${AETHERIS_WORKSPACE_ROOT:./workspace}
aetheris.execution.workspace-write-enabled=${AETHERIS_WORKSPACE_WRITE_ENABLED:false}
aetheris.execution.max-file-bytes=${AETHERIS_MAX_FILE_BYTES:1048576}
aetheris.execution.allowed-commands=${AETHERIS_ALLOWED_COMMANDS:git,mvn,npm,node,java,javac}
aetheris.execution.command-timeout-seconds=${AETHERIS_COMMAND_TIMEOUT_SECONDS:30}
aetheris.execution.max-command-output-chars=${AETHERIS_MAX_COMMAND_OUTPUT_CHARS:12000}
aetheris.execution.github.allowed-repositories=${AETHERIS_GITHUB_ALLOWED_REPOSITORIES:}
aetheris.execution.github.credential-alias=${AETHERIS_GITHUB_CREDENTIAL_ALIAS:github-token}
aetheris.mcp.allowed-local-hosts=${AETHERIS_MCP_ALLOWED_LOCAL_HOSTS:localhost,127.0.0.1,::1,host.docker.internal}

aetheris.cloud-provider.enabled=${AETHERIS_CLOUD_PROVIDER_ENABLED:false}
aetheris.cloud-provider.id=${AETHERIS_CLOUD_PROVIDER_ID:cloud-compatible}
aetheris.cloud-provider.base-url=${AETHERIS_CLOUD_PROVIDER_BASE_URL:}
aetheris.cloud-provider.model=${AETHERIS_CLOUD_PROVIDER_MODEL:}
aetheris.cloud-provider.credential-alias=${AETHERIS_CLOUD_PROVIDER_CREDENTIAL_ALIAS:cloud-api-key}
aetheris.cloud-provider.zero-cost=${AETHERIS_CLOUD_PROVIDER_ZERO_COST:false}
aetheris.cloud-provider.daily-quota-units=${AETHERIS_CLOUD_PROVIDER_DAILY_QUOTA_UNITS:0}
aetheris.cloud-provider.cost-per-thousand-units-usd=${AETHERIS_CLOUD_PROVIDER_COST_PER_1000_USD:0}
aetheris.cloud-provider.daily-budget-usd=${AETHERIS_CLOUD_PROVIDER_DAILY_BUDGET_USD:0}

aetheris.providers.circuit-failure-threshold=${AETHERIS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:3}
aetheris.providers.circuit-cooldown-seconds=${AETHERIS_PROVIDER_CIRCUIT_COOLDOWN_SECONDS:60}

aetheris.host.signing-key=${AETHERIS_HOST_CONTROL_SIGNING_KEY:}
aetheris.host.simulation-only=${AETHERIS_HOST_SIMULATION_ONLY:true}
