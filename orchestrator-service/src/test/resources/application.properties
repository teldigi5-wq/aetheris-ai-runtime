spring.datasource.url=jdbc:h2:mem:orchestrator;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
aetheris.local-model.base-url=http://127.0.0.1:65534
aetheris.local-model.model=test-model
aetheris.execution.workspace-root=target/stage4-workspace
aetheris.execution.workspace-write-enabled=true
aetheris.execution.max-file-bytes=1048576
aetheris.execution.allowed-commands=java,git,mvn
aetheris.execution.command-timeout-seconds=20
aetheris.execution.max-command-output-chars=12000
aetheris.execution.github.allowed-repositories=teldigi5-wq/aetheris-platform
aetheris.mcp.allowed-local-hosts=localhost,127.0.0.1,::1
aetheris.host.signing-key=stage6-test-signing-key-0123456789abcdef
aetheris.host.simulation-only=true
aetheris.providers.circuit-failure-threshold=3
aetheris.providers.circuit-cooldown-seconds=60
# Keep integration tests deterministic: tests call dispatcher.tick() explicitly when needed.
aetheris.dispatcher.enabled=false
